<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8b5cf6">
    <title>Orkestro AI</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-dark: #000000;
            --bg-light: #1e1e1e;
            --text-primary: #ffffff;
            --accent: #8b5cf6;
            --font-main: 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }

        header {
            padding: 10px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0a0a0a;
        }

        .brand { font-weight: bold; letter-spacing: 1px; color: #fff; }
        
        /* Cycle Button Style */
        .model-tag {
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid #8b5cf6;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 15px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .model-tag:hover {
            background: #8b5cf6;
            color: white;
            transform: translateY(-1px);
        }

        /* Install Button (Hidden by default) */
        #installBtn {
            background: #333;
            border: 1px solid #666;
            color: white;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            display: none; 
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding-bottom: 20px;
        }

        .message-row {
            display: flex;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .message-row.ai { background-color: var(--bg-light); }
        .message-row.user { background-color: var(--bg-dark); }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 10px;
            background: var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem;
        }

        .content { line-height: 1.5; }

        /* Typing Indicator Animation */
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
            margin-right: 4px;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .input-area {
            padding: 15px;
            background: #0a0a0a;
            border-top: 1px solid #333;
        }

        .input-wrapper {
            display: flex;
            background: var(--bg-light);
            border-radius: 8px;
            padding: 5px;
            border: 1px solid #333;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            resize: none;
            outline: none;
            font-family: inherit;
            height: 24px;
        }

        #sendBtn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 0 15px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
    
    <!-- Libraries -->
    <script src="https://js.puter.com/v2/"></script>
    <script src="puter.js"></script>
</head>
<body>

    <header>
        <div class="brand">ORKESTRO <span id="configStatus" style="font-size:0.7em; color:#666;">(Connecting...)</span></div>
        
        <!-- Cycle Model Button -->
        <div style="display:flex; align-items:center;">
            <button id="modelBtn" class="model-tag" onclick="cycleModel()">GPT-4o</button>
            
            <div style="display:flex; gap:10px;">
                <button id="installBtn" onclick="installApp()">Install</button>
            </div>
        </div>
    </header>

    <div id="chat-container">
        <div class="message-row ai">
            <div class="avatar">AI</div>
            <div class="content">
                <p><strong>Orkestro AI is ready.</strong></p>
                <p>Click the <strong>Model Tag</strong> to switch AI modes (GPT-4o, Mini, Claude).</p>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="userInput" placeholder="Type here..." onkeydown="checkEnter(event)"></textarea>
            <button id="sendBtn" onclick="handleSend()">Send</button>
        </div>
    </div>

    <script>
        // --- PWA INSTALLATION LOGIC ---
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('installBtn');
            installBtn.style.display = 'block';
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('installBtn').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        }
    </script>

</body>
</html>
