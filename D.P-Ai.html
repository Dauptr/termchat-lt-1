<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniChat - Modular</title>
    <style>
        :root {
            --bg-dark: #343541;
            --bg-light: #444654;
            --text-primary: #ececf1;
            --text-secondary: #8e8ea0;
            --accent: #10a37f;
            --error: #ff4d4d;
            --border: #4d4d4f;
            --font-main: 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #202123;
            z-index: 10;
        }

        .brand { font-weight: bold; font-size: 1.1rem; letter-spacing: 1px; }
        
        .header-actions button {
            background: transparent;
            border: 1px solid var(--text-secondary);
            color: var(--text-primary);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-left: 10px;
        }
        
        .reset-btn { border-color: var(--error) !important; color: var(--error) !important; }
        .reset-btn:hover { background: rgba(255, 77, 77, 0.1) !important; }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            padding: 24px;
            width: 100%;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .message-row.ai { background-color: var(--bg-light); }
        .message-row.user { background-color: var(--bg-dark); }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            margin-right: 15px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
        }
        
        .ai .avatar { background-color: #555; }
        .user .avatar { background-color: var(--accent); }

        .content {
            flex: 1;
            line-height: 1.6;
            font-size: 1rem;
            word-wrap: break-word;
        }

        pre {
            background: black;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid #555;
        }
        
        code { font-family: monospace; color: #e0e0e0; }

        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--accent);
            border-radius: 50%;
            animation: bounce 1s infinite;
            margin-right: 3px;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .input-area {
            padding: 20px;
            background-color: var(--bg-dark);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-light);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: flex-end;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            resize: none;
            outline: none;
            font-family: var(--font-main);
            height: 24px;
            max-height: 100px;
        }

        #sendBtn {
            background: var(--accent);
            border: none;
            border-radius: 4px;
            width: 30px;
            height: 30px;
            color: white;
            cursor: pointer;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #debug-panel {
            background: #000;
            border-top: 2px solid var(--error);
            padding: 10px;
            font-family: monospace;
            font-size: 0.7rem;
            color: #0f0;
            max-height: 100px;
            overflow-y: auto;
        }
    </style>
    <!-- Load the Logic File -->
    <script src="putter.js"></script>
</head>
<body>

    <header>
        <div class="brand">OmniChat <span style="font-size:0.7em; color:var(--text-secondary);">Putter Loaded</span></div>
        <div class="header-actions">
            <button class="reset-btn" onclick="forceReset()">⚠️ Force Reset</button>
        </div>
    </header>

    <div id="chat-container">
        <div class="message-row ai">
            <div class="avatar">AI</div>
            <div class="content">
                <p>Logic is now in <code>putter.js</code>.</p>
                <p>The interface is in <code>index.html</code>.</p>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="userInput" placeholder="Type here..." onkeydown="checkEnter(event)"></textarea>
            <button id="sendBtn" onclick="handleSend()">
                ➤
            </button>
        </div>
    </div>

    <!-- Debug Console -->
    <div id="debug-panel">> Initializing putter.js...</div>

</body>
</html>
