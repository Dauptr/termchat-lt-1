<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMOS NEXUS</title>
    
    <!-- Load Paho MQTT via CDN (or use local file if preferred) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

    <style>
        /* --- RESET & BASIC SETUP --- */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- CRT SCANLINE EFFECT --- */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* --- HEADER --- */
        header {
            background: #001100;
            border-bottom: 2px solid #0f0;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
        }
        .brand { font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 5px #0f0; }
        .status { font-size: 0.8em; }
        .status.online { color: #0f0; }
        .status.offline { color: #f00; animation: blink 1s infinite; }

        /* --- MAIN CHAT AREA --- */
        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .msg {
            margin-bottom: 10px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .msg .meta {
            opacity: 0.7;
            font-size: 0.8em;
            margin-right: 8px;
        }
        .msg.kernel { color: #00ffff; text-shadow: 0 0 5px #00ffff; font-weight: bold; }
        .msg.user { color: #0f0; }
        .msg.system { color: #ffff00; font-style: italic; }
        .cmd-highlight { background: #222; padding: 2px 4px; border: 1px solid #444; }

        /* --- INPUT AREA --- */
        #input-area {
            background: #001100;
            border-top: 2px solid #0f0;
            padding: 15px;
            display: flex;
            align-items: center;
            z-index: 5;
        }
        .prompt { margin-right: 10px; font-weight: bold; }
        
        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
            outline: none;
        }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #0f0; }

        /* --- ANIMATIONS --- */
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .fade-in { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <header>
        <div class="brand">TERMOS <span style="font-size:0.6em">NEXUS</span></div>
        <div id="status-indicator" class="status offline">● DISCONNECTED</div>
    </header>

    <div id="chat-window">
        <div class="msg system">Initializing TermOS NEXUS v1.0...</div>
        <div class="msg system">Connecting to Neural Grid (MQTT)...</div>
        <div class="msg system">Waiting for user identification...</div>
    </div>

    <div id="input-area">
        <span class="prompt">USER@NEXUS:~$</span>
        <input type="text" id="msg-input" placeholder="Enter command or message..." autocomplete="off" autofocus>
    </div>

    <script>
        // --- CONFIGURATION ---
        const MQTT_BROKER = "broker.emqx.io";
        const MQTT_PORT = 8083; // WebSocket port (Standard for browsers)
        const MQTT_PATH = "/mqtt";
        
        // Generate a random ID for this session
        const CLIENT_ID = "termos_user_" + Math.random().toString(16).substr(2, 8);
        let username = "Guest_" + Math.floor(Math.random() * 1000);
        let isAdmin = false;
        let adminToken = ""; // Set if user logs in

        // --- DOM ELEMENTS ---
        const chatWindow = document.getElementById('chat-window');
        const msgInput = document.getElementById('msg-input');
        const statusInd = document.getElementById('status-indicator');

        // --- MQTT CLIENT ---
        let client = new Paho.MQTT.Client(MQTT_BROKER, MQTT_PORT, MQTT_PATH, CLIENT_ID);

        // --- CONNECT OPTIONS ---
        const options = {
            timeout: 3,
            useSSL: false,
            cleanSession: true,
            onSuccess: onConnect,
            onFailure: onFailure
        };

        console.log("[JS] Attempting connection...");
        client.connect(options);

        // --- MQTT CALLBACKS ---
        function onConnect() {
            console.log("[MQTT] Connected");
            statusInd.innerText = "● ONLINE";
            statusInd.className = "status online";
            addSystemMessage("Connection established. Identity: " + CLIENT_ID);

            // Subscribe to all nexus chats
            client.subscribe("termos/nexus/+");
            
            // Initial greeting to Kernel (AI)
            publishMessage("/identify", "System Online");
        }

        function onFailure(responseObject) {
            console.log("[MQTT] Connection failed: " + responseObject.errorMessage);
            statusInd.innerText = "● ERROR: " + responseObject.errorMessage;
        }

        function onMessageArrived(message) {
            const topic = message.topic;
            const payload = message.payloadString;
            
            console.log("[IN] " + topic + ": " + payload);

            // Parse Payload
            let data = {};
            try {
                data = JSON.parse(payload);
            } catch (e) {
                // If not JSON, treat as raw text
                data = { msg: payload, sender: "Unknown" };
            }

            // Handle Message Logic
            // 1. Check if it's a System Command from Kernel
            if (data.sender === "KERNEL" || data.sender === "TermOS") {
                if (data.type === "mutation") {
                    // Execute UI Mutation Command
                    handleMutation(data.data);
                } else {
                    // Standard Chat from Kernel
                    addKernelMessage(data.msg);
                }
            } else {
                // Standard Chat from Users
                // Extract username from topic (e.g., termos/nexus/MyUser)
                let user = topic.split('/').pop() || "Unknown";
                
                // If data has sender field, use it
                if (data.sender) user = data.sender;
                
                // Don't show my own messages (handled locally) unless loopback
                if (!user.includes(CLIENT_ID)) {
                    addUserMessage(user, data.msg || data.content || payload);
                }
            }
        }

        client.onMessageArrived = onMessageArrived;

        // --- UI FUNCTIONS ---

        function scrollToBottom() {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = "msg system fade-in";
            div.innerText = `[SYS] ${text}`;
            chatWindow.appendChild(div);
            scrollToBottom();
        }

        function addUserMessage(user, text) {
            const div = document.createElement('div');
            div.className = "msg user fade-in";
            div.innerHTML = `<span class="meta">[${user}]</span> ${escapeHtml(text)}`;
            chatWindow.appendChild(div);
            scrollToBottom();
        }

        function addKernelMessage(text) {
            const div = document.createElement('div');
            div.className = "msg kernel fade-in";
            div.innerText = `[KERNEL] ${text}`;
            chatWindow.appendChild(div);
            scrollToBottom();
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        // --- LOGIC & COMMANDS ---

        function publishMessage(topicSuffix, payloadObj) {
            const topic = "termos/nexus/" + topicSuffix;
            const message = new Paho.MQTT.Message(JSON.stringify(payloadObj));
            message.destinationName = topic;
            client.send(message);
        }

        function handleInput() {
            const text = msgInput.value.trim();
            if (!text) return;

            // 1. Display locally immediately
            addUserMessage(username, text);

            // 2. Handle Special Commands (Client-side)
            if (text.startsWith("/name ")) {
                username = text.substring(6);
                addSystemMessage("Identity updated to: " + username);
            } 
            else if (text.startsWith("/token ")) {
                adminToken = text.substring(7);
                isAdmin = true;
                addSystemMessage("Admin Token Accepted. God Mode Active.");
            }
            else if (text.startsWith("/exec ") && isAdmin) {
                const cmd = text.substring(6);
                executeRemoteShell(cmd);
            }
            else {
                // 3. Publish to MQTT (For P2P Chat)
                // Send to general nexus so others see it
                publishMessage(username, { 
                    sender: username, 
                    msg: text, 
                    timestamp: new Date().toISOString() 
                });

                // 4. Trigger AI Kernel (Send to 'termos/input')
                // We send a simplified version for the backend to process
                const aiTriggerMsg = new Paho.MQTT.Message(text);
                aiTriggerMsg.destinationName = "termos/input";
                client.send(aiTriggerMsg);
            }

            msgInput.value = '';
            scrollToBottom();
        }

        // --- GOD MODE (HTTP EXEC) ---
        async function executeRemoteShell(command) {
            addSystemMessage(`Executing remote command: ${command}...`);
            
            try {
                // We assume backend runs on same host, port 10000 (default in your python script)
                // If running locally, use window.location.host
                const host = window.location.hostname;
                const port = 10000;
                
                const response = await fetch(`http://${host}:${port}/exec`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: adminToken,
                        command: command
                    })
                });

                const result = await response.json();
                
                if (response.ok) {
                    addKernelMessage(`[EXEC RESULT]\n${result.output}`);
                } else {
                    addSystemMessage("Exec Failed: Unauthorized or Server Error");
                }
            } catch (e) {
                addSystemMessage("Exec Failed: Connection to Python Backend refused.");
            }
        }

        // --- MUTATION HANDLER (AI UI CONTROL) ---
        function handleMutation(data) {
            addSystemMessage(`Received Mutation Command: ${JSON.stringify(data)}`);
            
            if (data.command === "install_theme") {
                const name = data.args || "default";
                document.body.style.color = name;
                document.querySelector('header').style.borderColor = name;
                addSystemMessage(`Theme mutated to: ${name}`);
            } 
            else if (data.command === "add_animation") {
                const anim = document.createElement('div');
                anim.style.position = 'fixed';
                anim.style.top = '50%';
                anim.style.left = '50%';
                anim.style.transform = 'translate(-50%, -50%)';
                anim.style.fontSize = '100px';
                anim.style.color = '#f0f';
                anim.style.zIndex = '999';
                anim.innerText = "🤖";
                document.body.appendChild(anim);
                setTimeout(() => anim.remove(), 2000);
            }
        }

        // --- EVENT LISTENERS ---
        msgInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleInput();
        });

    </script>
</body>
</html>
