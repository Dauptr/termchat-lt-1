<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TermOS: UNIVERSE GENESIS</title>
    <meta name="theme-color" content="#050505">
    
    <!-- EXTERNAL LIBRARIES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;600&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

    <style>
        /* --- VISUAL CORE --- */
        :root {
            --glass-bg: rgba(10, 10, 20, 0.65);
            --glass-border: rgba(100, 200, 255, 0.1);
            --accent-primary: #a855f7; /* Purple */
            --accent-secondary: #06b6d4; /* Cyan */
            --accent-bio: #00ff9d; /* Bio Green */
            --msg-user-bg: linear-gradient(135deg, rgba(168, 85, 247, 0.9), rgba(79, 70, 229, 0.9));
            --msg-ai-bg: rgba(15, 23, 42, 0.9);
            --neon-glow: 0 0 20px rgba(168, 85, 247, 0.4);
            --aurora-1: rgba(0, 255, 157, 0.15);
            --aurora-2: rgba(6, 182, 212, 0.15);
            --aurora-3: rgba(168, 85, 247, 0.15);
        }

        body {
            background: #000;
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            margin: 0;
            height: 100vh;
        }

        /* --- UNIVERSE CANVAS --- */
        #universe-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none; /* Let clicks pass through */
        }

        /* --- UI COMPONENTS --- */
        .font-header { font-family: 'Orbitron', sans-serif; }
        .font-mono { font-family: 'Fira Code', monospace; }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: var(--neon-glow), inset 0 0 10px rgba(255,255,255,0.05);
        }

        .bio-button {
            background: linear-gradient(90deg, rgba(0,255,157,0.1), rgba(6,182,212,0.1));
            border: 1px solid rgba(0,255,157,0.3);
            transition: all 0.3s;
        }
        .bio-button:hover {
            background: linear-gradient(90deg, rgba(0,255,157,0.3), rgba(6,182,212,0.3));
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 2px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* Animations */
        @keyframes pulse-bio {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.95); }
        }
        .animate-pulse-bio { animation: pulse-bio 3s infinite ease-in-out; }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-anim { animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Utility Classes */
        .hidden-vis { display: none !important; opacity: 0; pointer-events: none; }
        .visible-vis { display: flex !important; opacity: 1; pointer-events: auto; }
        
        .avatar-gradient { background: linear-gradient(135deg, #06b6d4, #a855f7); }
        
        /* Code Editor */
        .code-editor {
            width: 100%;
            height: 100%;
            background: #020617;
            color: #a855f7;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            border: none;
            resize: none;
            outline: none;
            padding: 1rem;
        }

        /* Boot Loader */
        #boot-screen {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease;
        }
        .loader-ring {
            width: 80px; height: 80px; border: 4px solid #333; border-top: 4px solid var(--accent-bio);
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body class="text-gray-100">

    <!-- VISUALS -->
    <canvas id="universe-canvas"></canvas>

    <!-- BOOT SCREEN -->
    <div id="boot-screen">
        <div class="loader-ring mb-6 animate-pulse"></div>
        <h1 class="text-4xl font-header text-white tracking-[0.2em] mb-2">TERMOS <span class="text-[var(--accent-bio)]">GENESIS</span></h1>
        <div class="mt-4 text-cyan-500 font-mono text-xs flex flex-col items-center">
            <span id="boot-text">INITIALIZING BIO-ENGINE...</span>
            <div class="w-48 h-1 bg-gray-800 mt-2 rounded overflow-hidden">
                <div id="boot-progress" class="h-full bg-[var(--accent-bio)] w-0 transition-all duration-300"></div>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="fixed top-0 w-full z-50 px-4 py-3 border-b border-white/5 bg-black/40 backdrop-blur-md flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg border border-[var(--accent-bio)] flex items-center justify-center shadow-[0_0_15px_rgba(0,255,157,0.3)] bg-black/50">
                <svg class="w-6 h-6 text-[var(--accent-bio)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="font-header font-bold text-lg tracking-wider text-white">TERMOS</h1>
                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-[var(--accent-bio)]/10 text-[var(--accent-bio)] border border-[var(--accent-bio)]/30 font-mono">GENESIS</span>
                </div>
                <div class="flex items-center gap-2 text-[10px] text-gray-400 font-mono">
                    <div id="api-status-dot" class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                    <span id="status-text">OFFLINE</span>
                    <span id="room-indicator" class="hidden text-cyan-400">🪐 <span id="current-room">PUBLIC</span></span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="toggleMediaPanel()" class="bio-button px-3 py-1.5 rounded-lg text-xs font-bold text-[var(--accent-bio)] uppercase tracking-wider hidden md:block">Media Deck</button>
            <button onclick="triggerKernel()" class="bg-purple-900/20 hover:bg-purple-900/40 border border-purple-500/30 px-3 py-1.5 rounded-lg text-xs font-bold text-purple-300 uppercase hidden md:block">Kernel AI</button>
            <button onclick="toggleAdmin()" class="bg-white/5 hover:bg-white/10 border border-white/10 px-3 py-1.5 rounded-lg text-xs font-bold text-gray-300 uppercase hidden md:block">System</button>
            <div class="flex flex-col items-end text-right">
                <span class="text-[10px] text-gray-400 font-mono">CREDITS</span>
                <span id="xp-display" class="text-xs font-bold text-[var(--accent-bio)]">0 XP</span>
            </div>
        </div>
    </header>

    <!-- MAIN CHAT INTERFACE -->
    <main id="chat-interface" class="fixed inset-0 z-10 pt-20 pb-24 px-4 flex flex-col max-w-4xl mx-auto w-full">
        <div id="chat-container" class="flex-1 overflow-y-auto space-y-4 scroll-smooth pr-2 pb-4">
            <!-- Messages will appear here -->
        </div>
    </main>

    <!-- INPUT AREA -->
    <div class="fixed bottom-0 w-full z-30 p-4 bg-gradient-to-t from-black via-black/90 to-transparent">
        <div class="max-w-4xl mx-auto glass-panel rounded-2xl p-2 flex items-center gap-2 border border-[var(--accent-bio)]/30 shadow-[0_0_30px_rgba(0,0,0,0.5)]">
            <button onclick="attachFile()" class="p-3 text-gray-400 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
            </button>
            <input type="text" id="user-input" placeholder="System Command: /ai, /join [room], /evolve..." 
                   class="flex-1 bg-transparent border-none outline-none text-white px-4 py-3 text-sm font-light placeholder-gray-500 font-mono">
            <button onclick="handleInput()" class="bg-gradient-to-r from-[var(--accent-bio)] to-cyan-600 hover:opacity-90 text-black px-6 py-2 rounded-xl font-bold text-xs uppercase tracking-wider shadow-[0_0_20px_rgba(0,255,157,0.4)] transition-all">
                Transmit
            </button>
        </div>
    </div>

    <!-- MODALS & PANELS -->

    <!-- ADMIN / CODE EDITOR -->
    <div id="admin-panel" class="fixed inset-0 z-50 bg-black/90 hidden-vis flex-col">
        <div class="h-full flex flex-col p-4">
            <div class="flex justify-between items-center mb-4 border-b border-white/10 pb-4">
                <h2 class="font-header text-xl text-white flex items-center gap-2">
                    <span class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></span> SYSTEM CONSOLE
                </h2>
                <div class="flex gap-2">
                    <button onclick="applyCode()" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded text-xs font-bold">APPLY CODE</button>
                    <button onclick="toggleAdmin()" class="text-gray-400 hover:text-white px-4 py-2">✖</button>
                </div>
            </div>
            <textarea id="code-editor" class="code-editor flex-1 rounded-lg border border-white/10" spellcheck="false"></textarea>
            <div class="mt-2 text-center text-[10px] text-gray-500 font-mono">
                Editing DOM Directly. Changes take effect immediately.
            </div>
        </div>
    </div>

    <!-- MEDIA DECK -->
    <div id="media-panel" class="fixed bottom-24 right-4 w-80 md:w-96 glass-panel rounded-2xl z-40 hidden-vis flex-col overflow-hidden border border-[var(--accent-secondary)]/30">
        <div class="flex justify-between items-center p-4 border-b border-white/10 bg-black/40">
            <h3 class="text-sm font-bold text-white tracking-widest">MEDIA DECK</h3>
            <button onclick="toggleMediaPanel()" class="text-gray-400 hover:text-white">✖</button>
        </div>
        <div class="p-4 space-y-4">
            <!-- Video -->
            <div class="aspect-video bg-black rounded-lg border border-white/10 overflow-hidden relative group">
                <video id="main-video" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity" controls></video>
                <div id="video-placeholder" class="absolute inset-0 flex items-center justify-center text-gray-500 text-xs font-mono pointer-events-none">
                    [ NO SIGNAL ]
                </div>
            </div>
            <!-- Radio -->
            <div class="space-y-2">
                <div class="text-[10px] text-gray-400 uppercase tracking-widest">Frequencies</div>
                <div onclick="playRadio('https://streams.ilovemusic.com/iloveradio17.mp3')" class="cursor-pointer p-3 rounded bg-white/5 hover:bg-white/10 border border-white/5 flex justify-between items-center group">
                    <span class="text-sm font-bold text-cyan-300 group-hover:text-cyan-100">Cyberpunk FM</span>
                    <div class="w-2 h-2 rounded-full bg-gray-600 group-hover:bg-cyan-400"></div>
                </div>
                <div onclick="playRadio('https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3')" class="cursor-pointer p-3 rounded bg-white/5 hover:bg-white/10 border border-white/5 flex justify-between items-center group">
                    <span class="text-sm font-bold text-purple-300 group-hover:text-purple-100">Deep Space Lofi</span>
                    <div class="w-2 h-2 rounded-full bg-gray-600 group-hover:bg-purple-400"></div>
                </div>
            </div>
            <!-- Input -->
            <div class="flex gap-2">
                <input type="text" id="video-url" placeholder="Paste Stream URL (.mp4/.m3u8)" class="flex-1 bg-black/50 border border-white/10 rounded px-3 py-2 text-xs text-white focus:border-cyan-500 outline-none">
                <button onclick="playVideoInput()" class="bg-cyan-600/20 hover:bg-cyan-600/40 text-cyan-300 px-3 rounded text-xs font-bold border border-cyan-500/30">BROADCAST</button>
            </div>
        </div>
    </div>

    <!-- JOIN ROOM MODAL -->
    <div id="join-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden-vis flex items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-2xl max-w-sm w-full border border-[var(--accent-primary)]/50 shadow-[0_0_50px_rgba(168,85,247,0.2)] text-center">
            <h3 class="text-xl font-header text-white mb-2">ENTER FREQUENCY</h3>
            <p class="text-xs text-gray-400 mb-6 font-mono">Establish secure link to private sector.</p>
            <input type="text" id="room-name-input" placeholder="SECTOR NAME" class="w-full bg-black/50 border border-[var(--accent-primary)]/30 rounded-xl p-4 text-center text-white font-mono mb-6 focus:outline-none focus:border-[var(--accent-primary)]">
            <div class="flex gap-3">
                <button onclick="joinRoom()" class="flex-1 bg-[var(--accent-primary)] hover:bg-purple-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-purple-900/40">INITIALIZE</button>
                <button onclick="document.getElementById('join-modal').classList.replace('visible-vis','hidden-vis')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl">ABORT</button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT ENGINE -->
    <script>
        // --- 1. UNIVERSE ENGINE (VISUALS) ---
        const canvas = document.getElementById('universe-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let stars = [];
        let planets = [];
        let organicNodes = []; // The "Microorganism" feel
        let mouse = { x: 0, y: 0 };
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
            initPlanets();
        }

        function initStars() {
            stars = [];
            for(let i=0; i<800; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * width,
                    o: Math.random() // opacity offset
                });
            }
        }

        function initPlanets() {
            // Generate background floating planets
            planets = [
                { x: width*0.8, y: height*0.2, r: 60, color: '#4f46e5', ring: true },
                { x: width*0.1, y: height*0.7, r: 120, color: '#be185d', ring: false },
                { x: width*0.5, y: height*0.1, r: 30, color: '#06b6d4', ring: true }
            ];
        }

        // Aurora/Noise Function
        function getAuroraColor(x, y, t) {
            // Create flowing bands of color
            const v1 = Math.sin(x * 0.002 + t * 0.5);
            const v2 = Math.cos(y * 0.003 - t * 0.2);
            const v3 = Math.sin((x+y) * 0.001 + t * 0.8);
            
            const mix = (v1 + v2 + v3) / 3;
            
            if (mix > 0.5) return 'rgba(0, 255, 157, 0.05)'; // Bio Green
            if (mix > 0.2) return 'rgba(6, 182, 212, 0.05)'; // Cyan
            return 'rgba(168, 85, 247, 0.05)'; // Purple
        }

        function draw() {
            time += 0.005;
            
            // 1. Deep Space Background + Aurora
            // Create a dynamic gradient based on aurora math
            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#020205');
            gradient.addColorStop(0.5, '#050a14');
            gradient.addColorStop(1, '#020205');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // 2. Draw Aurora Clouds (Simulated with large overlapping circles or paths)
            // For performance in 2D, we use large blurred gradients moving in sine waves
            ctx.globalCompositeOperation = 'screen';
            
            // Green Wave
            const gY = height/2 + Math.sin(time) * 100;
            const gGrad = ctx.createRadialGradient(width/2, gY, 0, width/2, gY, width);
            gGrad.addColorStop(0, 'rgba(0, 255, 157, 0.1)');
            gGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = gGrad;
            ctx.fillRect(0,0,width,height);

            // Purple Wave
            const pY = height/2 + Math.cos(time * 0.8) * 150;
            const pGrad = ctx.createRadialGradient(width/2, pY, 0, width/2, pY, width);
            pGrad.addColorStop(0, 'rgba(168, 85, 247, 0.08)');
            pGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = pGrad;
            ctx.fillRect(0,0,width,height);

            ctx.globalCompositeOperation = 'source-over';

            // 3. Draw Planets (Parallax)
            planets.forEach(p => {
                const parallaxX = (mouse.x - width/2) * 0.02 * (p.r/50);
                const parallaxY = (mouse.y - height/2) * 0.02 * (p.r/50);
                
                ctx.beginPath();
                ctx.arc(p.x + parallaxX, p.y + parallaxY, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 40;
                ctx.shadowColor = p.color;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Ring
                if(p.ring) {
                    ctx.beginPath();
                    ctx.ellipse(p.x + parallaxX, p.y + parallaxY, p.r * 1.8, p.r * 0.4, Math.PI / 8, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                    ctx.lineWidth = 10;
                    ctx.stroke();
                }
            });

            // 4. Organic "Microorganism" Growth (Interactive Particles)
            // Particles that float towards the mouse like spores/energy
            ctx.fillStyle = '#00ff9d';
            for(let i=0; i<organicNodes.length; i++) {
                const p = organicNodes[i];
                const dx = mouse.x - p.x;
                const dy = mouse.y - p.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                // Move towards mouse gently
                p.x += dx * 0.001;
                p.y += dy * 0.001;
                
                // Wiggle
                p.x += Math.sin(time * 5 + p.y * 0.05) * 0.5;
                p.y += Math.cos(time * 3 + p.x * 0.05) * 0.5;

                ctx.globalAlpha = Math.max(0, 1 - dist/500); // Fade out near mouse
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // 5. Starfield (Warp speed effect)
            ctx.fillStyle = '#FFF';
            stars.forEach(star => {
                star.z -= 2; // Speed
                if(star.z <= 0) {
                    star.z = width;
                    star.x = Math.random() * width;
                    star.y = Math.random() * height;
                }
                
                const k = 128.0 / star.z;
                const px = star.x * k + width / 2;
                const py = star.y * k + height / 2;
                
                if(px >= 0 && px <= width && py >= 0 && py <= height) {
                    const size = (1 - star.z / width) * 2.5;
                    const shade = parseInt((1 - star.z / width) * 255);
                    ctx.fillStyle = `rgb(${shade},${shade},${shade})`;
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            requestAnimationFrame(draw);
        }

        // --- 2. LOGIC CORE (State & MQTT) ---
        const MQTT_BROKER = "wss://broker.emqx.io:8084/mqtt";
        const PUBLIC_TOPIC = "termos/genesis/public";
        let mqttClient = null;
        let clientId = "User_" + Math.floor(Math.random() * 100000);
        let currentRoom = PUBLIC_TOPIC;
        let username = localStorage.getItem('termos_nick') || "Traveler_" + Math.floor(Math.random() * 99);
        let groqKey = localStorage.getItem('termos_groq') || "";
        let userXP = parseInt(localStorage.getItem('termos_xp') || "0");
        
        // Init Organic Nodes
        for(let i=0; i<50; i++) {
            organicNodes.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 2 + 1
            });
        }

        // --- 3. UI FUNCTIONS ---
        
        // Boot Sequence
        window.onload = () => {
            resize();
            draw();
            window.addEventListener('resize', resize);
            window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

            // Fake Boot Progress
            let progress = 0;
            const bar = document.getElementById('boot-progress');
            const txt = document.getElementById('boot-text');
            const interval = setInterval(() => {
                progress += Math.random() * 5;
                if(progress > 100) progress = 100;
                bar.style.width = progress + '%';
                
                if(progress > 30) txt.innerText = "LOADING NEURAL MAPS...";
                if(progress > 70) txt.innerText = "CONNECTING TO SATELLITE...";

                if(progress === 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('boot-screen').style.opacity = '0';
                        setTimeout(() => document.getElementById('boot-screen').remove(), 1000);
                        startApp();
                    }, 500);
                }
            }, 50);
        };

        function startApp() {
            updateStatus(false);
            connectMQTT();
            document.getElementById('xp-display').innerText = userXP + " XP";
            
            // Check for API Key
            if(!groqKey) {
                setTimeout(() => addSystemMessage("⚠️ SYSTEM: Neural link incomplete. /setkey [groq_key] to enable AI."), 2000);
            } else {
                updateStatus(true);
            }
        }

        function connectMQTT() {
            if(typeof Paho === 'undefined') return;
            mqttClient = new Paho.MQTT.Client(MQTT_BROKER, clientId);
            
            mqttClient.onConnectionLost = (r) => {
                updateStatus(false);
                addSystemMessage("⚠️ CONNECTION LOST. RETRYING...");
                setTimeout(connectMQTT, 5000);
            };
            
            mqttClient.onMessageArrived = (msg) => {
                try {
                    const data = JSON.parse(msg.payloadString);
                    if(msg.destinationName === currentRoom && data.id !== clientId) {
                        addChatMessage(data.nick, data.text, 'other');
                    }
                } catch(e) {}
            };

            mqttClient.connect({
                onSuccess: () => {
                    updateStatus(true);
                    mqttClient.subscribe(currentRoom, {qos: 0});
                    addSystemMessage("📡 UPLINK ESTABLISHED. WELCOME TO GENESIS.");
                },
                onFailure: () => {
                    updateStatus(false);
                    setTimeout(connectMQTT, 5000);
                }
            });
        }

        function updateStatus(online) {
            const dot = document.getElementById('api-status-dot');
            const txt = document.getElementById('status-text');
            if(online) {
                dot.className = "w-2 h-2 rounded-full bg-[var(--accent-bio)] shadow-[0_0_8px_#00ff9d]";
                txt.innerText = "ONLINE";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-red-500 animate-pulse";
                txt.innerText = "OFFLINE";
            }
        }

        // --- 4. INTERACTION LOGIC ---

        function handleInput() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text) return;

            // Commands
            if(text.startsWith('/')) {
                processCommand(text);
            } else {
                // Chat
                addChatMessage("You", text, 'self');
                broadcast(text);
                addXP(1);
            }

            input.value = '';
        }

        function processCommand(cmd) {
            const parts = cmd.split(' ');
            const action = parts[0].toLowerCase();

            switch(action) {
                case '/clear':
                    document.getElementById('chat-container').innerHTML = '';
                    break;
                case '/help':
                    addSystemMessage("COMMANDS: /ai [prompt], /join [room], /setkey [key], /clear, /evolve [idea]");
                    break;
                case '/join':
                    document.getElementById('join-modal').classList.replace('hidden-vis','visible-vis');
                    document.getElementById('room-name-input').focus();
                    break;
                case '/setkey':
                    const key = parts[1];
                    if(key) {
                        groqKey = key;
                        localStorage.setItem('termos_groq', key);
                        updateStatus(true);
                        addSystemMessage("✅ NEURAL KEY UPDATED.");
                    } else {
                        addSystemMessage("❌ USAGE: /setkey [your_groq_api_key]");
                    }
                    break;
                case '/ai':
                case '/kernel':
                    const prompt = text.substring(action.length).trim();
                    if(!prompt) return addSystemMessage("❌ USAGE: /ai tell me about the universe");
                    triggerAI(prompt);
                    break;
                case '/evolve':
                    const ePrompt = text.substring(8).trim();
                    if(!ePrompt) return addSystemMessage("❌ USAGE: /evolve change background to red");
                    triggerAI(ePrompt, true); // true = code mode
                    break;
                case '/admin':
                    toggleAdmin();
                    break;
                default:
                    addSystemMessage("❌ UNKNOWN COMMAND");
            }
        }

        function broadcast(text) {
            if(!mqttClient || !mqttClient.isConnected()) return;
            const msg = {
                id: clientId,
                nick: username,
                text: text,
                timestamp: Date.now()
            };
            mqttClient.send(new Paho.MQTT.Message(JSON.stringify(msg)));
        }

        function joinRoom() {
            const name = document.getElementById('room-name-input').value.trim();
            if(!name) return;
            
            if(mqttClient && mqttClient.isConnected()) {
                mqttClient.unsubscribe(currentRoom);
                currentRoom = "termos/genesis/rooms/" + name;
                mqttClient.subscribe(currentRoom);
                
                document.getElementById('room-indicator').classList.remove('hidden');
                document.getElementById('current-room').innerText = name;
                
                document.getElementById('join-modal').classList.replace('visible-vis','hidden-vis');
                addSystemMessage(`🪐 ENTERED SECTOR: ${name.toUpperCase()}`);
                broadcast("has entered the sector.");
            }
        }

        // --- 5. AI ENGINE (Groq) ---

        async function triggerAI(prompt, isCode = false) {
            if(!groqKey) {
                addSystemMessage("❌ AI OFFLINE. SET KEY WITH /setkey");
                return;
            }

            const loadingId = "ai-" + Date.now();
            addSystemMessage(`🧠 SYNTHESIZING: "${prompt}"...`, loadingId);

            try {
                const systemPrompt = isCode 
                    ? "You are a frontend engineer. Return ONLY raw HTML/CSS/JS code to modify the page. No markdown. Keep it in one block."
                    : "You are TermOS Genesis AI. Answer briefly in a sci-fi/cyberpunk style.";

                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${groqKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: prompt }
                        ]
                    })
                });

                const data = await res.json();
                
                // Remove loading message
                const loader = document.getElementById(loadingId);
                if(loader) loader.remove();

                if(data.error) throw new Error(data.error.message);

                const reply = data.choices[0].message.content;

                if(isCode) {
                    // Execute Code
                    addChatMessage("System", "Applying Genetic Mutation...", "self");
                    try {
                        const func = new Function(reply);
                        func();
                        addSystemMessage("✅ MUTATION APPLIED");
                    } catch(e) {
                        addSystemMessage("❌ MUTATION FAILED: " + e.message);
                    }
                } else {
                    // Text Reply
                    addChatMessage("AI KERNEL", reply, 'ai');
                }

            } catch (e) {
                const loader = document.getElementById(loadingId);
                if(loader) loader.remove();
                addSystemMessage("❌ AI ERROR: " + e.message);
            }
        }

        // --- 6. DOM HELPERS ---

        function addChatMessage(sender, text, type) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = "msg-anim max-w-[85%] mb-4 " + (type === 'self' ? 'ml-auto' : 'mr-auto');
            
            let bgClass = type === 'self' ? "bg-gradient-to-br from-[var(--accent-primary)] to-indigo-600" 
                          : type === 'ai' ? "bg-slate-800/90 border border-cyan-500/30 text-cyan-100" 
                          : "bg-slate-800/60 border border-white/5";
            
            let alignClass = type === 'self' ? "items-end" : "items-start";
            let avatar = type === 'ai' ? '🧠' : (type === 'self' ? '👤' : '👽');

            div.innerHTML = `
                <div class="flex ${alignClass} gap-3">
                    <div class="w-8 h-8 rounded-full bg-black/50 flex items-center justify-center text-xs border border-white/10 shrink-0 font-bold">${avatar}</div>
                    <div class="${bgClass} p-3 rounded-2xl ${type === 'self' ? 'rounded-tr-none' : 'rounded-tl-none'} shadow-lg backdrop-blur-md text-sm leading-relaxed break-words">
                        <div class="text-[10px] opacity-60 font-mono mb-1">${sender}</div>
                        ${escapeHtml(text)}
                    </div>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addSystemMessage(text, id = null) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            if(id) div.id = id;
            div.className = "msg-anim flex justify-center my-2";
            div.innerHTML = `<span class="text-[10px] uppercase tracking-widest text-[var(--accent-bio)] bg-black/40 px-3 py-1 rounded-full border border-[var(--accent-bio)]/30 shadow-[0_0_10px_rgba(0,255,157,0.2)]">${text}</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            if(!text) return "";
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function addXP(amount) {
            userXP += amount;
            localStorage.setItem('termos_xp', userXP);
            document.getElementById('xp-display').innerText = userXP + " XP";
        }

        // --- 7. MEDIA & ADMIN ---

        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            const ta = document.getElementById('code-editor');
            
            if(panel.classList.contains('hidden-vis')) {
                panel.classList.replace('hidden-vis', 'visible-vis');
                ta.value = document.documentElement.outerHTML;
            } else {
                panel.classList.replace('visible-vis', 'hidden-vis');
            }
        }

        function applyCode() {
            const code = document.getElementById('code-editor').value;
            if(confirm("⚠️ SYSTEM OVERWRITE: This will rewrite reality. Continue?")) {
                document.open();
                document.write(code);
                document.close();
            }
        }

        function toggleMediaPanel() {
            const p = document.getElementById('media-panel');
            p.classList.toggle('hidden-vis');
            p.classList.toggle('visible-vis');
        }

        function playRadio(url) {
            const audio = new Audio(url);
            audio.play();
            addSystemMessage("📻 TUNING FREQUENCY...");
        }

        function playVideoInput() {
            const url = document.getElementById('video-url').value;
            const vid = document.getElementById('main-video');
            const placeholder = document.getElementById('video-placeholder');
            
            if(url) {
                vid.src = url;
                vid.classList.remove('opacity-80');
                placeholder.classList.add('hidden-vis');
                addSystemMessage("📺 SIGNAL ACQUIRED");
                broadcast("is watching a transmission.");
            }
        }

        // --- 8. LISTENERS ---
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') handleInput();
        });

    </script>
</body>
</html>
