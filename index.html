<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TermOS: Emergency Repair</title>
    
    <!-- RESOURCES -->
    <!-- We load Tailwind, but CSS below provides fallbacks if it fails -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CORE VARIABLES --- */
        :root {
            --glass: rgba(10, 10, 15, 0.6);
            --neon: #00f3ff; /* Default Aurora Cyan */
            --accent: #ff00ff;
            --font-head: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
            --font-code: 'Fira Code', monospace;
        }
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: var(--font-body); color: #fff; }
        
        /* --- LAYERS --- */
        #boot-screen { z-index: 99999; position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #app-container { z-index: 10; position: relative; height: 100vh; width: 100vw; display: none; }
        #ui-layer { position: relative; z-index: 20; height: 100%; display: flex; flex-direction: column; }
        canvas { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }

        /* --- FALLBACK CSS (If Tailwind fails) --- */
        .flex { display: flex !important; }
        .flex-col { flex-direction: column !important; }
        .flex-1 { flex: 1 !important; }
        .overflow-y-auto { overflow-y: auto !important; }
        .space-y-4 { margin-top: 1rem !important; }
        .justify-center { justify-content: center !important; }
        .items-center { align-items: center !important; }
        .gap-2 { gap: 0.5rem !important; }
        .w-full { width: 100% !important; }
        .bg-black\/40 { background: rgba(0,0,0,0.4) !important; }
        .border-white\/10 { border: 1px solid rgba(255,255,255,0.1) !important; }
        .text-xs { font-size: 0.75rem !important; }

        /* --- FLASH OVERLAY --- */
        #flash-overlay { position: fixed; inset: 0; background: radial-gradient(circle, rgba(0,255,255,1) 0%, rgba(0,0,0,0) 70%); opacity: 0; pointer-events: none; z-index: 999; transition: opacity 0.1s; mix-blend-mode: screen; }

        /* --- THEMES --- */
        /* 1. AURORA (Default) */
        .theme-aurora { --neon: #00f3ff; --accent: #ff00ff; --glass: rgba(0, 20, 40, 0.4); }

        /* 2. MATRIX */
        .theme-matrix { --neon: #0f0; --accent: #0f0; --glass: rgba(0,20,0,0.85); }

        /* 3. CYBER */
        .theme-cyber { --neon: #f0f; --accent: #d946ef; --glass: rgba(20,0,20,0.85); }

        /* 4. UNIVERSE */
        .theme-universe { --neon: #06b6d4; --accent: #d946ef; --glass: rgba(10,10,30,0.7); }

        /* --- UI COMPONENTS --- */
        .glass { 
            background: var(--glass); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 8px 32px 0 rgba(0,0,0,0.5); 
            transition: all 0.3s ease;
        }
        .glass:hover { border-color: rgba(255,255,255,0.3); box-shadow: 0 0 20px rgba(0,0,0,0.8); }

        ::-webkit-scrollbar { width: 6px; } 
        ::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 3px; } 
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }

        /* --- ANIMATIONS --- */
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        .scanline::after {
            content: " "; display: block; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, transparent 50%, var(--accent) 51%, transparent 52%);
            background-size: 100% 4px; animation: scanline 10s linear infinite; pointer-events: none; z-index: 5; opacity: 0.15;
        }

        /* --- MODALS --- */
        .modal-hidden { display: none !important; opacity: 0; pointer-events: none; }
        .modal-visible { display: flex !important; opacity: 1; pointer-events: auto; }

        /* --- LOADER --- */
        .loader { width: 60px; height: 60px; border: 4px solid #222; border-top: 4px solid var(--neon); border-radius: 50%; animation: spin 1s linear infinite; box-shadow: 0 0 20px var(--neon); }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="theme-aurora">

    <!-- VISUALS -->
    <canvas id="visual-canvas"></canvas>
    <div id="flash-overlay"></div>

    <!-- BOOT LOADER -->
    <div id="boot-screen">
        <div class="loader mb-4"></div>
        <h1 class="text-3xl font-bold tracking-[0.5em] font-[var(--font-head)] text-white text-shadow-lg">TERMOS <span class="text-[var(--neon)]">AURORA</span></h1>
        <p class="text-gray-400 text-xs mt-4 font-mono tracking-widest" id="boot-log">
            LOADING SYSTEM...
        </p>
        <!-- Emergency Button (Visible if stuck) -->
        <button onclick="forceBoot()" class="mt-8 px-6 py-2 border border-white/20 rounded bg-white/10 text-white text-xs font-mono hover:bg-white/20">
            FORCE BOOT (CLICK IF STUCK)
        </button>
    </div>

    <!-- MAIN APP STRUCTURE -->
    <div id="app-container">
        <div id="ui-layer" class="scanline">
            
            <!-- HEADER -->
            <header class="glass border-b border-white/10 h-16 flex items-center justify-between px-4 lg:px-6 z-50">
                <div class="flex items-center gap-3">
                    <button onclick="toggleProfileModal()" class="w-10 h-10 rounded-full bg-white/10 border border-white/20 flex items-center justify-center text-xl hover:bg-white/20 transition-all hover:scale-110">
                        <span id="header-avatar">👤</span>
                    </button>
                    <div>
                        <h1 class="text-xl font-bold font-[var(--font-head)] tracking-wider text-white">TERMOS <span class="text-xs align-top text-[var(--neon)]">ULTIMATE</span></h1>
                        <div class="flex items-center gap-2 text-[10px] font-mono text-gray-400 mt-1">
                            <div id="status-dot" class="w-2 h-2 rounded-full bg-red-500"></div>
                            <span id="status-text">OFFLINE</span>
                            <span class="w-px h-3 bg-white/10 mx-1"></span>
                            <span id="room-display">AURORA</span>
                            <span class="text-yellow-400 font-bold hidden animate-pulse" id="lvl-badge">LVL 1</span>
                        </div>
                    </div>
                </div>

                <!-- CONTROLS -->
                <div class="flex items-center gap-2">
                    <button onclick="toggleTheme()" class="hidden md:flex px-3 py-1.5 rounded bg-white/5 hover:bg-white/10 text-xs font-mono border border-white/10 text-[var(--neon)] hover:shadow-[0_0_10px_var(--neon)]">
                        <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> STYLE
                    </button>
                    <button onclick="triggerFlash()" class="hidden md:flex px-3 py-1.5 rounded bg-white/5 hover:bg-white/10 text-xs font-mono border border-white/10 text-yellow-400 hover:shadow-[0_0_10px_yellow]">
                        <i class="fa-solid fa-bolt mr-2"></i> FLASH
                    </button>
                    <button onclick="toggleMediaDeck()" class="p-2 rounded bg-white/5 hover:bg-white/10 text-white border border-white/10 w-9 h-9 flex items-center justify-center hover:bg-white/10">
                        <i class="fa-solid fa-tv"></i>
                    </button>
                    <button onclick="toggleCodeEditor()" class="p-2 rounded bg-white/5 hover:bg-red-900/50 text-white border border-white/10 w-9 h-9 flex items-center justify-center hover:bg-white/10">
                        <i class="fa-solid fa-code"></i>
                    </button>
                </div>
            </header>

            <!-- CHAT AREA -->
            <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 relative z-10">
                <div id="intro-msg" class="flex justify-center my-6">
                    <span class="text-[10px] font-bold tracking-widest px-3 py-1 rounded-full bg-white/10 border border-white/5 text-gray-400 animate-pulse">SYSTEM READY // AURORA MODE</span>
                </div>
            </main>

            <!-- INPUT AREA -->
            <footer class="glass border-t border-white/10 p-4 z-40">
                <div class="flex gap-2">
                    <input type="text" id="input-field" placeholder="Command: /ai, /sys install [name]..." autocomplete="off" 
                        class="flex-1 bg-black/40 border border-[var(--neon)] text-[var(--neon)] p-3 rounded font-mono outline-none focus:shadow-[0_0_15px_var(--neon)] transition-all focus:bg-black/60">
                    <button onclick="sendMessage()" class="bg-[var(--neon)] text-black font-bold px-6 py-3 rounded font-[var(--font-head)] hover:opacity-90 uppercase tracking-wider shadow-[0_0_15px_var(--neon)]">
                        SEND
                    </button>
                </div>
            </footer>
        </div>
    </div>

    <!-- === MODALS (OVERLAYS) === -->
    <!-- PROFILE MODAL -->
    <div id="profile-modal" class="modal-hidden fixed inset-0 bg-black/90 backdrop-blur-md z-[60] flex items-center justify-center p-4">
        <div class="glass w-full max-w-md p-6 rounded-2xl border border-white/10 shadow-2xl">
            <h2 class="text-2xl font-bold font-[var(--font-head)] text-center mb-6 text-white">IDENTITY CORE</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-1">CODENAME</label>
                    <input type="text" id="profile-name" class="w-full bg-black/40 border border-white/20 rounded p-3 text-white outline-none focus:border-[var(--neon)] font-mono">
                </div>
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-1">AVATAR SIGNATURE</label>
                    <div class="flex gap-2">
                        <input type="text" id="profile-avatar" placeholder="👽" class="flex-1 bg-black/40 border border-white/20 rounded p-3 text-center text-2xl outline-none focus:border-[var(--neon)]">
                    </div>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="saveProfile()" class="flex-1 bg-[var(--neon)] text-black font-bold py-2 rounded hover:opacity-90">SAVE IDENTITY</button>
                <button onclick="toggleProfileModal()" class="flex-1 bg-white/10 hover:bg-white/20 text-white font-bold py-2 rounded">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- MEDIA DECK MODAL -->
    <div id="media-modal" class="modal-hidden fixed inset-0 bg-black/90 backdrop-blur-md z-[70] flex items-center justify-center p-4">
        <div class="glass w-full max-w-2xl p-0 rounded-2xl border border-white/10 shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="p-4 bg-white/5 border-b border-white/10 flex justify-between items-center">
                <h2 class="font-bold text-lg tracking-wider text-[var(--neon)]"><i class="fa-solid fa-satellite-dish mr-2"></i> MEDIA TRANSMISSION</h2>
                <button onclick="toggleMediaDeck()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark fa-lg"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- RADIO -->
                <div>
                    <h3 class="text-xs font-mono text-[var(--neon)] mb-3 uppercase tracking-widest">Radio Frequencies</h3>
                    <div class="space-y-2">
                        <button onclick="playRadio('https://streams.ilovemusic.com/iloveradio17.mp3', this)" class="w-full text-left bg-white/5 hover:bg-white/10 border border-white/10 p-3 rounded flex justify-between group">
                            <span class="font-mono text-sm text-[var(--accent)]">📡 CYBERWAVE</span>
                            <i class="fa-solid fa-play text-xs opacity-0 group-hover:opacity-100 text-[var(--neon)]"></i>
                        </button>
                    </div>
                </div>
                <!-- VIDEO -->
                <div>
                    <h3 class="text-xs font-mono text-[var(--neon)] mb-3 uppercase tracking-widest">Video Stream</h3>
                    <div class="aspect-video bg-black rounded border border-white/10 overflow-hidden relative group">
                        <video id="main-video" class="w-full h-full object-cover" controls autoplay playsinline></video>
                        <div id="video-placeholder" class="absolute inset-0 flex items-center justify-center bg-black/90 z-10 group-hover:opacity-0 transition-opacity">
                            <span class="text-xs text-gray-500 font-mono">NO SIGNAL</span>
                        </div>
                    </div>
                    <input type="text" id="video-url" placeholder="Paste URL..." class="w-full mt-3 bg-black/40 border border-white/10 rounded p-2 text-xs text-white outline-none focus:border-[var(--neon)] font-mono">
                    <button onclick="playVideo()" class="w-full mt-2 bg-[var(--neon)] text-black font-bold py-2 rounded text-xs hover:opacity-90">TUNE FREQUENCY</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CODE EDITOR MODAL -->
    <div id="code-modal" class="modal-hidden fixed inset-0 bg-black z-[80] flex flex-col">
        <div class="h-14 bg-[#050505] border-b border-white/10 flex justify-between items-center px-6">
            <h2 class="font-mono font-bold text-white"><span class="text-red-500">root@termos</span>:~# system_editor</h2>
            <div class="flex gap-3">
                <button onclick="applyCode()" class="bg-green-600/20 border border-green-500/30 text-green-400 hover:bg-green-600/40 px-4 py-1 rounded text-xs font-bold font-mono">APPLY MUTATION</button>
                <button onclick="toggleCodeEditor()" class="text-red-400 hover:text-white px-4 text-sm font-bold font-mono">EXIT [ESC]</button>
            </div>
        </div>
        <textarea id="code-editor" class="flex-1 bg-[#020202] text-[var(--neon)] font-[var(--font-code)] text-sm p-6 resize-none outline-none leading-relaxed border-none" spellcheck="false"></textarea>
        <div class="p-2 bg-red-900/10 text-center text-[10px] text-red-400 font-mono border-t border-red-900/20">
            WARNING: APPLYING CODE REWRITES THE ENTIRE DOM. BE CAREFUL.
        </div>
    </div>

    <!-- AUDIO -->
    <audio id="radio-player" loop></audio>

<script>
    /** 
     * TERMOS: EMERGENCY REPAIR
     * Failsafe boot sequence, Aurora visual, Robust Logic.
     */

    // --- 0. DIAGNOSTIC LOGGING ---
    console.log(">>> SYSTEM INIT: EMERGENCY MODE");
    console.log("DOM Ready:", document.readyState);

    // --- 1. CONFIG ---
    let GROQ_API_KEY = localStorage.getItem('termos_groq_key') || "";
    const MQTT_BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';
    let audioCtx = null;
    let adminMode = false;

    // --- 2. STATE ---
    const State = {
        user: {
            name: localStorage.getItem('termos_name') || 'Traveler',
            avatar: localStorage.getItem('termos_avatar') || '👤',
            id: 'uid_' + Math.random().toString(36).substr(2, 9)
        },
        system: {
            theme: 'aurora', // Default is now Aurora!
            level: 1,
            xp: 0,
            title: 'Newbie'
        },
        mqtt: { client: null, isConnected: false }
    };

    const LEVELS = ['Newbie', 'Apprentice', 'Coder', 'Hacker', 'Architect', 'Wizard', 'Master', 'GOD MODE'];

    // --- 3. SYSTEM REBUILDER KERNEL ---
    const SystemRebuilder = {
        installedModules: [],

        install: function(featureName) {
            if (this.installedModules.includes(featureName)) {
                addSystemMsg(`Module [${featureName}] already active.`);
                return;
            }
            console.log(`[KERNEL] Installing module: ${featureName}`);
            addSystemMsg(`INITIATING INSTALLATION: ${featureName.toUpperCase()}...`);

            switch (featureName) {
                case 'matrix': setTheme('matrix'); break;
                case 'crt': addSystemMsg("CRT Mode enabled via CSS overlay."); break;
                case 'sound': this.installSound(); break;
                case 'neon-theme': setTheme('cyber'); break;
                case 'god-mode': this.installGodMode(); break;
                default:
                    addSystemMsg(`ERROR: Unknown module '${featureName}'`);
                    return;
            }
            this.installedModules.push(featureName);
            addSystemMsg(`INSTALLATION COMPLETE: ${featureName.toUpperCase()}`);
        },

        installSound: function() {
            // Delayed initialization to avoid boot block
            if(audioCtx) return addSystemMsg("Audio Module active.");
            // Note: We don't init immediately. We init on first message send.
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                addSystemMsg("Audio Engine Standby...");
            } catch(e) { addSystemMsg("Audio Init Failed: " + e); }
        },
        
        // Hook into sendMessage to play sound once audioCtx is ready
        playTypingSound: function() {
            if(!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) { console.warn("Sound error", e); }
        },

        installGodMode: function() {
            adminMode = true;
            const txt = document.getElementById('status-text');
            const dot = document.getElementById('status-dot');
            if(txt) {
                txt.innerText = "ADMIN";
                txt.className = "text-red-500 font-bold";
            }
            if(dot) {
                dot.className = "w-2 h-2 rounded-full bg-red-500 shadow-[0_0_10px_red]";
            }
            addSystemMsg("GOD MODE ENABLED.");
        }
    };

    // --- 4. VISUAL ENGINE (AURORA & MATRIX) ---
    const canvas = document.getElementById('visual-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let drops = [];
    let waves = [];

    function resize() {
        try {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Re-init based on theme
            if(State.system.theme === 'universe') initParticles();
            else if(State.system.theme === 'matrix') initMatrixDrops();
            else if(State.system.theme === 'aurora') initWaves();
        } catch(e) {
            console.error("Canvas Resize Error", e);
        }
    }
    window.addEventListener('resize', resize);

    // 1. UNIVERSE MODE
    function initParticles() {
        particles = Array(80).fill().map(() => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            size: Math.random() * 2
        }));
    }
    function renderUniverse() {
        try {
            ctx.fillStyle = 'rgba(5,5,10,0.2)';
            ctx.fillRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = '#d946ef';
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0)p.x=canvas.width; if(p.x>canvas.width)p.x=0;
                if(p.y<0)p.y=canvas.height; if(p.y>canvas.height)p.y=0;
                ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
            });
        } catch(e) { console.error("Universe Render Error", e); }
    }

    // 2. MATRIX MODE
    function initMatrixDrops() {
        const fontSize = 14;
        const columns = Math.floor(canvas.width / fontSize);
        drops = Array(columns).fill(1);
    }
    function renderMatrix() {
        try {
            ctx.fillStyle = 'rgba(0,0,0,0.05)';
            ctx.fillRect(0,0,canvas.width, canvas.height);
            const color = adminMode ? '#ff0000' : '#0f0';
            ctx.fillStyle = color;
            ctx.font = '14pt monospace';
            drops.forEach((y, i) => {
                const text = String.fromCharCode(Math.random()*128);
                const x = i*14;
                ctx.fillText(text, x, y);
                if(y > canvas.height && Math.random() > 0.975) drops[i] = 0;
                else drops[i] = y + 20;
            });
        } catch(e) { renderUniverse(); } // Fallback if crash
    }

    // 3. AURORA MODE (NEW ANIME STYLE)
    function initWaves() {
        waves = [
            { y: 0, speed: 0.005, color: 'rgba(0, 243, 255, 0.2)', offset: 0 }, // Cyan
            { y: 0, speed: 0.003, color: 'rgba(255, 0, 255, 0.2)', offset: 100 }, // Magenta
            { y: 0, speed: 0.004, color: 'rgba(128, 0, 255, 0.2)', offset: 200 }  // Purple
        ];
    }

    function renderAurora() {
        try {
            ctx.fillStyle = '#020205'; // Deep dark blue background
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Waves
            waves.forEach((wave, index) => {
                ctx.beginPath();
                ctx.moveTo(0, canvas.height / 2 + Math.sin(wave.offset) * 50);
                
                for (let x = 0; x <= canvas.width; x += 5) {
                    const y = canvas.height / 2 + Math.sin((x * 0.01) + wave.offset) * 80 + (index * 10);
                    ctx.lineTo(x, y);
                }
                
                ctx.strokeStyle = wave.color;
                ctx.lineWidth = 2;
                ctx.stroke();
                
                wave.offset += wave.speed;
            });

            // Draw Stars
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            for(let i=0; i<40; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.beginPath();
                ctx.arc(x, y, Math.random()*1.5, 0, Math.PI*2);
                ctx.fill();
            }
        } catch(e) { renderUniverse(); } // Fallback
    }

    // MAIN LOOP
    function loop() {
        try {
            if(State.system.theme === 'universe') renderUniverse();
            else if(State.system.theme === 'matrix') renderMatrix();
            else if(State.system.theme === 'aurora') renderAurora();
            requestAnimationFrame(loop);
        } catch(e) {
            console.error("Loop Crash", e);
            // If loop crashes, stop rendering but don't freeze browser
            renderUniverse(); 
            setTimeout(loop, 1000); 
        }
    }

    // --- 5. BOOT SEQUENCE (SAFEST) ---
    function forceBoot() {
        console.log("!!! FORCE BOOT TRIGGERED !!!");
        
        try {
            const bootScreen = document.getElementById('boot-screen');
            const appContainer = document.getElementById('app-container');
            
            if (bootScreen && appContainer) {
                // 1. Remove Boot Screen
                bootScreen.style.display = 'none';
                bootScreen.remove();
                
                // 2. Show App
                appContainer.style.display = 'block';
                
                // 3. Start Systems
                resize();
                loop();
                connectMQTT();
                updateUI();
                
                addSystemMsg("SYSTEM ONLINE // AURORA MODE");
            } else {
                alert("CRITICAL ERROR: HTML Elements missing! Please refresh.");
            }
        } catch(err) {
            console.error("Boot Error", err);
            alert("System Error: " + err.message);
        }
    }

    // RUN BOOT IMMEDIATELY
    // We use window.onload to ensure HTML is parsed
    window.onload = function() {
        console.log(">>> PAGE LOADED");
        updateBootLog("DOM Parsed. Checking Systems...");
        
        // Small delay to allow layout paint
        setTimeout(() => {
            forceBoot();
        }, 500);
    };
    
    function updateBootLog(msg) {
        const log = document.getElementById('boot-log');
        if(log) log.innerText = msg;
    }

    // --- 6. INPUT ---
    document.getElementById('input-field').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            // Play sound if enabled
            if(SystemRebuilder.installedModules.includes('sound')) {
                SystemRebuilder.playTypingSound();
            }
            sendMessage();
        }
    });

    // --- 7. MQTT ---
    function connectMQTT() {
        if (typeof Paho === 'undefined') {
            updateBootLog("MQTT Library Missing.");
            addSystemMsg("MQTT LIBRARY MISSING");
            return;
        }

        try {
            State.mqtt.client = new Paho.MQTT.Client(MQTT_BROKER_URL, "termos_client");
        } catch(e) {
            updateBootLog("MQTT Client Error: " + e.message);
            addSystemMsg("MQTT INIT FAILED");
            return;
        }

        State.mqtt.client.onConnectionLost = (responseObject) => {
            console.log("MQTT Connection Lost", responseObject.errorMessage);
            updateStatus(false);
            setTimeout(connectMQTT, 5000);
        };

        State.mqtt.client.onMessageArrived = (message) => {
            try {
                const data = JSON.parse(message.payloadString);
                if(data.id === State.user.id) return;
                
                if(data.type === 'system_action') {
                    if(data.data && data.data.action === 'theme_change') {
                        setTheme(data.data.theme);
                        if(data.data.flash) triggerFlash();
                    }
                } else {
                    addMsg(data.id, data.msg);
                }
            } else {
                addMsg(data.id, data.msg);
            }
        };

        State.mqtt.client.connect({
            timeout: 10, useSSL: true, keepAliveInterval: 60,
            onSuccess: () => {
                console.log("MQTT Connected");
                State.mqtt.isConnected = true;
                State.mqtt.client.subscribe('termchat/output');
                updateStatus(true);
                addSystemMsg("📡 NEURAL LINK ESTABLISHED");
            },
            onFailure: (responseObject) => {
                console.log("MQTT Connection Failed", responseObject.errorMessage);
                updateStatus(false);
                addSystemMsg("MQTT CONNECTION FAILED");
            }
        });
    }

    // --- 8. COMMANDS ---
    function sendMessage() {
        const input = document.getElementById('input-field');
        const text = input.value.trim();
        if(!text) return;
        input.value = '';

        if(text.startsWith('/')) {
            const parts = text.split(' ');
            const cmd = parts[0].toLowerCase();
            const args = parts.slice(1).join(' ');

            if(cmd === '/theme') { setTheme(args); return; }
            if(cmd === '/sys' && args.includes('install')) { SystemRebuilder.install(parts[2]); return; }
            if(cmd === '/setkey') { 
                GROQ_API_KEY = args; 
                localStorage.setItem('termos_groq_key', args); 
                addSystemMsg("KEY SAVED."); 
                return; 
            }
            publishMessage(text); // Send commands to backend
        } else {
            publishMessage(text); // Chat
        }
    }

    function publishMessage(text) {
        const payload = { id: State.user.id, msg: text };
        const msg = new Paho.MQTT.Message(JSON.stringify(payload));
        msg.destinationName = 'termchat/input';
        State.mqtt.client.send(msg);
        addMsg('Me', text, true);
    }

    // --- 9. SYSTEM FEATURES ---
    function setTheme(name) {
        const themes = ['universe', 'matrix', 'cyber', 'aurora'];
        if(themes.includes(name)) {
            State.system.theme = name;
            document.body.className = `theme-${name}`;
            addSystemMsg(`VISUALS: ${name.toUpperCase()} MODE`);
        }
    }

    function triggerFlash() {
        const f = document.getElementById('flash-overlay');
        f.style.opacity = '0.8';
        setTimeout(() => f.style.opacity = '0', 100);
    }

    // --- 10. UI HELPERS ---
    function addMsg(sender, text, isMe=false) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        const align = isMe ? 'justify-end' : 'justify-start';
        const bubbleColor = isMe ? 'bg-[var(--neon)] text-black' : 'bg-black/60 text-white border-l-4 border-[var(--neon)]';
        
        div.className = `flex w-full ${align} animate-pulse`;
        div.innerHTML = `
            <div class="max-w-[80%]">
                <div class="text-[10px] opacity-50 mb-1 font-mono">${sender}</div>
                <div class="${bubbleColor} p-3 rounded backdrop-blur-md text-sm break-words">
                    ${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
                </div>
            </div>
        `;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;

        // XP SYSTEM
        if(!isMe && sender !== 'Me' && sender !== 'SYSTEM') {
            addXP(1);
        }
    }

    function addSystemMsg(text) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = "flex justify-center my-4";
        div.innerHTML = `<span class="text-[10px] font-bold tracking-widest px-3 py-1 rounded bg-white/10 border border-white/5 text-gray-400">${text}</span>`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function updateStatus(online) {
        const dot = document.getElementById('status-dot');
        const txt = document.getElementById('status-text');
        if(online) { 
            dot.className = "w-2 h-2 rounded-full bg-green-500 shadow-[0_0_10px_green]"; 
            txt.innerText="ONLINE"; txt.className="text-green-400"; 
        } else { 
            dot.className = "w-2 h-2 rounded-full bg-red-500 animate-pulse"; 
            txt.innerText="OFFLINE"; txt.className="text-red-500"; 
        }
    }

    function addXP(amount) {
        State.system.xp += amount;
        if(State.system.xp > (State.system.level * 1000)) {
            State.system.level++;
            State.system.title = LEVELS[State.system.level] || 'GOD MODE';
            addSystemMsg(`LEVEL UP! RANK: ${State.system.title}`);
            const badge = document.getElementById('lvl-badge');
            if(badge) {
                badge.innerText = `LVL ${State.system.level}`;
                badge.classList.remove('hidden');
            }
        }
    }

    function updateUI() {
        document.getElementById('header-avatar').innerText = State.user.avatar;
        document.getElementById('room-display').innerText = State.system.theme.toUpperCase();
    }

    // --- 11. MODALS ---
    function toggleProfileModal() {
        const el = document.getElementById('profile-modal');
        el.classList.toggle('modal-hidden');
        el.classList.toggle('modal-visible');
        if(!el.classList.contains('modal-hidden')) {
            document.getElementById('profile-name').value = State.user.name;
            document.getElementById('profile-avatar').value = State.user.avatar;
        }
    }
    function saveProfile() {
        State.user.name = document.getElementById('profile-name').value;
        State.user.avatar = document.getElementById('profile-avatar').value;
        localStorage.setItem('termos_name', State.user.name);
        localStorage.setItem('termos_avatar', State.user.avatar);
        updateUI();
        toggleProfileModal();
        addSystemMsg("IDENTITY UPDATED");
    }

    function toggleMediaDeck() {
        document.getElementById('media-modal').classList.toggle('modal-hidden');
        document.getElementById('media-modal').classList.toggle('modal-visible');
    }
    function playRadio(url, btn) {
        const player = document.getElementById('radio-player');
        player.src = url;
        player.play();
        document.querySelectorAll('#media-modal button').forEach(b => b.classList.remove('border-[var(--neon)]'));
        if(btn) btn.classList.add('border-[var(--neon)]');
        addSystemMsg("RADIO SIGNAL LOCKED");
    }
    function playVideo() {
        const url = document.getElementById('video-url').value;
        const vid = document.getElementById('main-video');
        const ph = document.getElementById('video-placeholder');
        if(url) {
            vid.src = url;
            ph.style.display = 'none';
            addSystemMsg("VIDEO FEED ACTIVE");
        }
    }

    function toggleCodeEditor() {
        const el = document.getElementById('code-modal');
        if(el.classList.contains('modal-hidden')) {
            el.classList.remove('modal-hidden');
            el.classList.add('modal-visible');
            document.getElementById('code-editor').value = document.documentElement.outerHTML;
        } else {
            el.classList.remove('modal-visible');
            el.classList.add('modal-hidden');
        }
    }
    function applyCode() {
        const code = document.getElementById('code-editor').value;
        if(confirm("⚠️ THIS WILL RELOAD THE PAGE WITH NEW CODE. CONTINUE?")) {
            document.open();
            document.write(code);
            document.close();
        }
    }
</script>
</body>
</html>
