<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TermOS: Mobile Friendly</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- LIBRARIES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <!-- FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #020617;
            --glass-bg: rgba(15, 23, 42, 0.8);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #06b6d4; /* Cyan */
            --accent-sec: #8b5cf6;    /* Purple */
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --safe-top: env(safe-area-inset-top, 20px);
        }

        body {
            background-color: var(--bg-deep);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            -webkit-tap-highlight-color: transparent; /* Remove blue tap highlight */
            touch-action: manipulation; /* Improves touch response */
        }

        /* --- BACKGROUND --- */
        #visual-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* --- LAYOUT GRID --- */
        .app-shell {
            display: grid;
            grid-template-columns: 70px 1fr;
            grid-template-rows: 1fr;
            height: 100%;
            z-index: 10;
            position: relative;
        }

        /* Tablet & Mobile Layout */
        @media (max-width: 768px) {
            .app-shell {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr calc(70px + var(--safe-bottom));
            }
        }

        /* --- SIDEBAR (Desktop) / HIDDEN (Mobile) --- */
        .sidebar {
            background: rgba(2, 6, 23, 0.95);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: var(--safe-top);
            padding-bottom: 20px;
            gap: 20px;
            backdrop-filter: blur(10px);
            z-index: 20;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
        }

        /* --- MAIN CONTENT AREA --- */
        .main-view {
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            height: 100%;
        }

        /* --- HEADER --- */
        .header-bar {
            height: calc(60px + var(--safe-top));
            padding-top: var(--safe-top);
            border-bottom: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: space-between;
            padding-left: 20px; padding-right: 20px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            z-index: 15;
        }

        /* --- SCROLLABLE CONTENT --- */
        .content-area {
            flex: 1; overflow-y: auto; padding: 20px;
            /* Adjust padding for mobile input area */
            padding-bottom: 120px; 
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        
        @media (max-width: 768px) {
            .content-area { padding: 16px; padding-bottom: 140px; }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* --- INPUT DOCK (Mobile Optimized) --- */
        .input-dock {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, rgba(2,6,23, 1) 50%, rgba(2,6,23,0.9));
            border-top: 1px solid var(--glass-border);
            padding: 12px 16px;
            padding-bottom: calc(12px + var(--safe-bottom));
            display: flex; gap: 10px; align-items: center; justify-content: center;
            z-index: 30;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
        }

        .glass-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: white; border-radius: 24px;
            padding: 14px 20px;
            outline: none; width: 100%; max-width: 700px;
            font-size: 16px; /* Prevents iOS zoom */
            transition: border-color 0.2s;
        }
        .glass-input:focus { border-color: var(--accent-primary); background: rgba(255,255,255,0.1); }

        /* --- ACTION BUTTONS --- */
        .action-btn {
            width: 48px; height: 48px; /* Large touch target */
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.05);
            border: none; color: var(--accent-primary);
            transition: all 0.2s; cursor: pointer;
            flex-shrink: 0;
        }
        .action-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }
        .action-btn.send { background: var(--accent-primary); color: white; }
        .action-btn.send:active { background: #0891b2; }

        /* --- MESSAGES --- */
        .bubble {
            max-width: 85%; padding: 12px 18px; border-radius: 20px;
            font-size: 0.95rem; line-height: 1.5;
            margin-bottom: 12px;
            word-wrap: break-word;
        }
        .bubble.user {
            background: var(--accent-primary); color: white;
            border-bottom-right-radius: 4px; margin-left: auto;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.2);
        }
        .bubble.ai {
            background: #1e293b; border: 1px solid var(--glass-border);
            color: #cbd5e1; border-bottom-left-radius: 4px; margin-right: auto;
        }
        .bubble.system {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; font-size: 0.8rem; color: #94a3b8;
            margin: 10px auto; display: block; width: fit-content; text-align: center;
        }
        /* Code Block Handling */
        .code-block {
            background: #0f172a; border-radius: 8px; padding: 12px;
            margin-top: 8px; overflow-x: auto;
            font-family: 'Fira Code', monospace; font-size: 0.85rem;
            border: 1px solid #334155; color: #86efac;
        }

        /* --- MOBILE BOTTOM NAV --- */
        .mobile-nav {
            display: none;
            position: fixed; bottom: 0; left: 0; width: 100%;
            height: calc(70px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            z-index: 40;
            justify-content: space-around; align-items: center;
        }
        @media (max-width: 768px) {
            .mobile-nav { display: flex; }
            .input-dock { bottom: 0; height: auto; padding-top: 0; padding-bottom: 0; background: transparent; box-shadow: none; border: none; }
            /* Adjust input area on mobile to sit above nav */
            .mobile-input-wrapper {
                position: absolute; bottom: calc(70px + var(--safe-bottom)); left: 0; width: 100%;
                padding: 10px 16px;
                background: rgba(2,6,23, 0.95);
                border-top: 1px solid var(--glass-border);
                z-index: 35;
            }
            /* Hide original input dock on mobile, use wrapper */
            .input-dock { display: none; } 
            .mobile-input-wrapper { display: flex; gap: 10px; align-items: center; }
        }

        .nav-icon {
            display: flex; flex-direction: column; align-items: center;
            gap: 4px; color: #64748b; font-size: 0.7rem;
            padding: 8px 16px; /* Wide touch area */
        }
        .nav-icon.active { color: var(--accent-primary); }
        .nav-icon svg { width: 24px; height: 24px; }

        /* --- TOASTS --- */
        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            background: rgba(15, 23, 42, 0.95); border: 1px solid var(--glass-border);
            color: white; padding: 12px 16px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 12px;
            animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 0.9rem; text-align: center; justify-content: center;
        }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; }}

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
            z-index: 200; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: #1e293b; border: 1px solid var(--glass-border); border-radius: 20px;
            width: 90%; max-width: 400px; padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: scale(0.95); transition: transform 0.2s;
        }
        .modal-overlay.open .modal-card { transform: scale(1); }

        /* --- CAMERA --- */
        #cam-overlay {
            position: fixed; top: calc(60px + var(--safe-top)); right: 20px; width: 160px; height: 120px;
            background: #000; border: 1px solid var(--accent-primary); border-radius: 12px;
            z-index: 50; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
        }
        #cam-overlay.active { display: block; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .cam-close {
            position: absolute; top: 4px; right: 4px; width: 24px; height: 24px;
            background: rgba(0,0,0,0.6); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; cursor: pointer; font-size: 14px;
        }
    </style>
</head>
<body>

    <canvas id="visual-canvas"></canvas>
    
    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="toast-container"></div>

    <!-- MODAL -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-card">
            <h3 id="modal-title" class="text-white font-header text-lg mb-4">Settings</h3>
            <div id="modal-content" class="mb-6 text-sm text-gray-300"></div>
            <div class="flex justify-end gap-3">
                <button id="modal-cancel" class="flex-1 py-3 rounded-xl border border-gray-600 text-gray-300 transition active:bg-gray-700">Cancel</button>
                <button id="modal-confirm" class="flex-1 py-3 rounded-xl bg-cyan-600 text-white font-bold transition active:bg-cyan-700">Save</button>
            </div>
        </div>
    </div>

    <!-- CAMERA -->
    <div id="cam-overlay">
        <video id="local-video" autoplay muted playsinline></video>
        <div class="cam-close" onclick="Media.toggleCam()">✕</div>
        <div class="absolute bottom-2 left-2 text-[10px] font-mono text-cyan-400">LIVE</div>
    </div>

    <div class="app-shell">
        <!-- DESKTOP SIDEBAR -->
        <nav class="sidebar">
            <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg mb-8 shrink-0">
                <span class="font-header text-white font-bold text-lg">T</span>
            </div>

            <button class="action-btn w-12 h-12" onclick="App.setMode('chat')" title="Chat">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </button>
            <button class="action-btn w-12 h-12" onclick="App.setMode('terminal')" title="Terminal">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </button>
            <button class="action-btn w-12 h-12" onclick="Media.toggleCam()" title="Video">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            </button>
            <div style="flex:1"></div>
            <button class="action-btn w-12 h-12" onclick="App.openSettings()" title="Settings">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </nav>

        <!-- MAIN VIEW -->
        <main class="main-view">
            <header class="header-bar">
                <div class="flex items-center gap-3">
                    <h1 class="font-header text-xl tracking-wider text-white">TERMOS <span class="text-cyan-400">MOBILE</span></h1>
                </div>
                <div class="flex items-center gap-3">
                    <!-- Settings Icon visible on Mobile -->
                    <button class="md:hidden action-btn w-10 h-10" onclick="App.openSettings()">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                    </button>
                    <div class="flex items-center gap-2">
                        <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
                    </div>
                </div>
            </header>

            <div class="content-area" id="content-area">
                <div id="chat-log" class="flex flex-col w-full h-full">
                    <div class="bubble system">Welcome. Configure Keys in Settings.</div>
                </div>
                <div id="terminal-log" class="hidden font-mono text-sm text-green-500">
                    <div>> Kernel Ready.</div>
                </div>
            </div>

            <!-- DESKTOP INPUT DOCK -->
            <div class="input-dock">
                <button class="action-btn" onclick="App.sendVoice()">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7m0 0H8m4 0h4m-4 8H8"></path></svg>
                </button>
                <input type="text" id="main-input" class="glass-input" placeholder="Message..." autocomplete="off">
                <button class="action-btn send" onclick="App.submit()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>

            <!-- MOBILE INPUT WRAPPER (Separate from Nav) -->
            <div class="mobile-input-wrapper">
                <input type="text" id="mobile-input" class="glass-input" placeholder="Type message..." autocomplete="off">
                <button class="action-btn send" onclick="App.submitMobile()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
        </main>
    </div>

    <!-- MOBILE BOTTOM NAV -->
    <div class="mobile-nav">
        <div class="nav-icon active" onclick="App.setMode('chat')">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            <span>Chat</span>
        </div>
        <div class="nav-icon" onclick="App.setMode('terminal')">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span>Term</span>
        </div>
        <div class="nav-icon" onclick="Media.toggleCam()">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            <span>Cam</span>
        </div>
    </div>

<script>
const SystemRebuilder = {
    install: (m) => {
        UI.toast(`Installing ${m}...`);
        setTimeout(() => UI.toast(`Module ${m} active.`), 500);
    }
};

const Config = {
    broker: "broker.emqx.io", port: 8084, topic: "termos/mob/v1",
    providers: {
        groq: { url: "https://api.groq.com/openai/v1/chat/completions", model: "llama-3.3-70b-versatile" },
        zhipu: { url: "https://open.bigmodel.cn/api/paas/v4/chat/completions", model: "glm-4" }
    }
};

const State = {
    user: "MobUser_" + Math.floor(Math.random()*1000),
    provider: "groq",
    keys: { groq: localStorage.getItem('t_m_groq')||"", zhipu: localStorage.getItem('t_m_zhipu')||"" },
    isOnline: false
};

const UI = {
    addLog: (msg, type='user') => {
        const c = document.getElementById('chat-log');
        const d = document.createElement('div');
        d.className = "flex flex-col " + (type==='user'?'items-end':'items-start');
        
        let content = msg;
        if(msg.includes('```')) {
            const parts = msg.split('```');
            content = parts[0];
            if(parts[1]) {
                let code = parts[1].replace(/javascript|js/g, '').trim();
                content += `<div class="code-block">${code}</div>`;
                if(code.includes('SystemRebuilder')) {
                    try { new Function(code)(); } catch(e){}
                }
            }
        }

        d.innerHTML = `<div class="bubble ${type}">${content}</div>`;
        c.appendChild(d);
        c.scrollTop = c.scrollHeight;
    },

    toast: (msg) => {
        const t = document.createElement('div');
        t.className = 'toast'; t.innerText = msg;
        document.getElementById('toast-container').appendChild(t);
        setTimeout(()=>t.remove(), 3000);
    },

    modal: {
        show: (title, html, cb) => {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal-overlay').classList.add('open');
            document.getElementById('modal-confirm').onclick = () => {
                cb(); document.getElementById('modal-overlay').classList.remove('open');
            };
        },
        hide: () => document.getElementById('modal-overlay').classList.remove('open')
    },

    setMode: (m) => {
        const chat = document.getElementById('chat-log');
        const term = document.getElementById('terminal-log');
        const icons = document.querySelectorAll('.nav-icon');
        icons.forEach(i => i.classList.remove('active'));

        if(m === 'chat') {
            chat.style.display = 'flex'; term.style.display = 'none';
            if(icons[0]) icons[0].classList.add('active');
        } else {
            chat.style.display = 'none'; term.style.display = 'block';
            if(icons[1]) icons[1].classList.add('active');
        }
    }
};

const MQTT = {
    client: null,
    connect: () => {
        const id = "termos_m_" + State.user;
        MQTT.client = new Paho.Client(Config.broker, Config.port, id);
        MQTT.client.onConnectionLost = () => {
            document.getElementById('status-dot').className = "w-2.5 h-2.5 rounded-full bg-red-500";
        };
        MQTT.client.onMessageArrived = (msg) => {
            try {
                const d = JSON.parse(msg.payloadString);
                if(d.sender !== State.user) UI.addLog(d.text, 'ai');
            } catch(e){}
        };
        MQTT.client.connect({
            useSSL: true, timeout: 5,
            onSuccess: () => {
                MQTT.client.subscribe(Config.topic);
                document.getElementById('status-dot').className = "w-2.5 h-2.5 rounded-full bg-green-400 shadow-[0_0_8px_#4ade80]";
                UI.toast("Connected");
            },
            onFailure: () => UI.toast("Net Error")
        });
    },
    send: (txt) => {
        if(!MQTT.client?.isConnected()) return;
        const m = new Paho.Message(JSON.stringify({ sender: State.user, text: txt }));
        m.destinationName = Config.topic;
        MQTT.client.send(m);
    }
};

const Brain = {
    query: async (p) => {
        const key = State.keys[State.provider];
        if(!key) return App.openSettings();
        
        UI.addLog("Thinking...", 'system');
        try {
            const h = { "Content-Type": "application/json", "Authorization": `Bearer ${key}` };
            const b = {
                model: Config.providers[State.provider].model,
                messages: [{role:"system", content:"You are TermOS. Use SystemRebuilder.install() for code."},{role:"user",content:p}]
            };
            const r = await fetch(Config.providers[State.provider].url, {method:"POST",headers:h,body:JSON.stringify(b)});
            const d = await r.json();
            if(d.error) throw new Error(d.error.message);
            UI.addLog(d.choices[0].message.content, 'ai');
        } catch(e) { UI.toast("AI Error"); }
    }
};

const Media = {
    toggleCam: async () => {
        const vid = document.getElementById('local-video');
        const ov = document.getElementById('cam-overlay');
        if(ov.classList.contains('active')) {
            vid.srcObject?.getTracks()?.forEach(t=>t.stop());
            ov.classList.remove('active');
        } else {
            try {
                const s = await navigator.mediaDevices.getUserMedia({video:true});
                vid.srcObject = s;
                ov.classList.add('active');
            } catch(e) { UI.toast("Cam Blocked"); }
        }
    }
};

const App = {
    init: () => {
        // Sync inputs
        const desk = document.getElementById('main-input');
        const mob = document.getElementById('mobile-input');
        
        desk.addEventListener('input', (e)=>mob.value = e.target.value);
        mob.addEventListener('input', (e)=>desk.value = e.target.value);

        // Handle Enter
        desk.addEventListener('keypress', e => { if(e.key==='Enter') App.submit(); });
        mob.addEventListener('keypress', e => { if(e.key==='Enter') App.submitMobile(); });

        // Mobile Keyboard Scroll Logic
        mob.addEventListener('focus', () => {
            setTimeout(() => {
                const c = document.getElementById('chat-log');
                c.scrollTop = c.scrollHeight;
            }, 300);
        });

        MQTT.connect();
        
        // Canvas simple animation
        const canvas = document.getElementById('visual-canvas');
        const ctx = canvas.getContext('2d');
        const resize = () => { canvas.width=window.innerWidth; canvas.height=window.innerHeight; };
        window.addEventListener('resize', resize); resize();
        const stars = Array(100).fill().map(()=>({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*2}));
        const draw = () => {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle="#FFF";
            stars.forEach(s=> {
                s.y-=s.s; if(s.y<0) s.y=canvas.height;
                ctx.globalAlpha=0.5; ctx.beginPath(); ctx.arc(s.x,s.y,s.s,0,Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(draw);
        };
        draw();
    },

    submit: () => {
        const inp = document.getElementById('main-input');
        const txt = inp.value.trim(); if(!txt) return;
        
        if(txt.startsWith('/ai ')) Brain.query(txt.substring(4));
        else { UI.addLog(txt, 'user'); MQTT.send(txt); }
        inp.value = '';
    },

    submitMobile: () => {
        const inp = document.getElementById('mobile-input');
        const txt = inp.value.trim(); if(!txt) return;
        
        if(txt.startsWith('/ai ')) Brain.query(txt.substring(4));
        else { UI.addLog(txt, 'user'); MQTT.send(txt); }
        inp.value = '';
    },

    openSettings: () => {
        const html = `
            <div class="space-y-4">
                <select id="prov" class="w-full bg-black/50 border border-gray-600 rounded p-3 text-white">
                    <option value="groq" ${State.provider==='groq'?'selected':''}>Groq (Llama)</option>
                    <option value="zhipu" ${State.provider==='zhipu'?'selected':''}>Zhipu (GLM)</option>
                </select>
                <input id="k" type="password" class="w-full bg-black/50 border border-gray-600 rounded p-3 text-white" placeholder="API Key" value="${State.keys[State.provider]}">
            </div>
        `;
        UI.modal.show("Config", html, () => {
            State.provider = document.getElementById('prov').value;
            State.keys[State.provider] = document.getElementById('k').value;
            localStorage.setItem('t_m_groq', State.keys.groq);
            localStorage.setItem('t_m_zhipu', State.keys.zhipu);
            UI.toast("Saved");
        });
    },

    setMode: UI.setMode,
    sendVoice: () => UI.toast("Voice Active...") // Mock
};

window.onload = App.init;
</script>
</body>
</html>
