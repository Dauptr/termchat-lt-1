<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TermOS: Sin City</title>
    <meta name="theme-color" content="#0f0c29">
    
    <!-- RESOURCES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <style>
        /* --- SINCITY THEME VARIABLES --- */
        :root { 
            --bg-deep: #050510;       /* Void Black */
            --neon-pink: #ff00ff;     /* Synthwave Pink */
            --neon-cyan: #00f3ff;     /* Cyber Cyan */
            --neon-purple: #bc13fe;    /* Vaporwave Purple */
            --glass-bg: rgba(20, 20, 35, 0.6); 
            --glass-border: rgba(255, 0, 255, 0.1);
            --msg-user-bg: linear-gradient(135deg, #c026d3 0%, #701a75 100%); /* Cyber Pink Gradient */
        }
        
        body { 
            background: var(--bg-deep); 
            color: #e2e8f0; 
            font-family: 'Share Tech Mono', monospace; 
            overflow: hidden; 
            margin: 0;
        }

        /* RETRO SCANLINE - OPTIMIZED CSS ONLY */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(255, 0, 0, 0.06));
            background-size: 100% 2px, 2px 100%;
            pointer-events: none; z-index: 50;
        }

        /* HIGH PERFORMANCE CANVAS */
        #main-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        
        /* UI COMPONENTS */
        .glass-panel { 
            background: var(--glass-bg); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            border: 1px solid var(--glass-border); 
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.05); 
        }
        
        .font-header { font-family: 'Orbitron', sans-serif; text-shadow: 0 0 10px var(--neon-purple); }
        
        /* AVATAR GRADIENTS */
        .avatar-gradient-ai { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); }
        .avatar-gradient-neural { background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan)); }
        
        /* INPUT STYLES */
        .input-glow:focus-within { 
            box-shadow: 0 0 20px var(--neon-purple); 
            border-color: var(--neon-cyan); 
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--neon-pink); border-radius: 3px; }
        ::-webkit-scrollbar-track { background: #000; }

        /* UTILITIES */
        .admin-hidden { display: none; opacity: 0; }
        .admin-visible { display: flex; opacity: 1; }
        
        /* ANIMATIONS */
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg-anim { animation: slideUpFade 0.2s ease-out forwards; }
        
        .neural-msg { 
            background: linear-gradient(135deg, rgba(188,19,254,0.1), rgba(255,0,255,0.1)); 
            border: 1px solid var(--neon-cyan); 
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        /* LOADER */
        #boot-screen {
            position: fixed; inset: 0; background: #000; z-index: 999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .loader-text { 
            color: var(--neon-pink); 
            font-size: 2rem; 
            text-shadow: 0 0 10px var(--neon-pink); 
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }
    </style>
</head>
<body class="h-screen w-screen flex flex-col relative">
    <!-- VISUAL ENGINE -->
    <div class="scanlines"></div>
    <canvas id="main-canvas"></canvas>
    
    <!-- BOOT SCREEN -->
    <div id="boot-screen">
        <div class="loader-text font-header">SINCITY // LOADING...</div>
        <div class="text-xs text-purple-400 mt-2 font-mono tracking-widest">INITIALIZING GRAPHICS ENGINE...</div>
    </div>

    <!-- MAIN INTERFACE -->
    <header class="fixed top-0 left-0 right-0 z-20 glass-panel border-b border-white/5 h-16 flex items-center justify-between px-4 lg:px-8">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-600 to-pink-600 flex items-center justify-center shadow-[0_0_15px_rgba(255,0,255,255,0.3)]">
                <span class="text-white text-xl">🌆</span>
            </div>
            <div>
                <h1 class="font-header font-bold text-xl tracking-widest text-white">TERMOS <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 text-transparent">SINCITY</span></h1>
                <div class="flex items-center gap-2 text-xs text-gray-400 font-mono">
                    <div id="status-dot" class="w-2 h-2 rounded-full bg-red-500"></div>
                    <span id="room-display">OFFLINE</span>
                    <span class="text-[10px] text-pink-400 border border-pink-500/30 px-1 rounded bg-pink-900/20">UNIVERSE</span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="Termai.think()" class="hidden md:flex bg-purple-900/30 hover:bg-purple-800 text-purple-300 text-[10px] font-mono px-3 py-1 rounded border border-purple-500/30">🧠 THINK</button>
            <button onclick="toggleCodeEditor()" class="hidden md:flex bg-white/5 hover:bg-white/10 text-gray-300 text-[10px] font-mono px-3 py-1 rounded border border-white/10">🖋 CODE</button>
            <button onclick="toggleAdminMode()" class="bg-black/40 hover:bg-pink-900/40 border border-white/10 hover:border-pink-500 text-pink-400 px-3 py-1.5 rounded-full text-xs font-bold transition-all">🔑 KEYS</button>
        </div>
    </header>
    
    <!-- CHAT -->
    <main id="chat-container" class="flex-1 overflow-y-auto pt-24 pb-32 px-4 z-10 scroll-smooth max-w-4xl mx-auto w-full"></main>
    
    <!-- INPUT -->
    <div class="fixed bottom-0 left-0 w-full z-30 glass-panel border-t border-white/10 pb-6 pt-4 px-4">
        <div class="max-w-4xl mx-auto">
            <div class="flex items-end gap-2 bg-black/60 rounded-2xl p-2 border border-white/5 input-glow transition-all">
                <input type="text" id="user-input" placeholder="Enter command or chat..." autocomplete="off" class="flex-1 bg-transparent border-none outline-none text-white placeholder-gray-500 px-4 py-3 text-sm font-mono">
                <button onclick="handleInput()" class="p-3 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white shadow-lg transform active:scale-95 shrink-0 font-bold">
                    SEND
                </button>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <!-- ADMIN / KEYS -->
    <div id="admin-panel" class="admin-hidden fixed bottom-24 left-4 right-4 md:left-auto md:right-4 md:w-80 z-50 glass-panel p-4 rounded-xl border-pink-500/30">
        <h3 class="text-pink-400 font-header font-bold mb-3">🔑 NEURAL KEYS</h3>
        <div class="space-y-3">
            <div>
                <label class="block text-[10px] font-bold text-purple-400 mb-1">GROQ API KEY (Required)</label>
                <input type="password" id="cfg-groq" class="w-full bg-black/40 border border-white/10 rounded p-2 text-white focus:border-purple-500 outline-none text-xs font-mono" placeholder="gsk_...">
            </div>
            
            <div class="border-t border-white/10 pt-2 mt-2">
                <h4 class="text-gray-400 text-[10px] font-bold font-mono">GITHUB CREDENTIALS</h4>
                <div class="space-y-2 mt-2">
                    <input type="text" id="gh-owner" placeholder="Owner" class="w-full bg-black/40 border border-white/10 rounded p-2 text-white outline-none text-xs font-mono" value="ingrptr-lt">
                    <input type="text" id="gh-repo" placeholder="Repo" class="w-full bg-black/40 border border-white/10 rounded p-2 text-white outline-none text-xs font-mono" value="termchat-lt">
                    <input type="password" id="gh-token" placeholder="Token" class="w-full bg-black/40 border border-white/10 rounded p-2 text-white outline-none text-xs font-mono">
                </div>
            </div>

            <button onclick="saveConfig()" class="w-full bg-pink-600 hover:bg-pink-500 text-white text-xs font-bold py-2 rounded-lg shadow-lg">SAVE & CONNECT</button>
            <button onclick="initiateEvolution()" class="w-full bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold py-2 rounded-lg shadow-lg mt-2">🧬 PUSH TO GITHUB</button>
        </div>
    </div>

    <!-- CODE EDITOR -->
    <div id="code-editor-overlay" class="fixed inset-0 z-[70] bg-[#0f0c29] flex flex-col admin-hidden">
        <div class="editor-header p-4 border-b border-white/10 flex justify-between items-center bg-black">
            <h2 class="text-white font-bold font-header text-xl">SYSTEM EDITOR</h2>
            <div class="flex gap-2">
                <button onclick="applyCode()" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded font-mono text-xs font-bold">APPLY</button>
                <button onclick="toggleCodeEditor()" class="text-gray-400 hover:text-white px-4 py-2 rounded font-mono text-xs">✖</button>
            </div>
        </div>
        <textarea id="code-editor-textarea" class="flex-1 bg-[#050510] text-purple-400 font-mono text-sm p-4 border-none resize-none outline-none" spellcheck="false"></textarea>
    </div>

<script>
    // --- VISUAL ENGINE (OPTIMIZED FOR NO LAG) ---
    const Visuals = {
        canvas: null,
        ctx: null,
        width: 0,
        height: 0,
        mode: 'sincity', // 'sincity' | 'matrix' | 'universe'
        
        // PARTICLES
        stars: [],
        gridOffset: 0,
        matrixDrops: [],
        
        init: function() {
            this.canvas = document.getElementById('main-canvas');
            this.ctx = this.canvas.getContext('2d');
            this.resize();
            window.addEventListener('resize', () => this.resize());
            
            // Initialize objects
            this.initStars();
            this.initMatrix();
            
            this.startLoop();
        },

        resize: function() {
            this.width = this.canvas.width = window.innerWidth;
            this.height = this.canvas.height = window.innerHeight;
            // Re-init matrix drops on resize
            const fontSize = 14;
            const columns = Math.floor(this.width / fontSize);
            this.matrixDrops = Array(columns).fill(1);
        },

        initStars: function() {
            this.stars = [];
            for(let i=0; i<150; i++) {
                this.stars.push({
                    x: Math.random() * this.width,
                    y: Math.random() * this.height,
                    z: Math.random() * 2, // Depth
                    size: Math.random() * 1.5
                });
            }
        },

        initMatrix: function() {
            // Re-populated in resize
        },

        // --- RENDER LOOP (THE HEART) ---
        startLoop: function() {
            const draw = () => {
                // 1. FADE EFFECT (Instead of clearRect) - Creates trails, looks cooler + faster
                this.ctx.fillStyle = 'rgba(5, 5, 10, 0.15)'; // Very dark purple trail
                this.ctx.fillRect(0, 0, this.width, this.height);
                
                // 2. RENDER LAYERS
                this.drawUniverse();  // Stars
                this.drawSincity();  // Grid & Sun
                this.drawMatrix();  // Rain
                
                requestAnimationFrame(draw);
            };
            requestAnimationFrame(draw);
        },

        // LAYER 1: UNIVERSE
        drawUniverse: function() {
            this.ctx.fillStyle = '#fff';
            this.stars.forEach(star => {
                // Parallax movement
                star.x -= star.z * 0.2; 
                if(star.x < 0) star.x = this.width;
                
                const alpha = star.z / 2;
                this.ctx.globalAlpha = alpha;
                this.ctx.beginPath();
                this.ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                this.ctx.fill();
            });
            this.ctx.globalAlpha = 1.0;
        },

        // LAYER 2: SINCITY (The "City")
        drawSincity: function() {
            const w = this.width;
            const h = this.height;
            const horizon = h * 0.6; // Horizon line

            // A. RETRO SUN
            const sunGradient = this.ctx.createLinearGradient(0, 0, 0, 1);
            sunGradient.addColorStop(0, '#ff00ff'); // Pink
            sunGradient.addColorStop(1, '#ffff00'); // Yellow
            
            this.ctx.fillStyle = sunGradient;
            this.ctx.beginPath();
            this.ctx.arc(w * 0.5, horizon, 100, 0, Math.PI * 2);
            this.ctx.fill();
            
            // Sun Glow
            const glow = this.ctx.createRadialGradient(w*0.5, horizon, 0, 100, 0, 200);
            glow.addColorStop(0, 'rgba(255, 0, 255, 0.4)');
            glow.addColorStop(1, 'rgba(255, 0, 255, 0)');
            this.ctx.fillStyle = glow;
            this.ctx.fillRect(0, horizon - 100, w, 200);

            // B. PERSPECTIVE GRID (Moving)
            this.gridOffset = (this.gridOffset + 0.5) % 40; // Speed
            
            this.ctx.strokeStyle = 'rgba(255, 0, 255, 0.2)'; // White/Pink grid
            this.ctx.lineWidth = 1;
            
            // Floor
            this.ctx.beginPath();
            this.ctx.moveTo(0, h);
            this.ctx.lineTo(w, h);
            this.ctx.stroke();

            // Vertical Lines (Perspective)
            for (let i = 0; i < w; i += 40) {
                let x = (i + this.gridOffset) % w;
                this.ctx.beginPath();
                // Simple perspective hack
                this.ctx.moveTo(x, h);
                this.ctx.lineTo((x - w/2) * 3 + w/2, h + 100);
                this.ctx.stroke();
            }
            
            // Horizontal Lines
            for (let i = h; i < h + 100; i+= 20) {
                this.ctx.beginPath();
                this.ctx.moveTo(0, i);
                this.ctx.lineTo(w, i);
                this.ctx.stroke();
            }
        },

        // LAYER 3: MATRIX RAIN
        drawMatrix: function() {
            const fontSize = 14;
            const columns = Math.floor(this.width / fontSize);
            const letters = '01XYZ';
            
            // Ensure drops array size matches columns
            if(this.matrixDrops.length !== columns) this.resize();
            
            this.ctx.fillStyle = (this.mode === 'sincity') ? '#ff00ff' : '#00ff00'; // Pink in City, Green in Matrix
            
            for(let i=0; i<drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                this.ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                // Reset drop
                if(drops[i] * fontSize > this.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        },
        
        // Toggle Mode for performance
        setMode: function(modeName) {
            this.mode = modeName;
            addSystemMessage(`VISUAL ENGINE: ${modeName.toUpperCase()}`);
        }
    };

    // --- SYSTEM LOGIC (TERMAI) ---
    const Termai = {
        key: '',
        url: 'https://api.groq.com/openai/v1/chat/completions',
        model: 'llama-3.3-70b-versatile',

        init: function() {
            this.key = localStorage.getItem('termos_key_groq') || "";
            this.updateStatus();
        },
        updateStatus: function() {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('room-display');
            if(this.key) {
                dot.className = "w-2 h-2 rounded-full bg-pink-400 shadow-[0_0_10px_#ff00ff]";
                txt.innerText = "ONLINE (GROQ)";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-red-500 animate-pulse";
                txt.innerText = "OFFLINE";
            }
        },
        ask: async function(prompt) {
            if(!this.key) { toggleAdminMode(); return null; }
            
            const response = await fetch(this.url, {
                method: "POST",
                headers: { "Authorization": `Bearer ${this.key}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: this.model,
                    messages: [
                        { role: "system", content: "You are an AI assistant in a cyberpunk Sin City OS. Be cool and concise." },
                        { role: "user", content: prompt }
                    ]
                })
            });
            const data = await response.json();
            if(data.error) throw new Error(data.error.message);
            return data.choices[0].message.content;
        },
        think: async function() {
            addSystemMessage("NEURAL SCAN...");
            const response = await this.ask("Analyze user state and suggest a visual upgrade (command: /sys install ...)");
            addNeuralMessage(response);
        }
    };

    // --- APP STATE ---
    let userProfile = { name: "User", avatar: "👤" };
    
    // --- BOOT ---
    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('boot-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('boot-screen').remove(), 1000);
            
            Visuals.init(); // Start Graphics Engine
            Termai.init();
            
            if(!Termai.key) setTimeout(() => toggleAdminMode(), 1000);
        }, 1000);
    });

    // --- DOM HELPERS ---
    function getBox() { return document.getElementById('chat-container'); }
    function scrollDown() { const b=getBox(); if(b) b.scrollTo({ top: b.scrollHeight, behavior: 'smooth' }); }
    function escapeHtml(t) { if(!t) return ""; return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function addSystemMessage(txt) {
        const box = getBox();
        const d = document.createElement('div');
        d.className = "flex justify-center my-4 msg-anim";
        d.innerHTML = `<span class="px-3 py-1 rounded-full text-[10px] font-bold text-purple-300 bg-purple-900/30 border border-purple-500/30">${txt}</span>`;
        box.appendChild(d);
        scrollDown();
    }
    function addNeuralMessage(txt) {
        const box = getBox();
        const d = document.createElement('div');
        d.className = "flex gap-3 my-4 msg-anim";
        d.innerHTML = `<div class="w-8 h-8 rounded-full avatar-gradient-neural shrink-0 flex items-center justify-center"><span class="text-xs font-bold text-white">🧠</span></div><div class="flex-1"><div class="neural-msg rounded-2xl rounded-tl-none p-3 text-sm text-gray-200">${escapeHtml(txt)}</div></div>`;
        box.appendChild(d);
        scrollDown();
    }
    function addUserMessage(txt) {
        const box = getBox();
        const d = document.createElement('div');
        d.className = "flex flex-row-reverse gap-3 my-4 msg-anim";
        d.innerHTML = `
            <div class="w-10 h-10 rounded-full bg-slate-800 border border-white/10 flex items-center justify-center text-xl shrink-0">${userProfile.avatar}</div>
            <div class="flex-1 max-w-[80%]">
                <div class="rounded-2xl rounded-tr-none p-3 shadow-lg text-white text-sm" style="background: var(--msg-user-bg);">${escapeHtml(txt)}</div>
                <div class="text-[10px] text-gray-500 text-right mt-1 font-mono">${new Date().toLocaleTimeString()} • ${userProfile.name}</div>
            </div>
        `;
        box.appendChild(d);
        scrollDown();
    }

    // --- INPUT HANDLER ---
    async function handleInput() {
        const inp = document.getElementById('user-input');
        let txt = inp.value.trim();
        if(!txt) return;
        
        if(txt.startsWith('/ai ')) {
            const res = await Termai.ask(txt.substring(4));
            if(res) addNeuralMessage(res);
        } else if(txt.startsWith('/think')) {
            Termai.think();
        } else if(txt === '/matrix') {
            Visuals.setMode('matrix');
        } else if(txt === '/sincity') {
            Visuals.setMode('sincity');
        } else if(txt === '/universe') {
            Visuals.setMode('universe');
        } else {
            addUserMessage(txt);
        }
        inp.value = '';
    }

    document.getElementById('user-input').addEventListener('keypress', (e) => { if(e.key==='Enter') handleInput(); });

    // --- UI TOGGLES ---
    function toggleAdminMode() { const p = document.getElementById('admin-panel'); if(p.classList.contains('admin-hidden')) p.classList.remove('admin-hidden'); else p.classList.add('admin-hidden'); }
    function toggleCodeEditor() {
        const el = document.getElementById('code-editor-overlay');
        if(el.classList.contains('admin-hidden')) {
            document.getElementById('code-editor-textarea').value = document.documentElement.outerHTML;
            el.classList.remove('admin-hidden');
        } else {
            el.classList.add('admin-hidden');
        }
    }
    function applyCode() { if(confirm("Inject code?")) { document.open(); document.write(document.getElementById('code-editor-textarea').value); document.close(); } }
    function saveConfig() {
        Termai.key = document.getElementById('cfg-groq').value.trim();
        localStorage.setItem('termos_key_groq', Termai.key);
        Termai.updateStatus();
        toggleAdminMode();
        addSystemMessage("SYSTEM UPDATED");
    }

    // --- EVOLUTION (GITHUB PUSH) ---
    async function initiateEvolution() {
        if(!Termai.key) return addSystemMessage("MISSING GROQ KEY");
        
        const owner = document.getElementById('gh-owner').value.trim();
        const repo = document.getElementById('gh-repo').value.trim();
        const token = document.getElementById('gh-token').value.trim();
        
        if(!token || !owner || !repo) return addSystemMessage("MISSING GITHUB CREDS");

        addSystemMessage("CLONING REPOSITORY...");
        
        try {
            // 1. Get Current File
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/index.html`, {
                headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
            });
            const data = await res.json();
            
            // 2. AI Mutation
            addSystemMessage("AI MUTATING SOURCE CODE...");
            const aiRes = await fetch(Termai.url, {
                method: "POST",
                headers: { "Authorization": `Bearer ${Termai.key}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: Termai.model,
                    messages: [{ role: "system", content: "Return ONLY raw HTML code." }, { role: "user", content: "Upgrade visuals to High Performance Sin City theme." }]
                })
            });
            const aiData = await aiRes.json();
            let newCode = aiData.choices[0].message.content;
            // Clean markdown
            newCode = newCode.replace(/```html/g, "").replace(/```/g, "").trim();
            
            // 3. Push to GitHub
            addSystemMessage("UPLOADING EVOLUTION...");
            const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/index.html`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: "Evolution via TermOS",
                    content: btoa(unescape(encodeURIComponent(newCode))),
                    sha: data.sha
                })
            });

            if(putRes.ok) {
                addSystemMessage("✅ SUCCESS! SITE REBOOTING...");
                setTimeout(() => location.reload(), 3000);
            } else {
                throw new Error("Write Failed");
            }
        } catch(e) {
            addSystemMessage("❌ ERROR: " + e.message);
        }
    }
</script>
</body>
</html>
