<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TermOS: Artisan</title>
    <meta name="theme-color" content="#2a2a3e">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root { 
            --paper-bg: #f0f4f8;
            --ink-primary: #2d3748;
            --accent-paint: #d53f8c; /* Pink */
            --accent-sky: #3182ce;   /* Blue */
            --shadow-ink: 4px 4px 0px rgba(0,0,0,0.1);
            --shadow-deep: 8px 8px 0px rgba(0,0,0,0.15);
        }
        
        body { 
            background: #e2e8f0; 
            color: #2d3748; 
            font-family: 'Patrick Hand', cursive; 
            overflow: hidden;
        }

        /* PAINTED CANVAS BACKGROUND */
        #paint-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.4; pointer-events: none; }
        
        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        
        /* UI PANELS (Sketch Style) */
        .sketch-panel { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(8px); 
            border: 2px solid #2d3748; 
            border-radius: 20px; 
            box-shadow: var(--shadow-ink); 
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .sketch-panel:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--shadow-deep);
        }
        
        .sketch-input {
            background: #fff;
            border: 2px dashed #cbd5e0;
            border-radius: 15px;
            outline: none;
            font-family: 'Patrick Hand', cursive;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        .sketch-input:focus {
            border-color: var(--accent-sky);
            background: #ebf8ff;
        }
        
        .sketch-btn {
            background: #fff;
            border: 2px solid #2d3748;
            border-radius: 50px;
            font-family: 'Patrick Hand', cursive;
            font-weight: bold;
            color: #2d3748;
            transition: all 0.2s;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        .sketch-btn:hover {
            transform: scale(1.05) rotate(-1deg);
            background: #2d3748;
            color: #fff;
        }
        .sketch-btn:active {
            transform: scale(0.95);
        }

        /* Animations */
        @keyframes paintSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .paint-anim { animation: paintSlide 0.5s ease-out forwards; }

        /* Video */
        .video-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: 100%;
        }
        .video-box {
            background: #000; border-radius: 15px; overflow: hidden; border: 2px solid #2d3748; box-shadow: var(--shadow-ink); position: relative;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); /* Mirror */ }

        /* Utilities */
        .admin-hidden { display: none; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        
        .gradient-text {
            background: linear-gradient(45deg, var(--accent-paint), var(--accent-sky));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col relative">
    <input type="file" id="avatar-upload" class="hidden" accept="image/*">
    <canvas id="paint-canvas"></canvas>
    
    <!-- HEADER -->
    <header id="app-header" class="fixed top-4 left-4 right-4 z-20 sketch-panel h-16 flex items-center justify-between px-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-400 to-blue-500 border-2 border-white shadow-sm"></div>
            <div>
                <h1 class="font-bold text-xl leading-none">TermOS <span class="text-pink-500">Artisan</span></h1>
                <div class="flex items-center gap-2 text-xs text-gray-500 mt-1">
                    <div id="api-status-dot" class="w-2 h-2 rounded-full bg-gray-300"></div>
                    <span id="room-display">CANVAS READY</span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div id="room-badge" class="hidden px-3 py-1 bg-blue-100 text-blue-600 rounded-full text-xs border border-blue-300 font-bold tracking-wide">
                <span id="current-room-name">PUBLIC</span>
            </div>
            <button onclick="triggerKernelThought()" class="hidden md:flex sketch-btn px-3 text-xs">🎨 SKETCH IDEAS</button>
            <button onclick="toggleMediaOverlay()" class="hidden md:flex sketch-btn px-3 text-xs">🎥 VIDEO ROOM</button>
            <button onclick="openProfileModal()" class="hidden md:flex sketch-btn px-3 text-xs">👤 PROFILE</button>
            <button onclick="toggleAdminMode()" class="bg-red-100 hover:bg-red-500 hover:text-white text-red-500 sketch-btn px-3 py-1 text-xs transition-colors">⚙️</button>
        </div>
    </header>
    
    <!-- MAIN CHAT -->
    <main id="chat-container" class="flex-1 overflow-y-auto pt-28 pb-40 px-4 z-10 scroll-smooth max-w-4xl mx-auto w-full"></main>
    
    <!-- INPUT AREA -->
    <div class="fixed bottom-6 left-6 right-6 z-30 flex justify-center pointer-events-none">
        <div class="w-full max-w-3xl bg-white/95 p-2 rounded-full border-2 border-gray-800 shadow-[0_8px_30px_rgba(0,0,0,0.1)] pointer-events-auto flex items-center">
            <button onclick="toggleVoice()" class="w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 flex items-center justify-center transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7m0 0H8m4 0h4m-4 8H8"></path></svg>
            </button>
            <input type="text" id="user-input" placeholder="Type here..." autocomplete="off" class="flex-1 bg-transparent border-none outline-none text-gray-700 px-4 py-2 font-hand text-lg">
            <button id="send-btn" class="w-10 h-10 rounded-full bg-blue-500 hover:bg-blue-600 text-white flex items-center justify-center shadow-md transition-transform active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7 5 14z"></path></svg>
            </button>
        </div>
    </div>

    <!-- FLOATING MEDIA OVERLAY -->
    <div id="media-overlay" class="admin-hidden fixed inset-4 md:inset-10 z-50 sketch-panel flex flex-col p-4 md:p-6 bg-white">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold text-gray-800">🎥 Art Gallery / Video</h2>
            <button onclick="toggleMediaUI()" class="text-gray-400 hover:text-gray-800 text-2xl">&times;</button>
        </div>

        <!-- Video Controls -->
        <div class="flex gap-4 mb-4 border-b-2 border-gray-100 pb-2">
            <button onclick="switchVideoMode('camera')" id="btn-camera" class="sketch-btn px-4 py-1 bg-pink-100 text-pink-600 border-pink-300">📷 CAMERA</button>
            <button onclick="switchVideoMode('url')" id="btn-url" class="sketch-btn px-4 py-1">📶 URL STREAM</button>
        </div>

        <!-- Video Display Area -->
        <div id="video-stage" class="flex-1 bg-gray-900 rounded-2xl overflow-hidden relative shadow-inner flex items-center justify-center">
            
            <!-- Camera Mode -->
            <div id="camera-view" class="w-full h-full relative">
                <video id="local-video" autoplay muted playsinline class="w-full h-full object-cover hidden"></video>
                <div id="camera-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400">
                    <div class="text-6xl mb-4">🎥</div>
                    <p class="text-lg">Camera is off</p>
                    <button onclick="startCamera()" class="mt-4 px-6 py-2 bg-blue-500 text-white rounded-full font-bold hover:bg-blue-600 shadow-lg transition-transform active:scale-95">START CAMERA</button>
                </div>
                
                <!-- Remote Video (Small Picture-in-Picture style) -->
                <div id="remote-video-container" class="absolute bottom-4 right-4 w-32 h-24 bg-black rounded-xl border-2 border-white shadow-lg hidden">
                    <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
                </div>
            </div>

            <!-- URL Mode -->
            <div id="url-view" class="w-full h-full hidden flex flex-col items-center justify-center p-4">
                <div class="w-full max-w-lg">
                    <input type="text" id="stream-url" placeholder="Paste video URL (mp4, m3u8)..." class="w-full sketch-input p-3 text-sm mb-4">
                    <div class="flex gap-2">
                        <button onclick="playStreamUrl()" class="flex-1 sketch-btn bg-blue-100 text-blue-600 border-blue-300 py-2">▶ PLAY LOCAL</button>
                        <button onclick="shareStreamUrl()" class="flex-1 sketch-btn bg-pink-100 text-pink-600 border-pink-300 py-2">📡 SHARE TO ROOM</button>
                    </div>
                    <div class="h-full bg-black rounded-xl mt-4 flex items-center justify-center overflow-hidden border border-gray-700">
                        <video id="url-player" class="w-full h-full hidden" controls></video>
                        <p id="url-placeholder" class="text-gray-600">Waiting for stream...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PROFILE MODAL -->
    <div id="profile-modal" class="admin-hidden fixed inset-0 z-[60] bg-gray-900/40 backdrop-blur-sm flex items-center justify-center">
        <div class="sketch-panel p-6 max-w-sm w-full mx-4">
            <h3 class="font-bold text-xl mb-4 text-center">✏️ My Profile</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-500 mb-1 ml-2">Nickname</label>
                    <input type="text" id="edit-name" class="w-full sketch-input p-3 text-center">
                </div>
                <div>
                    <label class="block text-sm text-gray-500 mb-1 ml-2">Avatar</label>
                    <div class="flex gap-2">
                        <button onclick="triggerFileUpload()" class="flex-1 sketch-btn p-2 text-sm">📷 Upload</button>
                        <input type="text" id="edit-avatar" placeholder="Emoji" class="w-full sketch-input p-2 text-center">
                    </div>
                </div>
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="saveProfile()" class="flex-1 sketch-btn bg-blue-500 text-white border-blue-600">Save</button>
                <button onclick="closeProfileModal()" class="flex-1 sketch-btn bg-gray-200 text-gray-600">Cancel</button>
            </div>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-panel" class="admin-hidden fixed bottom-24 left-4 right-4 md:right-4 md:w-80 z-40 sketch-panel p-4 bg-white border-red-200">
        <h3 class="font-bold mb-3 text-red-500">🔨 Workbench</h3>
        <div class="space-y-2 text-sm">
            <button onclick="toggleCodeEditor()" class="w-full sketch-btn p-2 text-green-600 border-green-300">🖊 Edit Source</button>
            <div class="border-t-2 border-dashed border-gray-200 pt-2 mt-2">
                <div class="text-xs text-gray-400 mb-1 uppercase font-bold tracking-wider">GitHub Evolution</div>
                <input type="text" id="gh-owner" placeholder="Owner" class="w-full sketch-input p-2 text-xs mb-2">
                <input type="text" id="gh-repo" placeholder="Repo" class="w-full sketch-input p-2 text-xs mb-2">
                <input type="password" id="gh-token" placeholder="Token (Classic)" class="w-full sketch-input p-2 text-xs mb-2">
                <button onclick="initiateEvolution()" class="w-full sketch-btn bg-red-100 text-red-600 p-2">🧬 PUSH & REBOOT</button>
            </div>
        </div>
    </div>

    <!-- CODE EDITOR -->
    <div id="code-editor-overlay" class="admin-hidden fixed inset-0 z-[70] bg-white flex flex-col">
        <div class="p-4 border-b-2 border-gray-200 flex justify-between bg-gray-50">
            <h2 class="font-bold text-xl">🖊 Source Code</h2>
            <div class="flex gap-2">
                <button onclick="applyCode()" class="sketch-btn bg-blue-500 text-white">APPLY</button>
                <button onclick="downloadCode()" class="sketch-btn">SAVE</button>
                <button onclick="toggleCodeEditor()" class="sketch-btn">CLOSE</button>
            </div>
        </div>
        <textarea id="code-editor-textarea" class="flex-1 bg-[#1e1e1e] text-[#d4d4d4] font-mono p-4 text-sm outline-none resize-none"></textarea>
    </div>

<script>
    // --- CONFIG & STATE ---
    const API_MODEL = "llama-3.3-70b-versatile"; 
    let GROQ_API_KEY = localStorage.getItem('termos_groq_key') || "";
    let GITHUB_TOKEN = localStorage.getItem('termos_github_token') || "";
    let REPO_OWNER = localStorage.getItem('termos_repo_owner') || "";
    let REPO_NAME = localStorage.getItem('termos_repo_name') || "";
    
    let systemGeneration = parseInt(localStorage.getItem('termos_gen') || "1");
    let userProfile = { name: localStorage.getItem('termos_name') || "Artist", avatar: localStorage.getItem('termos_avatar') || "🎨" };
    let tempAvatarData = "";

    const MQTT_BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';
    let username = 'User_' + Math.floor(Math.random() * 10000);
    let mqttClient = null;
    let currentRoomName = null;
    let userStats = { level: 1, xp: 0 };

    // WebRTC State
    let localStream = null;
    let peerConnection = null;
    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // --- PAINTED BACKGROUND ENGINE ---
    function initPaintBackground() {
        const canvas = document.getElementById('paint-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        // Drops of paint
        const drops = Array(15).fill().map(() => ({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 100 + 50,
            dx: (Math.random() - 0.5) * 2,
            dy: (Math.random() - 0.5) * 2,
            color: `hsla(${Math.random() * 360}, 70%, 60%, 0.1)`
        }));

        function animate() {
            // Fade out slowly to leave trails
            ctx.fillStyle = '#f0f4f8'; // Paper color
            ctx.fillRect(0, 0, width, height);

            drops.forEach(d => {
                d.x += d.dx;
                d.y += d.dy;
                if(d.x < -100 || d.x > width + 100) d.dx *= -1;
                if(d.y < -100 || d.y > height + 100) d.dy *= -1;

                ctx.beginPath();
                ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
                ctx.fillStyle = d.color;
                ctx.filter = 'blur(20px)';
                ctx.fill();
                ctx.filter = 'none';
            });

            requestAnimationFrame(animate);
        }
        animate();
        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });
    }

    // --- KERNEL (OPTIMIZED) ---
    async function triggerKernelThought() {
        if(!GROQ_API_KEY) return requestApiKey();
        addSystemMessage("🎨 Kernel: Sketching ideas...");
        const thinkingId = "think-" + Date.now();
        getBox().insertAdjacentHTML('beforeend', `<div id="${thinkingId}" class="text-center text-gray-500 text-xs italic my-2">🖊️ Dipping brush...</div>`);
        scrollDown();

        try {
            // OPTIMIZATION: Reduced prompt size for speed
            const prompt = "Analyze app state and suggest 1 visual or functional upgrade. Return exact format: SystemRebuilder.install('name') or /evolve [prompt]. Keep reply under 50 words.";
            
            let r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method:"POST",
                headers:{"Authorization":"Bearer "+GROQ_API_KEY,"Content-Type":"application/json"},
                body:JSON.stringify({
                    model: API_MODEL,
                    messages:[{ role:"system", content:"You are a creative UI designer." }, {role:"user",content:prompt}],
                    max_tokens: 100 // Low token limit for speed
                })
            });
            
            const apiData = await r.json();
            if (apiData.error) throw new Error("Groq: " + apiData.error.message);
            
            const reply = apiData.choices[0].message.content;
            const el = document.getElementById(thinkingId); if(el) el.remove();
            
            addNeuralMessage(reply);
            
            if(reply.includes("SystemRebuilder.install(")) {
                let match = reply.match(/SystemRebuilder\.install\(['"](.*?)['"]\)/);
                if(match) { 
                    setTimeout(() => {
                        if(confirm("Apply sketch: " + match[1] + "?")) SystemRebuilder.install(match[1]);
                    }, 500);
                }
            }
        } catch (e) { 
            const el = document.getElementById(thinkingId); if(el) el.remove();
            addSystemMessage("❌ Brush dropped: " + e.message); 
        }
    }

    // --- VIDEO ROOM (FIXED: CAMERA + P2P) ---
    function toggleMediaOverlay() {
        const el = document.getElementById('media-overlay');
        if(el.classList.contains('admin-hidden')) {
            el.classList.remove('admin-hidden');
            el.classList.add('paint-anim');
        } else {
            el.classList.add('admin-hidden');
            stopCamera(); // Save battery
        }
    }

    function toggleMediaUI() {
        document.getElementById('media-overlay').classList.add('admin-hidden');
        stopCamera();
    }

    function switchVideoMode(mode) {
        document.getElementById('camera-view').classList.add('hidden');
        document.getElementById('url-view').classList.add('hidden');
        document.getElementById('btn-camera').className = "sketch-btn px-4 py-1";
        document.getElementById('btn-url').className = "sketch-btn px-4 py-1";

        if(mode === 'camera') {
            document.getElementById('camera-view').classList.remove('hidden');
            document.getElementById('btn-camera').className = "sketch-btn px-4 py-1 bg-pink-100 text-pink-600 border-pink-300";
        } else {
            document.getElementById('url-view').classList.remove('hidden');
            document.getElementById('btn-url').className = "sketch-btn px-4 py-1 bg-pink-100 text-pink-600 border-pink-300";
        }
    }

    async function startCamera() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            const video = document.getElementById('local-video');
            video.srcObject = localStream;
            video.classList.remove('hidden');
            document.getElementById('camera-placeholder').classList.add('hidden');
            
            // Signal that camera is on
            if(mqttClient && mqttClient.isConnected()) {
                const dest = (currentRoomName) ? `termos/rooms/${currentRoomName}` : "termos/v3/chat";
                mqttClient.publish(dest, JSON.stringify({ user: username, type: 'camera-on', nick: userProfile.name }));
            }
        } catch (e) {
            alert("Camera access denied: " + e.message);
        }
    }

    function stopCamera() {
        if(localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        document.getElementById('local-video').classList.add('hidden');
        document.getElementById('camera-placeholder').classList.remove('hidden');
    }

    // Basic WebRTC Call Logic
    function callUser(targetUser) {
        // Placeholder for P2P logic - requires complex signaling state machine
        // For this demo, we rely on Camera Sharing (Broadcasting)
        alert("P2P Call feature requires active signaling server. Use 'Camera Mode' to broadcast.");
    }

    function playStreamUrl() {
        const url = document.getElementById('stream-url').value;
        if(!url) return;
        const player = document.getElementById('url-player');
        player.src = url;
        player.classList.remove('hidden');
        document.getElementById('url-placeholder').classList.add('hidden');
    }

    function shareStreamUrl() {
        const url = document.getElementById('stream-url').value;
        if(!url) return;
        playStreamUrl();
        if(mqttClient && mqttClient.isConnected()) {
            const dest = (currentRoomName) ? `termos/rooms/${currentRoomName}` : "termos/v3/chat";
            mqttClient.publish(dest, JSON.stringify({ user: username, nick: userProfile.name, type: 'video-url', url: url }));
            addSystemMessage("📡 Shared stream URL.");
        }
    }

    // --- CHAT & UI ---
    function getBox() {
        let el = document.getElementById('chat-container');
        if (!el) {
            el = document.createElement('div');
            el.id = 'chat-container';
            el.className = "flex flex-col h-full w-full p-4 overflow-y-auto z-10";
            document.body.appendChild(el);
        }
        return el;
    }
    function scrollDown() { const b=getBox(); if(b) b.scrollTo({ top: b.scrollHeight, behavior: 'smooth' }); }
    function escapeHtml(text) { if(!text) return ""; return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    function addUserMessage(txt, senderName, senderAvatar) {
        const name = senderName || userProfile.name || "Me";
        const avatar = senderAvatar || userProfile.avatar;
        const d = document.createElement('div');
        d.className = "flex flex-row-reverse gap-3 my-4 items-end paint-anim";
        
        let avatarHTML = `<div class="w-10 h-10 rounded-full bg-gray-200 border-2 border-white shadow-sm flex items-center justify-center text-xl overflow-hidden">${avatar}</div>`;
        if (avatar.startsWith('data:')) {
             avatarHTML = `<div class="w-10 h-10 rounded-full bg-gray-200 border-2 border-white shadow-sm overflow-hidden"><img src="${avatar}" class="w-full h-full object-cover"></div>`;
        }

        d.innerHTML = `
            ${avatarHTML}
            <div class="flex flex-col items-end max-w-[80%]">
                <div class="bg-white p-3 rounded-2xl rounded-tr-none shadow-sm border-2 border-gray-100 text-gray-800 text-sm">${escapeHtml(txt)}</div>
                <span class="text-[10px] text-gray-400 mt-1 mr-1 font-bold">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} • ${name}</span>
            </div>
        `;
        getBox().appendChild(d);
        scrollDown();
    }

    function addAIMessage(txt) {
        const d = document.createElement('div');
        d.className = "flex gap-3 my-4 paint-anim";
        d.innerHTML = `<div class="w-8 h-8 rounded-full bg-blue-100 border-2 border-blue-200 flex items-center justify-center text-xs shadow-sm">AI</div><div class="bg-blue-50 p-3 rounded-2xl rounded-tl-none border-2 border-blue-100 text-gray-700 text-sm shadow-sm">${escapeHtml(txt)}</div>`;
        getBox().appendChild(d);
        scrollDown();
    }
    
    function addNeuralMessage(txt) {
        const d = document.createElement('div');
        d.className = "flex justify-center my-4 paint-anim";
        d.innerHTML = `<div class="bg-pink-50 border-2 border-pink-200 rounded-2xl px-6 py-3 text-pink-600 text-sm shadow-sm max-w-lg text-center font-bold">🧠 ${escapeHtml(txt)}</div>`;
        getBox().appendChild(d);
        scrollDown();
    }

    function addSystemMessage(txt) {
        const d = document.createElement('div');
        d.className = "flex justify-center my-4 paint-anim";
        d.innerHTML = `<span class="text-gray-400 text-xs font-bold uppercase tracking-widest border-b border-gray-300 pb-1">${txt}</span>`;
        getBox().appendChild(d);
        scrollDown();
    }

    // --- CORE LOGIC ---
    function handleInput() {
        const inp = document.getElementById('user-input');
        const txt = inp.value.trim();
        if(!txt) return;

        if(txt.startsWith('/join')) {
            const room = txt.substring(6).trim();
            if(room) {
                currentRoomName = room;
                document.getElementById('room-display').innerText = "ROOM: " + room.toUpperCase();
                document.getElementById('room-badge').classList.remove('hidden');
                document.getElementById('current-room-name').innerText = room.toUpperCase();
                
                // MQTT Logic
                if(mqttClient && mqttClient.isConnected()) {
                    mqttClient.unsubscribe("termos/v3/chat");
                    mqttClient.subscribe(`termos/rooms/${room}`);
                    mqttClient.publish(`termos/rooms/${room}`, JSON.stringify({ user: username, nick: userProfile.name, type: 'join' }));
                    addSystemMessage(`Joined room: ${room}`);
                }
            }
            inp.value = '';
            return;
        }

        if(txt.startsWith('/camera')) {
            toggleMediaOverlay();
            switchVideoMode('camera');
            inp.value = '';
            return;
        }

        addUserMessage(txt);
        if(mqttClient && mqttClient.isConnected()) {
            const dest = (currentRoomName) ? `termos/rooms/${currentRoomName}` : "termos/v3/chat";
            mqttClient.publish(dest, JSON.stringify({ user: username, nick: userProfile.name, text: txt }));
        }
        inp.value = '';
    }

    // --- MQTT ---
    function connectMQTT() {
        try {
            mqttClient = new Paho.MQTT.Client(MQTT_BROKER_URL, "termos_" + Math.random().toString(16).substr(2, 8));
            mqttClient.onConnectionLost = () => { setTimeout(connectMQTT, 5000); };
            mqttClient.connect({
                onSuccess: () => {
                    mqttClient.subscribe("termos/v3/chat");
                    document.getElementById('api-status-dot').classList.add('bg-green-400');
                    document.getElementById('room-display').innerText = "ONLINE";
                }
            });
            mqttClient.onMessageArrived = (msg) => {
                const data = JSON.parse(msg.payloadString);
                
                // Handle Room Logic
                const isCurrentRoom = (currentRoomName && msg.destinationName === `termos/rooms/${currentRoomName}`);
                const isPublic = (!currentRoomName && msg.destinationName === "termos/v3/chat");

                if(isCurrentRoom || isPublic) {
                    if(data.text && data.user !== username) addUserMessage(data.text, data.nick, data.avatar);
                    
                    if(data.type === 'video-url') {
                        addSystemMessage(`${data.nick} started a stream.`);
                        toggleMediaOverlay();
                        switchVideoMode('url');
                        document.getElementById('stream-url').value = data.url;
                        playStreamUrl();
                    }
                    
                    if(data.type === 'camera-on') {
                        addSystemMessage(`${data.nick} turned on camera.`);
                        // In a full P2P app, this would trigger the call.
                        // Here we alert user to go to video room to check (if signaling were implemented)
                        toggleMediaOverlay();
                        switchVideoMode('camera');
                        // Show placeholder for remote
                        document.getElementById('remote-video-container').classList.remove('hidden');
                        document.getElementById('remote-video').poster = data.avatar || "https://via.placeholder.com/150";
                    }
                }
            };
        } catch(e) { console.error(e); }
    }

    // --- MODULES (REBUILDER) ---
    const SystemRebuilder = {
        install: function(name) {
            name = name.toLowerCase().trim();
            try {
                switch(name) {
                    case 'neon':
                        document.documentElement.style.setProperty('--paper-bg', '#1a1a1a');
                        document.documentElement.style.setProperty('--ink-primary', '#00ffcc');
                        document.body.style.background = '#000';
                        addSystemMessage("Installed: Neon Theme");
                        break;
                    case 'sketch':
                        document.documentElement.style.setProperty('--paper-bg', '#fdf6e3');
                        document.documentElement.style.setProperty('--ink-primary', '#654b21');
                        document.body.style.background = '#fdf6e3';
                        addSystemMessage("Installed: Pencil Theme");
                        break;
                    default:
                        addSystemMessage("Unknown theme: " + name);
                }
            } catch(e) { addSystemMessage("Error: " + e.message); }
        }
    };

    // --- INIT ---
    window.onload = function() {
        initPaintBackground();
        document.getElementById('gh-owner').value = REPO_OWNER;
        document.getElementById('gh-repo').value = REPO_NAME;
        document.getElementById('gh-token').value = GITHUB_TOKEN;

        // Bind Events
        document.getElementById('send-btn').onclick = handleInput;
        document.getElementById('user-input').addEventListener('keypress', e => { if(e.key === 'Enter') handleInput(); });

        connectMQTT();
        
        if(!GROQ_API_KEY) {
            setTimeout(() => addSystemMessage("API Key missing. Set via Admin."), 2000);
        }
    };

    // --- ADMIN HELPERS ---
    function toggleAdminMode() { document.getElementById('admin-panel').classList.toggle('admin-hidden'); }
    function openProfileModal() { document.getElementById('profile-modal').classList.remove('admin-hidden'); }
    function closeProfileModal() { document.getElementById('profile-modal').classList.add('admin-hidden'); }
    function saveProfile() { userProfile.name = document.getElementById('edit-name').value; userProfile.avatar = document.getElementById('edit-avatar').value || "🎨"; localStorage.setItem('termos_name', userProfile.name); localStorage.setItem('termos_avatar', userProfile.avatar); closeProfileModal(); }
    function triggerFileUpload() { document.getElementById('avatar-upload').click(); }
    function requestApiKey() { GROQ_API_KEY = prompt("Groq API Key:"); localStorage.setItem('termos_groq_key', GROQ_API_KEY); }
    function forceReset() { if(confirm("Reset?")) { localStorage.clear(); location.reload(); } }
    function toggleVoice() { alert("Voice features pending upgrade..."); }

    // --- CODE EDITOR ---
    function toggleCodeEditor() {
        const overlay = document.getElementById('code-editor-overlay');
        if(overlay.classList.contains('admin-hidden')) {
            overlay.classList.remove('admin-hidden');
            document.getElementById('code-editor-textarea').value = document.documentElement.outerHTML;
        } else {
            overlay.classList.add('admin-hidden');
        }
    }
    function applyCode() { if(confirm("Apply changes?")) { const code = document.getElementById('code-editor-textarea').value; document.open(); document.write(code); document.close(); } }
    function downloadCode() { const code = document.getElementById('code-editor-textarea').value; const blob = new Blob([code], {type: "text/html"}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = "termos.html"; a.click(); }
    
    // --- GITHUB EVOLUTION (OPTIMIZED) ---
    async function initiateEvolution() {
        if(!GROQ_API_KEY) return alert("API Key needed");
        const owner = document.getElementById('gh-owner').value;
        const repo = document.getElementById('gh-repo').value;
        const token = document.getElementById('gh-token').value;
        if(!owner || !repo || !token) return alert("Missing GitHub info");

        const input = prompt("Describe the art upgrade:");
        if(!input) return;
        
        addSystemMessage("🎨 Fetching canvas...");
        try {
            // Fetch Code
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/index.html?ref=main`, { headers: { 'Authorization': `token ${token}` }});
            const data = await res.json();
            if(data.message) throw new Error(data.message);
            const currentCode = atob(data.content);

            // AI Mutation
            addSystemMessage("🖊️ Painting new code...");
            const aiRes = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { 'Authorization': `Bearer ${GROQ_API_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: API_MODEL,
                    messages: [{ role: "system", content: "Return ONLY raw HTML code. No markdown." }, { role: "user", content: `Change this HTML to: "${input}". Keep style inline.\n\n${currentCode}` }]
                })
            });
            const aiData = await aiRes.json();
            let newCode = aiData.choices[0].message.content.replace(/```html/g, "").replace(/```/g, "").trim();

            // Push
            addSystemMessage("🚀 Uploading...");
            const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/index.html`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}` },
                body: JSON.stringify({
                    message: "Art Update: " + input,
                    content: btoa(newCode),
                    sha: data.sha
                })
            });
            if(putRes.ok) {
                addSystemMessage("✅ Masterpiece updated. Reloading...");
                setTimeout(() => location.reload(), 2000);
            } else {
                throw new Error("Upload failed");
            }
        } catch(e) {
            addSystemMessage("❌ " + e.message);
        }
    }
</script>
