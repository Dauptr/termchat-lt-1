<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TermOS: Fixed & Integrated</title>
    <meta name="theme-color" content="#000">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root { 
            /* White/Daumantas Palette */
            --term-bg: #000000; 
            --term-green: #00ff00;
            --term-dim: #003300;
            --term-text: #e5e5e7;
            --accent-primary: #a855f7; 
            --accent-secondary: #67e8f9; 
            --glass-bg: rgba(255, 255, 255, 0.1); 
            --glass-border: rgba(0, 0, 0, 0.1); 
        }
        
        body { 
            background: var(--term-bg); 
            color: var(--term-text); 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            height: 100vh;
        }

        /* MATRIX RAIN (White/Daumantas) */
        #painted-canvas { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 0; 
            pointer-events: none; 
            mix-blend-mode: multiply;
        }
        
        /* SCANLINES */
        body::after {
            content: " ";
            display: block; position: absolute; inset: 0; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 0, 0, 0.01)), rgba(0,0,0));
            z-index: 2;
            background-size: 100% 4px;
            pointer-events: none;
        }
        
        /* UTILITIES */
        .glass-panel { 
            background: var(--glass-bg); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px); 
            border: 1px solid var(--glass-border); 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); 
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 16px;
        }
        
        .glass-panel:hover { 
            background: rgba(255, 255, 255, 0.1); 
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #e5e5e7; border-radius: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        
        .font-header { font-family: 'Orbitron', sans-serif; letter-spacing: 0.05em; }
        .font-code { font-family: 'Fira Code', monospace; }
        .font-ui { font-family: 'Inter', sans-serif; }
        
        /* ANIMATIONS */
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); }
        .scanline { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent, rgba(0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0,0,0));
            background-size: 100% 4px;
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }

        @keyframes scanBar { 0% { width: 0%; } 100% { width: 100%; }
        }

        /* LOGS */
        .log-entry { 
            margin-bottom: 8px;
            font-size: 14px;
            opacity: 0; 
            animation: paintIn 0.3s ease-out forwards; 
        }

        @keyframes paintIn { to { opacity: 1; transform: translateY(10px) scale(0.95); filter: blur(10px); } 
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } 
        }

        /* MODALS */
        .modal-overlay { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px); z-index: 999; }
        
        .modal-content {
            background: #000;
            border: 1px solid #333;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .close-btn {
            background: #333; color: #fff; font-weight: bold; cursor: pointer; padding: 8px 12px; border-radius: 6px; transition: all 0.2s;
        }
        .close-btn:hover { background: #444; }

        /* INPUTS */
        .input-wrapper {
            position: fixed; bottom: 0; width: 100%;
            background: #000;
            padding: 10px;
            border-top: 1px solid #333;
        }

        input[type="text"] {
            width: 100%; 
            background: transparent;
            border: none;
            color: #e5e5e7;
            font-family: 'Fira Code', monospace; 
            outline: none;
            font-size: 16px;
            padding: 8px;
            caret-color: #00ff00;
            text-transform: uppercase;
            font-weight: bold;
        }
        input::placeholder { color: #444; text-transform: none; }

        /* COPILOT */
        .copilot-wrapper { z-index: 50; }
        .copilot-editor {
            width: 100%; 
            height: 300px;
            background: #050505; 
            color: #e5e5e7;
            border: 1px solid #333;
            resize: vertical;
            outline: none;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            padding: 10px;
            overflow-y-auto;
            border-radius: 8px;
            white-space: pre-wrap;
        }

        .code-suggestion {
            position: absolute;
            top: 60px;
            left: 20px;
            width: 220px;
            background: rgba(0, 0, 0, 0.8); /* Slightly brighter */
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 8px 12px;
            border-radius: 6px;
            display: none; /* Hidden by default */
            pointer-events: none;
            z-index: 60;
            backdrop-filter: blur(12px);
        }

        .code-suggestion.active {
            display: block;
            transform: translateY(0);
            box-shadow: 0 0 20px rgba(0, 255, 0);
            z-index: 60;
        }

        /* BUTTONS */
        .tool-btn {
            background: transparent;
            border: 1px solid #333;
            color: #e5e5e7;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .tool-btn:hover {
            background: rgba(0, 0, 0, 0.8); /* Light hover */
            border-color: #666;
        }

        /* MATRIX ORBS */
        .orb { fill: rgba(255, 255, 255, 0.9); /* Slight opacity for trails */
        }

        /* SCANNER */
        #scanner-hud {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 280px;
            padding: 15px;
            background: rgba(0, 0, 0.8);
            border: 1px solid #00ff00;
            display: none; /* Hidden by default */
            z-index: 60;
            backdrop-filter: blur(4px);
        }

        .scan-bar {
            height: 4px;
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
            margin-bottom: 8px;
            width: 0%;
            transition: width 0.2s;
        }
        .scan-bar.active { width: 100%; }

        .scan-text { font-size: 12px; color: #00ff00; font-family: 'Fira Code', monospace; text-align: right; margin-bottom: 4px; }

        /* PREVIEW */
        .preview-iframe {
            width: 100%;
            height: 100%;
            border: 1px solid #333;
            background: #050505;
            border-radius: 8px;
            display: none; /* Hidden by default */
        }
        .preview-container {
            position: absolute;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
        }
    </style>
</head>

<script>
/** 
 * TERMOS: FINAL INTEGRATED
 * Fixed: GrqAI import fix for browser safety.
 * Added: Copilot Logic + Scanner UI + Dual AI + Matrix visuals.
 * Style: White/Daumantas.
 */

// --- CONFIG & STATE ---
const Config = {
    broker: "broker.emqx.io",
    port: 8084,
    user: `User_${Math.floor(Math.random() * 9000) + 1000}`,
    providers: {
        groq: {
            model: "llama-3.3-70b-versatile",
            url: "https://api.groq.com/openai/v1/chat/completions",
            key: ""
        },
        zhipu: {
            model: "glm-4-flash",
            url: "https://open.bigmodel.cn/api/paas/v4/chat/completions",
            key: ""
        }
    },
    currentRoom: null,
    profile: { name: "Guest", avatar: "👤" },
    isConnected: false,
    github: { token: localStorage.getItem('termos_gh_token') || "" },
    copilot: {
        suggestion: null,
        scannerActive: false,
        previewActive: false
    },
    // --- UTILS ---
const Utils = {
    escapeHTML: (str) => {
        if(!str) return "";
        return str.replace(/[&<>'"]/g, 
                tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&#39;', '"': '&quot;'}[tag]));

const AI = {
    query: async (systemPrompt, userPrompt, mode = 'chat') => {
        const provider = Config.activeProvider;
        const config = Config.providers[provider];
        
        if(!config.key) {
            UI.log(`⚠️ ${provider.toUpperCase()} Key Required.`, 'error');
            UI.toggleAdmin();
            return;
        }

        const id = Utils.uuid();
        const loadingTxt = mode === 'code' ? "Compiling..." : "Synthesizing...";
        UI.log(`<span id="${id}" class="text-green-400 italic animate-pulse">${loadingTxt} (${provider})</span>`, "system");

        try {

                headers: { "Authorization": `Bearer ${config.key}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: config.model,
                    messages: [{ role: "system", content: systemPrompt }, { role: "user", content: userPrompt }],
                    temperature: 0.7,
                    max_tokens: 2048
                })
            });
            
            const data = await res.json();
            const reply = data.choices[0].message.content;
            document.getElementById(id).remove();

const Commands = {
    handle: (manualCmd = null) => {
        const txt = manualCmd || UI.input.value.trim();
        if(!txt) return;

        if(!txt.startsWith('/')) {
            UI.renderMessage(txt, "Me", State.profile.avatar, true);
            const topic = State.currentRoom ? `termos/rooms/${State.currentRoom}` : "termos/v3/chat";
            Net.send(topic, { user: Config.user, text: txt, name: State.profile.name, avatar: State.profile.avatar });
            UI.input.value = '';
            return;
        }

        const [cmd, ...args] = txt.split(' ');
        const fullArgs = args.join(' ');

        switch(cmd.toLowerCase()) {
            case '/ai': AI.chat(fullArgs); break;
            case '/code': AI.code(fullArgs); break;
            case '/kernel': AI.think(); break;
            case '/join': 
                document.getElementById('room-name-input').value = fullArgs; 
                UI.toggleJoinModal(); 
                break;
            case '/leave': 
                if(State.currentRoom) {
                    Net.send(`termos/rooms/${State.currentRoom}`, { user: Config.user, type: 'leave' });
                    State.currentRoom = null;
                    document.getElementById('room-badge').classList.add('hidden');
                    Net.subscribe("termos/v3/chat");
                    UI.log("📢 Returned to Public Frequency", "system");
                }
                break;
            default: 
                UI.log(`Unknown command: ${cmd}`, "system");
                UI.input.value = '';
        }
    };

    connect: () => {
        if (typeof Paho === 'undefined') return;
        try {
            State.mqttClient = new Paho.MQTT.Client(Config.broker, Config.port, `termos_${Config.user}`);
            State.mqttClient.onConnectionLost = Net.onLost;
            State.mqttClient.onMessageArrived = Net.onMessage;
            State.mqttClient.connect({
                onSuccess: Net.onConnect,
                onFailure: () => setTimeout(Net.connect, 3000),
                useSSL: true
            });
        },
    onConnect: () => { UI.log("📡 Neural Link Established.", "system"); UI.updateStatus(true); Net.subscribe("termos/v3/chat"); },
    onLost: () => { UI.updateStatus(false); setTimeout(Net.connect, 3000); },
    
    subscribe: (topic) => { if(State.mqttClient && State.mqttClient.isConnected()) State.mqttClient.subscribe(topic, { qos: 1 }); },
    unsubscribe: (topic) => { if(State.mqttClient && State.mqttClient.isConnected()) State.mqttClient.unsubscribe(topic); },
    send: (topic, payload) => {
        if(State.mqttClient && State.mqttClient.isConnected()) { 
            const msg = new Paho.MQTT.Message(JSON.stringify(payload)); 
            msg.destinationName = topic;
            State.mqttClient.send(msg);
        },
    onMessage: (msg) => {
        try {
            const data = JSON.parse(msg.payloadString);
            const isMe = data.user === Config.user;

            if(msg.destinationName === "termos/v3/chat" && !State.currentRoom && !isMe) {
                UI.renderMessage(data.text, data.name, data.avatar, false);
            } else if (msg.destinationName === `termos/rooms/${State.currentRoom}`) {
                if(data.type === 'video' && !isMe) {
                    Media.playVideo(data.url);
                    UI.log(`📺 Transmission from ${data.name}`, "system");
                } else if (!isMe && data.type !== 'video') {
                    UI.renderMessage(data.text, data.name, data.avatar, false);
                }
            }
        } catch(e) {}

const Copilot = {
        onType: (e) => {
            if (State.copilot.timer) clearTimeout(State.copilot.timer);
            State.copilot.timer = setTimeout(() => {
                Copilot.generateSuggestion(e.target.value);
            }, 500); 
        },

        onKey: (e) => {
            if (e.key === 'Tab' && State.copilot.suggestion) {
                e.preventDefault();
                Copilot.acceptSuggestion();
            } else if (e.key !== 'Tab') {
                document.getElementById('copilot-suggestion').classList.remove('active');
                State.copilot.suggestion = null;
            }
        },

        generateSuggestion: async (code) => {
            if (code.length < 3) return;
            
            const provider = Config.activeProvider;
            const config = Config.providers[provider];
            if(!config.key) return;

            // Show "Thinking"
            document.getElementById('copilot-status').classList.remove('hidden');
            document.getElementById('copilot-suggestion').classList.remove('active');

            try {
                const res = await fetch(config.url, {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${config.key}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: config.model,
                        messages: [
                            { role: "system", content: "You are a code completion AI. Complete the user's code. Return ONLY the new completion string. Do not wrap in markdown. Do not repeat the user's last word." },
                            { role: "user", content: code }
                        ],
                        temperature: 0.2,
                        max_tokens: 50
                    })
                });
                
                const data = await res.json();
                document.getElementById('copilot-status').classList.add('hidden');
                
                if(data.choices && data.choices[0]) {
                    const completion = data.choices[0].message.content.trim();
                    Copilot.showSuggestion(completion, code);
                }
            } catch (e) {
                const loader = document.getElementById('copilot-status');
                if(loader) loader.remove();
                document.getElementById('copilot-suggestion').classList.remove('active');
            }
        },

        showSuggestion: (suggestion, currentCode) => {
            let displayText = suggestion;
            
            const lastWord = currentCode.split(/\s+/).pop(); 
            
            // Smart Overlap Removal Logic
            if (lastWord && suggestion.startsWith(lastWord)) {
                displayText = suggestion.slice(lastWord.length);
            }

            State.copilot.suggestion = suggestion; 
            document.getElementById('suggestion-text').textContent = displayText;
            document.getElementById('copilot-suggestion').classList.add('active');
        },

        acceptSuggestion: () => {
            if(!State.copilot.suggestion) return;
            const editor = UI.copilotEditor;
            const suggestion = State.copilot.suggestion;
            
            const cursorPos = editor.selectionStart;
            const textBefore = editor.value.substring(0, cursorPos);
            const textAfter = editor.value.substring(cursorPos, editor.value.length);
            
            // Smart Overlap Removal Logic
            let textToInsert = suggestion;
            const lastChars = editor.value.slice(Math.max(0, cursorPos - 20), cursorPos);
            
            if (suggestion.startsWith(lastChars)) {
                // If they are identical or close enough, strip the prefix
                textToInsert = suggestion.slice(lastChars.length);
            }

            // Insert Logic
            editor.value = textBefore + textToInsert + textAfter;
            State.copilot.suggestion = null;
            document.getElementById('copilot-suggestion').classList.remove('active');
            
            // Move cursor
            const newCursorPos = cursorPos + textToInsert.length;
            editor.selectionStart = newCursorPos;
            editor.selectionEnd = newCursorPos;
            editor.focus();
            UI.flash();
        }
    };

// --- COMMANDS ---
const Commands = {
    handle: (manualCmd = null) => {
        const txt = manualCmd || UI.input.value.trim();
        if(!txt) return;

        if(!txt.startsWith('/')) {
            UI.renderMessage(txt, "Me", State.profile.avatar, true);
            const topic = State.currentRoom ? `termos/rooms/${State.currentRoom}` : "termos/v3/chat";
            Net.send(topic, { user: Config.user, text: txt, name: State.profile.name, avatar: State.profile.avatar });
            UI.input.value = '';
            return;
        }

        const [cmd, ...args] = txt.split(' ');
        const fullArgs = args.join(' ');

        switch(cmd.toLowerCase()) {
            case '/ai': AI.chat(fullArgs); break;
            case '/code': AI.code(fullArgs); break;
            case '/kernel': AI.think(); break;
            case '/join': document.getElementById('room-name-input').value = fullArgs; UI.toggleJoinModal(); break;
            case '/leave': 
                if(State.currentRoom) {
                    Net.send(`termos/rooms/${State.currentRoom}`, { user: Config.user, type: 'leave' });
                    State.currentRoom = null;
                    document.getElementById('room-badge').classList.add('hidden');
                    Net.subscribe("termos/v3/chat");
                    UI.log("📢 Returned to Public Frequency", "system");
                }
                break;
            default: UI.log(`Unknown command: ${cmd}`, "system");
            UI.input.value = '';
        }
    };

    // --- MODERN BUILD SCANNER ---
const Rebuilder = {
    container: document.getElementById('build-preview-container'),
    iframe: document.getElementById('build-iframe'),
    hud: document.getElementById('scanner-hud'),
    scanBar: document.getElementById('scan-bar'),
    scanText = document.getElementById('scan-text'),
    scanTimer: null,

    toggleLivePreview: () => {
        State.copilot.previewActive = !State.copilot.previewActive;
        const container = document.getElementById('build-preview-container');
        
        const scannerBtn = document.querySelector('.tool-btn-scanner'); 
        if(State.copilot.previewActive) {
            container.style.display = 'block';
            if (State.copilot.scanner.isActive) {
                Rebuilder.scanAndInject();
                scannerBtn.classList.add('active');
            } else {
                hud.style.display = 'none';
                document.getElementById('scan-bar').classList.remove('scanner-active');
            }
        },

        scanAndInject: async () => {
            const code = UI.copilotEditor.value;
            
            // Visual Feedback
            Rebuilder.updateScannerUI("SCANNING SYNTAX...");
            setTimeout(() => {
                // Create wrapper HTML
                const fullDoc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><title>Preview</title>
                <style>body{background:#0f0f0f0;color:#333;font-family:sans-serif;padding:20px;}</style></head></head><body>${code}</body></html>`;
                
                // Inject into iframe
                const doc = Rebuilder.iframe.contentDocument || Rebuilder.iframe.contentWindow.document;
                doc.open();
                doc.write(fullDoc);
                doc.close();
                
                Rebuilder.updateScannerUI("BUILD COMPLETE", true);
                UI.log(`⚡ Build finished. [${code.length} chars]`, "system");
            }, 300);
        },

        updateScannerUI: (status, success) => {
            if(!Rebuilder.text) return;
            Rebuilder.text = status;
            Rebuilder.scanText.textContent = status;
            Rebuilder.scanText.style.color = success ? '#00ff00' : '#ffff00';
            Rebuilder.scanText.style.textShadow = success ? '0 0 10px #00ff00' : 'none';
            
            if(Rebuilder.scanBar) {
                Rebuilder.scanBar.classList.remove('active');
                Rebuilder.scanBar.classList.remove('scanner-active');
            } 
            if(Rebuilder.scanBar) {
                Rebuilder.scanBar.classList.add('active');
            }
        }
    };

// --- COPIL
    window.onload = UI.init;

</script>
</body>
</html>
