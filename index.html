<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TermOS: Light Edition</title>
    <meta name="theme-color" content="#f3f4f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- LIBRARIES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <!-- FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Light Theme Palette */
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1f2937;
            --text-secondary: #64748b;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --border-color: #e5e7eb;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --input-bg: #f1f5f9;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        body {
            background: linear-gradient(135deg, #fdfbf7 0%, #e3f2fd 100%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- BACKGROUND (Subtle Grid) --- */
        #bg-canvas {
            position: fixed; inset: 0; z-index: 1;
            opacity: 0.4;
            pointer-events: none;
        }
        
        /* --- UI LAYOUT --- */
        .app-shell {
            position: relative; z-index: 10;
            display: grid;
            grid-template-columns: 1fr;
            height: 100%;
        }
        @media (min-width: 768px) {
            .app-shell {
                grid-template-columns: 260px 1fr;
            }
        }

        /* --- SIDEBAR (Clean White) --- */
        .sidebar {
            background: #ffffff;
            border-right: 1px solid var(--border-color);
            display: none; /* Hidden on mobile */
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }
        @media (min-width: 768px) { .sidebar { display: flex; } }
        
        .menu-item {
            display: flex; align-items: center; gap: 12px;
            width: 100%;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 12px;
            transition: background 0.2s, color 0.2s;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .menu-item:hover {
            background: var(--bg-secondary);
            color: var(--text-main);
        }
        .menu-item.active {
            background: #eff6ff; /* Light blue bg for active */
            color: var(--accent-blue);
            font-weight: 600;
            box-shadow: var(--shadow);
        }

        /* --- HEADER (Clean) --- */
        .header {
            height: 60px;
            padding-top: env(safe-area-inset-top, 0px);
            background: rgba(255, 255, 255, 0.8); /* Slight transparency */
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px;
        }
        .brand {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }
        .brand span { color: var(--accent-blue); }
        
        /* Status Indicator (Core) */
        .status-container {
            display: flex; align-items: center; gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #ccc;
            transition: background 0.3s;
        }
        .status-dot.online { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.3); }
        .status-dot.processing { background: #f59e0b; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* --- CONTENT AREA --- */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 120px;
            background: transparent; /* Show grid behind */
        }

        /* --- MESSAGES (Clean Modern Bubbles) --- */
        .msg-row { display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-end; }
        .msg-row.user { flex-direction: row-reverse; }
        
        .msg-bubble {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 12px 18px;
            max-width: 80%;
            position: relative;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: var(--text-main);
            box-shadow: var(--shadow);
            word-wrap: break-word;
        }
        .msg-bubble.user {
            background: var(--accent-blue);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.15);
        }
        .msg-bubble.other {
            background: #fff;
            border-bottom-left-radius: 4px;
        }
        .sender-name {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
            display: block;
            font-family: 'JetBrains Mono', monospace;
        }

        /* --- SYSTEM MESSAGES (Monospace) --- */
        .system-msg {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
            background: #f8fafc;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            text-align: center;
            align-self: center;
            border: 1px dashed var(--border-color);
        }

        /* --- INPUT DOCK (Modern) --- */
        .input-dock {
            position: absolute; bottom: 0;
            width: 100%;
            padding: 20px;
            padding-bottom: calc(20px + var(--safe-bottom));
            background: #ffffff;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 20;
        }
        
        .game-input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 16px 20px;
            font-size: 1rem;
            outline: none;
            border-radius: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: 'JetBrains Mono', monospace;
        }
        .game-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .btn-action {
            background: var(--text-main);
            color: #fff;
            border: none;
            padding: 0 24px;
            height: 48px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.1s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-action:active { transform: scale(0.95); opacity: 0.9; }
        .btn-action.primary { background: var(--accent-blue); }

        /* --- MOBILE NAV (Light) --- */
        .mobile-dock {
            position: fixed; bottom: 0; left: 0; width: 100%;
            height: calc(70px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: #ffffff;
            border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 30;
        }
        @media (min-width: 768px) { .mobile-dock { display: none; } }
        
        .dock-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-secondary);
            cursor: pointer; padding: 10px;
            width: 33%; justify-content: center;
            transition: color 0.2s;
        }
        .dock-item.active { color: var(--accent-blue); background: #eff6ff; }

        /* --- MODALS & OVERLAYS --- */
        .overlay {
            position: fixed; inset: 0; background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none; align-items: center; justify-content: center;
        }
        .overlay.active { display: flex; animation: fadeIn 0.2s ease-out; }
        .overlay-box {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            width: 90%; max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }
        .overlay-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 20px;
        }
        .input-field {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-family: 'JetBrains Mono', monospace;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- BACKGROUND -->
    <canvas id="bg-canvas"></canvas>

    <!-- ACTION OVERLAYS -->
    <!-- Settings Modal -->
    <div id="settings-overlay" class="overlay">
        <div class="overlay-box">
            <div class="overlay-title">System Config</div>
            <input type="password" id="key-groq" class="input-field" placeholder="GROQ API KEY">
            <input type="password" id="key-zhipu" class="input-field" placeholder="ZHIPU API KEY">
            <div class="flex gap-2 mt-4">
                <button onclick="App.saveSettings()" class="btn-action primary">SAVE</button>
                <button onclick="App.closeSettings()" style="background:var(--bg-secondary); color:var(--text-main);">CANCEL</button>
            </div>
        </div>
    </div>

    <div class="app-shell">
        <!-- Sidebar (Desktop) -->
        <nav class="sidebar">
            <div class="menu-item active" onclick="App.setMode('chat')">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 10c0 3.866-2.14-8 8-8 8a9.863 9.863 0 01-4.255-.949L3 14l1.395-3.72C3.512 9.642 3 13.574 3 12c0-3.866 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </div>
            <div class="menu-item" onclick="App.openYouTube()">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 18a8 8 0 100-16 0 1.414 0 0 0 0 16l-5-5-5 1.414 0 0 0 0-5.414 0 0 0-5.414 0 0 0-5.414 5.414 5.414 5.414 0 0-5.414 5.414 9 9 9 0z"></path></svg>
            </div>
            <div class="menu-item" onclick="App.openSettings()">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 2.924 0 1.414 0 0 2.573 1.066c1.543-.94 3.31-2.573 1.066c1.543.94 3.31-2.573.94-3.31.826-2.37a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
            </div>
        </nav>

        <main class="main-view">
            <!-- Header -->
            <header class="header">
                <div class="brand">TermOS <span>Light</span></div>
                <div class="status-container">
                    <div id="status-dot" class="status-dot"></div>
                    <span id="status-text">SYSTEM IDLE</span>
                </div>
            </header>

            <!-- Chat Area -->
            <div class="content-area" id="content-area">
                <div class="system-msg">Welcome to the Light Interface.</div>
                <div class="system-msg">AI Provider: Local (Free)</div>
            </div>

            <!-- Input Dock -->
            <div class="input-dock">
                <input type="text" id="main-input" class="game-input" placeholder="Type a message..." autocomplete="off">
                <button onclick="App.submit()" class="btn-action primary">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
        </main>
    </div>

    <!-- Mobile Dock -->
    <div class="mobile-dock">
        <div class="dock-item active" onclick="App.setMode('chat')">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 10c0 3.866-2.14-8 8-8 8a9.863 9.863 0 01-4.255-.949L3 14l1.395-3.72C3.512 9.642 3 13.574 3 12c0-3.866 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            <span>Chat</span>
        </div>
        <div class="dock-item" onclick="App.openYouTube()">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 18a8 8 0 100-16 0 1.414 0 0 0 16l-5-5-5 1.414 0 0 0-5.414 0 0 0-5.414 5.414 5.414 9 9 9 0z"></path></svg>
            <span>Video</span>
        </div>
        <div class="dock-item" onclick="App.openSettings()">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 2.924 0 1.414 0 0 2.573 1.066c1.543-.94 3.31-2.573 1.066c1.543.94 3.31-2.573.94-3.31.826-2.37a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
            <span>Config</span>
        </div>
    </div>

<script>
/* --- CONSTANTS --- */
const Config = {
    broker: "broker.emqx.io", port: 8084, topic: "termos/light/v1",
    providers: {
        groq: { url: "https://api.groq.com/openai/v1/chat/completions", model: "llama-3.3-70b-versatile" },
        zhipu: { url: "https://open.bigmodel.cn/api/paas/v4/chat/completions", model: "glm-4" }
    }
};

const State = {
    user: "User_" + Math.floor(Math.random() * 10000),
    keys: { groq: localStorage.getItem('light_groq') || "", zhipu: localStorage.getItem('light_zhipu') || "" },
    provider: "local", // Default to Local
    isLocal: true
};

/* --- APP LOGIC --- */
const App = {
    init() {
        this.drawGrid();
        window.addEventListener('resize', () => this.drawGrid());
        
        // Input Listeners
        const input = document.getElementById('main-input');
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') this.submit();
        });
        input.addEventListener('input', () => {
            // Scroll to bottom if user is typing
            const area = document.getElementById('content-area');
            if(area.scrollHeight - area.scrollTop - area.clientHeight < 50) {
                area.scrollTop = area.scrollHeight;
            }
        });

        this.initNetwork();
    },

    // VISUALS: Draw static grid
    drawGrid() {
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        const resize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', resize);
        resize();

        const draw = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#e5e7eb'; // Light gray lines
            ctx.lineWidth = 1;
            const step = 40;

            // Vertical lines
            for (let x = 0; x <= canvas.width; x += step) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            // Horizontal lines
            for (let y = 0; y <= canvas.height; y += step) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        };
        draw();
    },

    // NETWORK: MQTT (Preserved)
    initNetwork() {
        if (typeof Paho === 'undefined') return;
        
        const clientId = "TermOS_Light_" + State.user;
        const client = new Paho.Client(Config.broker, Config.port, clientId);

        client.onConnectionLost = () => this.updateStatus('offline');
        client.onMessageArrived = (message) => {
            try {
                const data = JSON.parse(message.payloadString);
                if (data.sender !== State.user && data.type === 'chat') {
                    this.addLog(data.text, 'other', data.sender);
                }
            } catch(e) { console.error(e); }
        };

        client.connect({
            useSSL: true, timeout: 10,
            onSuccess: () => {
                client.subscribe(Config.topic);
                this.updateStatus('online');
            },
            onFailure: () => {
                this.updateStatus('offline');
            }
        });

        window.mqttClient = client;
    },

    updateStatus(state) {
        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        
        dot.className = 'status-dot';
        text.innerText = 'SYSTEM IDLE';

        if (state === 'online') {
            dot.classList.add('online');
            text.innerText = 'SYSTEM ONLINE';
        } else if (state === 'processing') {
            dot.classList.add('processing');
            text.innerText = 'BUSY';
        } else if (state === 'offline') {
            dot.className.remove('online');
            dot.classList.remove('processing');
            text.innerText = 'OFFLINE';
        }
    },

    // CHAT LOGIC
    addLog(msg, type = 'user', senderName = 'Me') {
        const container = document.getElementById('content-area');
        
        // Filter for system vs chat
        if (type === 'system') {
            const div = document.createElement('div');
            div.className = 'system-msg';
            div.innerText = msg;
            container.appendChild(div);
        } else {
            const row = document.createElement('div');
            row.className = `msg-row ${type}`;
            
            // Avatar (Circle with initial)
            const avatarHtml = `<div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold border border-blue-200" style="background:white;">${senderName[0]}</div>`;
            
            const bubble = document.createElement('div');
            bubble.className = `msg-bubble ${type}`;
            bubble.innerText = msg;
            
            row.innerHTML = `${avatarHtml}<div class="bubble">${msg}</div>`;
            container.appendChild(row);
        }

        container.scrollTop = container.scrollHeight;
    },

    // SUBMIT
    submit() {
        const input = document.getElementById('main-input');
        const txt = input.value.trim();
        if (!txt) return;

        // Basic command check
        if (txt.startsWith('/ai ')) {
            Brain.query(txt.substring(4));
        } else {
            this.addLog(txt, 'user');
            // Broadcast to MQTT if available
            if (window.mqttClient && window.mqttClient.isConnected()) {
                const msg = new Paho.Message(JSON.stringify({
                    sender: State.user,
                    text: txt,
                    type: 'chat'
                }));
                msg.destinationName = Config.topic;
                window.mqttClient.send(msg);
            }
        }
        input.value = '';
    },

    // SETTINGS
    openSettings() {
        document.getElementById('settings-overlay').classList.add('active');
        document.getElementById('key-groq').value = State.keys.groq;
        document.getElementById('key-zhipu').value = State.keys.zhipu;
    },
    closeSettings() {
        document.getElementById('settings-overlay').classList.remove('active');
    },
    saveSettings() {
        State.keys.groq = document.getElementById('key-groq').value;
        State.keys.zhipu = document.getElementById('key-zhipu').value;
        localStorage.setItem('light_groq', State.keys.groq);
        localStorage.setItem('light_zhipu', State.keys.zhipu);
        
        this.closeSettings();
        this.updateStatus('online'); // Reset status
    },

    // YOUTUBE APP (Simple Embed Placeholder)
    openYouTube() {
        alert("Video App: In this Light Edition, please use the link from the chat or paste it into the input. \n\n(Note: Full video features require a darker theme due to visibility.)");
    },

    // MODE SWITCH
    setMode(mode) {
        // In this clean version, switching modes isn't strictly necessary as layout is static, but function exists for extensibility
        document.querySelectorAll('.menu-item, .dock-item').forEach(el => el.classList.remove('active'));
        
        if(mode === 'chat') {
            document.querySelector('.sidebar .menu-item').classList.add('active');
            document.querySelector('.mobile-dock .dock-item').classList.add('active');
        }
    }
};

/* --- BRAIN (Unified) --- */
const Brain = {
    async query(prompt) {
        App.updateStatus('processing');
        
        // Simulate AI Response (if no key or Local)
        const delay = 800 + Math.random() * 1000;

        setTimeout(() => {
            App.updateStatus('online');
            
            let response = "I am ready to help.";
            if (prompt.toLowerCase().includes('hello')) response = "System Online. TermOS Light Edition running.";
            else if (prompt.toLowerCase().includes('help')) response = "Commands: /ai [prompt], Settings (Top Right).";
            else response = "I processed your request in the Light Core.";

            App.addLog(response, 'other', 'System');
        }, delay);
    }
};

window.onload = App.init;
</script>
</body>
</html>
