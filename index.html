<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TermOS: Final Integrated Edition</title>
    <meta name="theme-color" content="#000000"> <!-- White/Daumantas Theme Color -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root { 
            /* White/Daumantas Palette */
            --term-bg: #000000; 
            --term-green: #00ff00; /* Bright green for terminals */
            --term-blue: #00aaff; /* Bright blue */
            --term-text: #e5e5e5; /* Readable gray */
            --accent-primary: #a855f7;
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        body { 
            background: var(--term-bg);
            color: var(--term-text);
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            height: 100vh;
        }

        /* MATRIX CANVAS */
        #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        
        /* BUILD SCANNER HUD */
        .scanner-hud {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 280px;
            background: rgba(20, 20, 30, 0.8);
            border: 2px solid var(--term-green);
            padding: 12px;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0); 
            z-index:  50;
        }

        /* EDITOR */
        .copilot-editor {
            background: #0a0a0a;
            border: 1px solid #333;
            color: #00ff00;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            width: 100%;
            height: 100%;
            padding: 15px;
            white-space: pre-wrap;
            tab-size: 4;
        }

        /* MODALS */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        
        .modal-content {
            background: #111;
            border: 1px solid #444;
            padding: 2rem;
            max-width: 90%;
            box-shadow: 0 0 50px rgba(0,0,0, 0.8);
        }

        /* UTILITIES */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: #000; }

        @keyframes flashInput { 0% { box-shadow: inset 0 0 0 rgba(0, 255, 0); } 
        @keyframes scannerBar { 0% { width: 0%; } 100% { width: 100%; } }
        
        .animate-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }

        /* SNIPPETS */
        .snippet-item {
            cursor: pointer;
            transition: background 0.15s;
        }
        .snippet-item:hover { background: #1a1a1a1; }

    </style>
</head>
<body class="h-screen w-screen flex flex-col relative text-sm">

    <!-- MATRIX VISUALS -->
    <canvas id="matrix-canvas"></canvas>

    <!-- HUD / SCANNER -->
    <div id="scanner-hud" class="scanner-hud">
        <div class="flex justify-between items-center mb-2">
            <span class="text-[10px] font-bold text-green-400 font-mono tracking-wider">BUILD SCANNER</span>
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
        </div>
        <div id="scan-bar" class="scanner-bar"></div>
    </div>

    <!-- HEADER -->
    <header class="glass-panel border-b border-white/10 h-14 flex items-center justify-between px-4 lg:px-8 mx-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded bg-gray-800 flex items-center justify-center border border border-gray-600">
                <span class="font-bold font-mono text-green-400">></span>
            </div>
            <div>
                <h1 class="font-mono text-xl font-bold tracking-wider text-white">TERMOS <span class="text-green-400">WHITE DAUMANTAS</span></h1>
                <div class="flex flex items-center gap-2 text-xs text-gray-400 font-mono">
                    <div id="connection-status" class="w-2 h-2 rounded-full bg-red-500"></div>
                    <span id="room-display">OFFLINE</span>
                </div>
            </div>
        </div>

        <!-- MAIN CHAT -->
    <main id="chat-container" class="flex-1 overflow-y-auto pt-20 pb-40 px-4 max-w-5xl mx-auto w-full"></main>

    <!-- INPUT AREA -->
    <div class="fixed bottom-0 left-0 w-full z-30 flex justify-center pb-8 pt-4 px-4">
        <div class="w-full max-w-4xl relative">
            <div class="flex gap-2 bg-black/40 border border border-gray-600 rounded-lg p-1 flex items-center">
                <button onclick="Commands.handle('/ai ')" class="bg-gray-800 hover:bg-gray-700 border border-gray-600 text-white px-4 py-2 rounded font-mono text-xs font-bold transition-colors">AI</button>
                <button onclick="UI.toggleCopilot()" class="bg-blue-900 hover:bg-blue-700 text-white px-3 py-2 rounded font-mono font-bold transition-colors border border border-blue-500">COPILOT</button>
                <input type="text" id="msg-input" autocomplete="off" placeholder="Command: /ai, /copilot..." class="flex-1 bg-transparent border-none outline-none text-white text-sm p-2 font-mono placeholder-gray-500">
                <button onclick="Commands.handle()" class="bg-green-600 hover:bg-green-500 text-white px-6 rounded font-bold transition-colors">SEND</button>
            </div>
        </div>
    </div>

    <!-- COPILOT MODAL -->
    <div id="copilot-modal" class="modal-overlay hidden flex items-center justify-center">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-mono text-xl font-bold text-green-400">CODE TERMINAL</h2>
                <button onclick="UI.toggleCopilot()" class="text-gray-400 hover:text-white">✖ CLOSE</button>
            </div>
            
            <textarea id="copilot-editor" class="copilot-editor" spellcheck="false" placeholder="// Write HTML/CSS here..."></textarea>

            <!-- Tools -->
            <div class="flex gap-2 mt-4">
                <button onclick="Rebuilder.scanAndInject()" class="bg-green-600 hover:bg-green-500 text-white px-3 py-2 rounded font-mono text-xs font-bold flex-1 border border-green-500/50 transition-colors">⚡ BUILD</button>
                <button onclick="Rebuilder.formatCode()" class="bg-gray-800 hover:bg-gray-700 text-white px-3 py-2 rounded font-mono text-xs font-bold border border-gray-600 flex-1">✨ FORMAT</button>
                <button onclick="Rebuilder.download()" class="bg-gray-800 hover:bg-gray-700 text-white px-3 py-2 rounded font-mono text-xs font-bold border-gray-600 flex-1">💾 SAVE</button>
            </div>

            <!-- Scanner Status -->
            <div class="flex items-center gap-2 mt-4">
                <span class="text-green-400 font-mono text-xs" id="scan-status">IDLE</span>
                <button onclick="Rebuilder.toggleScanner()" class="text-gray-400 hover:text-white font-mono text-xs border border border-gray-600 px-2 rounded">TOGGLE SCANNER</button>
            </div>
        </div>
    </div>

    <!-- ADMIN SETTINGS -->
    <div id="admin-modal" class="modal-overlay hidden flex items-center justify-center">
        <div class="modal-content">
            <h2 class="font-mono text-xl font-bold text-green-400">SYSTEM CONFIG</h2>
            <div class="grid grid-cols-1 gap-4 mb-4">
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-mono text-gray-400 font-bold">AI PROVIDER</label>
                    <select id="ai-provider" class="bg-black/40 border border-gray-600 text-white px-3 py-2 rounded font-mono text-xs">
                        <option value="groq">Groq (Fast)</option>
                        <option value="zhipu">Zhipu (Smart)</option>
                    </select>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-mono text-gray-400 font-bold">API KEY</label>
                    <input type="password" id="api-key" placeholder="Paste API Key here..." class="bg-black/40 border border-gray-600 text-white px-3 py-2 rounded font-mono text-xs outline-none focus:ring-1 focus:ring-green-500 transition-all">
                </div>
                <button onclick="UI.saveSettings()" class="bg-green-600 hover:bg-green-500 text-white font-mono text-xs font-bold px-4 py-2 rounded">SAVE</button>
                <button onclick="UI.toggleAdmin()" class="text-gray-400 hover:text-white font-mono text-xs font-bold border border border-gray-600 px-3 py-2 rounded">EXIT</button>
            </div>
        </div>
    </div>

<script>
    /** 
     * TERMOS: FINAL INTEGRATED
     * Theme: White/Daumantas (White bg, green text, mono fonts)
     * Feature: Copilot with Scanner & Live Preview
     * Features: Dual AI (Groq/Zhipu), MQTT Chat
     */

    // --- CONFIG & STATE ---
    const Config = {
        broker: "broker.emqx.io",
        port: 8084,
        user: `User_${Math.floor(Math.random() * 9000) + 1000}`,
        providers: {
            groq: {
                model: "llama-3.3-70b-versatile",
                url: "https://api.groq.com/openai/v1/chat/completions",
                key: ""
            },
            zhipu: {
                model: "glm-4-flash",
                url: "https://open.bigmodel.cn/api/paas/v4/chat/completions",
                key: ""
            }
        },
        activeProvider: "groq",
        currentRoom: null,
        stats = { level: 1, xp: 0 },
        scanner: {
            isActive: false,
            interval: null,
            bar: document.getElementById('scan-bar'),
            text: document.getElementById('scan-status'),
            text2: document.getElementById('scan-status')
        }
    };

    // --- UTILS ---
    const Utils = {
        escapeHTML: (str) => {
            if(!str) return "";
            return str.replace(/[&<>'"]/g, 
                tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&#quot;'}[tag]));
        },
        uuid: () => 'msg_' + Math.random().toString(36).substr(2, 9)
    };

    // --- UI CONTROLLER ---
    const UI = {
        container: document.getElementById('chat-container'),
        input: document.getElementById('msg-input'),
        copilotModal: document.getElementById('copilot-modal'),
        copilotEditor: document.getElementById('copilot-editor'),
        
        init: () => {
            UI.updateStatus(false);
            UI.loadSettings();
            
            setTimeout(() => {
                document.getElementById('boot-screen').remove(); // No long boot screen, simple app start
                Cosmos.start();
                Net.connect();
            }, 1500);

            // Listeners
            input.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') Commands.handle();
                if (e.ctrlKey && e.key === 'Enter') Rebuilder.scanAndInject();
            });
            
            // Copilot Listeners (Fixed focus logic)
            UI.copilotEditor.addEventListener('keydown', (e) => {
                if (e.key === 'Tab' && State.scanner.suggestion) {
                    e.preventDefault();
                    Copilot.acceptSuggestion();
                } else if (e.key !== 'Tab') {
                    document.getElementById('scan-status').textContent = "IDLE";
                    document.getElementById('scan-bar').classList.remove('scanner-active');
                    State.scanner.suggestion = null;
                }
            });
            
            // Auto-scan if scanner active
            UI.copilotEditor.addEventListener('input', () => {
                if(State.scanner.isActive) {
                    if (State.scanner.timer) clearTimeout(State.scanner.timer);
                    State.scanner.timer = setTimeout(Rebuilder.scanAndInject, 600);
                }
            });

            // Chat Listeners (MQTT)
            Net.onMessage = (data) => {
                if (data.type === 'video') {
                    Rebuilder.injectHTML(data.html);
                    UI.log("📺 Signal Received from " + data.name, "system");
                } else if (data.type === 'code') {
                    // Render code block
                    const codeHTML = `<div class="p-4 bg-black/80 border-l-4 border-green-500 font-mono text-sm rounded-xl overflow-x-auto"><pre class="text-green-400">${Utils.escapeHTML(data.code)}</pre></div>`;
                    UI.renderMessage(data.code, data.name, true);
                } else if (data.type === 'chat') {
                    UI.renderMessage(data.text, data.name, false);
                }
            };
        };
    
    // --- REBUILDER ENGINE ---
    const Rebuilder = {
        iframe: document.createElement('iframe'),
        
        toggleScanner: () => {
            State.scanner.isActive = !State.scanner.isActive;
            const hud = document.getElementById('scanner-hud');
            
            if(State.scanner.isActive) {
                hud.style.display = 'block';
                State.scanner.interval = setInterval(() => {
                    Rebuilder.scanAndInject(); // Real-time scanning
                }, 500);
            } else {
                if (State.scanner.interval) {
                    clearInterval(State.scanner.interval);
                State.scanner.interval = null;
                hud.style.display = 'none';
                document.getElementById('scan-bar').classList.remove('scanner-active');
            }
        },

        scanAndInject: async () => {
            const code = UI.copilotEditor.value;
            if(!code) return;

            // Visuals
            if(Rebuilder.iframe && !State.scanner.suggestion) {
                Rebuilder.iframe.contentWindow.location.reload(); // Soft reload if code hasn't changed
            }

            // Update HUD
            Rebuilder.updateScannerUI("SCANNING SYNTAX...", true);

            // Build HTML
            setTimeout(() => {
                const fullDoc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{background:#fff;margin:0;padding:20px;font-family:'Fira Code', monospace;}</style></head><body>${code}</body></html>`;
                
                // Inject
                const doc = Rebuilder.iframe.contentDocument || Rebuilder.iframe.contentWindow.document;
                doc.open();
                doc.write(fullDoc);
                doc.close();
                
                // Done
                Rebuilder.updateScannerUI("BUILD COMPLETE", true);
            UI.log("✅ Build finished.", "system");
            }, 300);
        },

        updateScannerUI: (status, success) => {
            if(!Rebuilder.text) return;
            Rebuilder.text = status;
            document.getElementById('scan-status').textContent = status;
            document.getElementById('scan-bar').classList.remove('scanner-active');
            
            if(success) {
                Rebuilder.text.style.color = '#00ff00';
                document.getElementById('scan-status').style.color = '#00ff00';
            } else {
                Rebuilder.text.style.color = '#ffffff'; // White text for "IDLE"
                document.getElementById('scan-status').style.color = '#e5e5e5';
            }
        },

        toggleLivePreview: () => {
            // Simplified for this file (no complex iframe)
            const screen = document.getElementById('chat-container');
            if(screen.contains('previewing')) {
                screen.classList.remove('previewing');
                // Remove overlay
            } else {
                screen.classList.add('previewing');
                // Just log for now
                UI.log("✨ LIVE PREVIEW ACTIVATED", "system");
            }
        },

        formatCode: () => {
            const editor = UI.copilot.editor;
            let code = editor.value;
            
            // Simple JS Formatter
            code = code.replace(/\s*([{}\[\]:,])\s*/g, ' $1');
            code = code.replace(/;\s*(?!;)/g, ';\n');
            code = code.replace(/\{(?=[^$])/g, ' {\n    ');
            const keywords = ['function', 'const', 'let', 'var', 'if', 'else', 'return', 'class'];
            keywords.forEach(kw => {
                const regex = new RegExp(`\\b${kw}\\b`, 'gi');
                code = code.replace(regex, kw);
            });
            editor.value = code;
        },

        runCode: () => {
            const code = UI.copilot.editor.value;
            if(!code) return;

            UI.log("⚡ Running Build...", "system");
            
            // Capture Console (Simplified)
            const originalLog = console.log;
            console.log = (...args) => {
                UI.log(`[STDOUT] ${args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ')}`, 'system');
                originalLog(...args);
            };
            console.error = (...args) => {
                UI.log(`[ERROR] ${args.join(' ')}`, 'error');
            originalLog(...args);
            };

            try {
                // Safe execution
                const safeCode = code.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                const fn = new Function(safeCode);
                fn();
                
                UI.log("✅ Build Completed Successfully.", "system");
            } catch(e) {
                UI.log(`❌ Build Failed: ${e.message}`, "error");
            } finally {
                console.log = originalLog;
                console.error = originalError;
            }
        },

        download: () => {
            const code = UI.copilot.editor.value;
            const blob = new Blob([code], {type: "text/html"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "termos_project.html";
            a.click();
        }
    };

    // --- COMMANDS ---
    const Commands = {
        handle: (manualCmd = null) => {
            const txt = manualCmd || UI.input.value.trim();
            if(!txt) return;

            if(!txt.startsWith('/')) {
                UI.renderMessage(txt, "Me", true);
                const topic = currentRoom ? `termos/rooms/${currentRoom}` : "termos/chat";
                Net.send(topic, { user: username, text: txt, type: 'chat' });
                UI.input.value = '';
                return;
            }

            const [cmd, ...args] = txt.split(' ');
            const fullArgs = args.join(' ');

            switch(cmd.toLowerCase()) {
                case '/ai': AI.chat(fullArgs); break;
                case '/code': AI.code(fullArgs); break;
                case '/kernel': AI.think(); break;
                case '/join': 
                    const roomName = fullArgs; 
                    UI.log(`Joining ${roomName}...`, 'system');
                    if (Net.joinRoom(roomName)) { /* Net.joinRoom handles logs */
                    } else {
                        UI.log(`Failed to join ${roomName}`, 'error');
                    }
                    break;
                case '/leave': 
                    UI.log("Leaving...", "system");
                    Net.leaveRoom();
                    break;
                default: UI.log(`Unknown: ${cmd}`, "error");
            }
            UI.input.value = '';
        }
    };

    // --- AI LOGIC ---
    const AI = {
        query: async (systemPrompt, userPrompt) => {
            const provider = activeProvider;
            const config = Config.providers[provider];
            
            if(!config.key) {
                UI.log(`⚠️ ${provider.toUpperCase()} Key Required.`, 'error');
                UI.toggleAdmin();
                return;
            }

            const id = Utils.uuid();
            const loadingTxt = "Synthesizing...";
            UI.log(`<span id="${id}" class="animate-pulse italic">Thinking...</span>`, "system");

            try {
                const res = await fetch(config.url, {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${config.key}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: config.model,
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userPrompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });
                
                const data = await res.json();
                
                if(data.error) throw new Error(data.error.message);
                
                const reply = data.choices[0].message.content;
                document.getElementById(id).remove(); 
                UI.log(reply, 'ai');
            } catch(e) {
                const loader = document.getElementById(id);
                if(loader) loader.remove();
                UI.log(`❌ Error: ${e.message}`, 'error');
            }
        },

        chat: (prompt) => {
            if(!prompt) return UI.input.placeholder = "Type: /ai [question]";
            AI.query("You are TermOS AI (White Edition). Be helpful and creative.", prompt);
        },

        code: (prompt) => {
            if(!prompt) return UI.input.placeholder = "Type: /code [task]";
            AI.query("You are a Frontend Architect (White Edition). Provide clean code.", prompt);
        },

        think: async () => {
            AI.query("You are TermOS Kernel. Suggest 1 creative idea.");
        }
    };

    // --- NETWORKING (MQTT) ---
    let currentRoom = null; // Global state variable for room

    const Net = {
        connect: () => {
            if (typeof Paho === 'undefined') return;
            try {
                const client = new Paho.MQTT.Client(Config.broker, Config.port, "web_" + username);
                client.onConnectionLost = (responseObject) => {
                    document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-red-500";
                    document.getElementById('room-display').innerText = "OFFLINE";
                };
                client.onMessageArrived = (message) => {
                    const data = JSON.parse(message.payloadString);
                    if (data.type === 'join') {
                        currentRoom = data.id;
                        document.getElementById('room-display').innerText = data.id.toUpperCase();
                        document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-green-500";
                        document.getElementById('room-display').innerText = `ROOM: ${data.id.toUpperCase()}`;
                    } else if (data.type === 'video') {
                        Rebuilder.injectHTML(data.html);
                        UI.log(`📺 Transmission from ${data.name}`, "system");
                    } else {
                        UI.renderMessage(data.text, data.name, false);
                    }
                }
            };
            
            client.connect({
                onSuccess: () => {
                    document.getElementById('boot-screen').style.opacity = '0';
                    setTimeout(() => document.getElementById('boot-screen').remove(), 1000);
                    document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-green-500";
                    document.getElementById('room-display').innerText = "ONLINE";
                    
                    // Subscribe to public by default
                    client.subscribe("termos/chat");
                },
                onFailure: () => setTimeout(Net.connect, 3000)
            });
        },

        joinRoom: (roomName) => {
            if(!roomName) return;
            if (currentRoom) client.unsubscribe(`termos/rooms/${currentRoom}`);
            client.subscribe(`termos/rooms/${roomName}`);
            
            // Announce join
            const msg = new Paho.MQTT.Message(JSON.stringify({ type: 'join', id: roomName }));
            client.send(msg);
            
            // Update UI
            document.getElementById('room-display').innerText = roomName.toUpperCase();
        },

        leaveRoom: () => {
            if(!currentRoom) return;
            client.unsubscribe(`termos/rooms/${currentRoom}`);
            
            // Announce leave
            const msg = new Paho.MQTT.Message(JSON.stringify({ type: 'leave', id: currentRoom }));
            client.send(msg);

            // Reset UI
            currentRoom = null;
            document.getElementById('room-display').innerText = "ONLINE";
        },

        send: (topic, payload) => {
            if(client && client.isConnected()) {
                const msg = new Paho.MQTT.Message(JSON.stringify(payload));
                msg.destinationName = topic;
                client.send(msg);
            }
        }
    };

    // --- VISUALS ---
    const Cosmos = {
        start: () => {
            const canvas = document.getElementById('matrix-canvas');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;
            const fontSize = 14;
            const columns = Math.floor(width / fontSize);
            const drops = Array(50).fill().map(() => ({
                x: Math.random() * width,
                y: Math.random() * height,
                v: (Math.random() - 0.5) * 2,
                char: String.fromCharCode(0x30A0 + (Math.random() * 60)),
                color: '#00ff00',
                value: Math.random()
            }));

            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0)'; 
                ctx.fillRect(0, 0, width, height);
                
                drops.forEach(drop => {
                    drop.y += drop.v;
                    if(drop.y > height) {
                        drop.y = -height;
                        drop.x = Math.random() * width;
                    }
                    
                    // Draw character
                    ctx.fillStyle = drop.color;
                    ctx.font = `${fontSize}px monospace`;
                    ctx.fillText(drop.char, drop.x, drop.y);
                    
                    // Fade tail
                    ctx.fillStyle = drop.value;
                    ctx.globalAlpha = 0.3;
                    ctx.fillRect(drop.x, drop.y, width, 2); 
                });
                requestAnimationFrame(draw);
            }
            draw();
            window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });
        }
    };

    // --- MAIN ENTRY ---
    window.onload = () => {
        // Hide boot screen (simple logic)
        const boot = document.getElementById('boot-screen');
        if(boot) boot.remove();

        // Start systems
        UI.init();
        Cosmos.start();
        Net.connect();
    };

</script>
