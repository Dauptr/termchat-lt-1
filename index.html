<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TermOS: Light Chat</title>
    <meta name="theme-color" content="#f3f4f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- LIBRARIES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <!-- FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --text-main: #1f2937;
            --text-secondary: #64748b;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --safe-top: env(safe-area-inset-top, 20px);
        }

        body {
            background: linear-gradient(135deg, #fdfbf7 0%, #eff6ff 100%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- BACKGROUND --- */
        #bg-canvas {
            position: fixed; inset: 0; z-index: 1;
            opacity: 0.4;
            pointer-events: none;
        }

        /* --- UI LAYOUT --- */
        .app-shell {
            position: relative; z-index: 10;
            display: grid;
            grid-template-columns: 1fr;
            height: 100%;
        }
        @media (min-width: 768px) {
            .app-shell { grid-template-columns: 260px 1fr; }
        }

        /* --- SIDEBAR --- */
        .sidebar {
            background: rgba(255,255,255,0.9);
            border-right: 1px solid var(--border-color);
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 12px;
            box-shadow: 4px 0 10px rgba(0,0,0,0.05);
        }
        @media (min-width: 768px) { .sidebar { display: flex; } }

        .menu-item {
            display: flex; align-items: center; gap: 12px;
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-weight: 500;
            outline: none;
        }
        .menu-item:hover, .menu-item.active {
            background: var(--accent-blue);
            color: white;
            transform: translateX(4px);
        }

        /* --- MAIN VIEW --- */
        .main-view {
            display: flex; flex-direction: column;
            position: relative;
            height: 100%;
            overflow: hidden;
        }

        /* --- HEADER --- */
        .header {
            height: 60px;
            padding-top: var(--safe-top);
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px;
        }
        .brand {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.025em;
            color: var(--text-main);
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            box-shadow: var(--shadow-sm);
            display: flex; align-items: center; gap: 8px;
        }

        /* --- CONTENT AREA (Chat) --- */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 140px; /* Space for input + mobile nav */
            background: transparent;
            display: flex; flex-direction: column;
            gap: 10px;
        }

        /* --- MESSAGES --- */
        .msg-row {
            display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-end;
            animation: slideIn 0.3s ease-out;
        }
        .msg-row.user { flex-direction: row-reverse; }
        
        .msg-bubble {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 12px 16px;
            max-width: 80%;
            position: relative;
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
            box-shadow: var(--shadow-lg);
            word-wrap: break-word;
        }
        .msg-bubble.user {
            background: var(--accent-blue);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg-bubble.other {
            background: var(--bg-secondary);
            border-bottom-left-radius: 4px;
        }
        .msg-bubble.system {
            background: transparent;
            border: none;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin: 10px auto;
            box-shadow: none;
        }
        
        .sender-name {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
            display: block;
            font-family: 'JetBrains Mono', monospace;
        }
        .msg-row.user .sender-name {
            text-align: right;
            color: rgba(255,255,255,0.8);
        }

        /* --- INPUT DOCK --- */
        .input-dock {
            position: absolute; bottom: 0; width: 100%;
            padding: 20px;
            padding-bottom: calc(20px + var(--safe-bottom));
            background: linear-gradient(to top, #ffffff 50%, rgba(255,255,255,0.9));
            border-top: 1px solid var(--border-color);
            display: flex; justify-content: center; gap: 12px; z-index: 20;
        }
        @media (min-width: 768px) { .input-dock { background: #fff; } }

        .game-input {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 20px;
            font-size: 1rem;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
            font-family: 'JetBrains Mono', monospace;
        }
        .game-input:focus {
            border-color: var(--accent-blue);
            background: #fff;
            box-shadow: inset 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        /* --- VIDEO OVERLAY --- */
        #video-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s;
        }
        #video-overlay.active { display: flex; }
        .video-container {
            width: 90%; max-width: 800px;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        .video-frame {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background: #000;
        }
        .video-frame iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }
        .video-controls {
            padding: 15px;
            display: flex; gap: 10px;
            background: #f8fafc;
        }
        .close-video {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255,255,255,0.2);
            color: white; border: none;
            width: 40px; height: 40px; border-radius: 50%;
            font-size: 24px; cursor: pointer; z-index: 1001;
        }
        .close-video:hover { background: rgba(255,255,255,0.4); }

        /* --- MOBILE NAV --- */
        .mobile-dock {
            display: none;
            position: fixed; bottom: 0; left: 0; width: 100%;
            height: calc(70px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: #fff;
            border-top: 1px solid var(--border-color);
            z-index: 30;
        }
        @media (max-width: 768px) { .mobile-dock { display: flex; } }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-secondary);
            padding: 8px;
        }
        .nav-item.active { color: var(--accent-blue); }
        .nav-icon { font-size: 1.5rem; }

        /* Animations */
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- BACKGROUND GRID -->
    <div id="bg-canvas"></div>

    <!-- VIDEO OVERLAY -->
    <div id="video-overlay">
        <button class="close-video" onclick="App.closeVideo()">✕</button>
        <div class="video-container">
            <div class="video-frame">
                <iframe id="yt-player" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="video-controls">
                <input type="text" id="video-input" class="game-input" placeholder="Paste YouTube Link or ID...">
                <button onclick="App.loadVideo()" style="padding: 0 20px; background:var(--accent-blue); color:white; border:none; border-radius:12px; font-weight:600; cursor:pointer;">LOAD</button>
            </div>
        </div>
    </div>

    <div class="app-shell">
        <!-- SIDEBAR -->
        <nav class="sidebar">
            <div class="menu-item active" onclick="App.setMode('chat')">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                <span>Chat</span>
            </div>
            <div class="menu-item" onclick="App.openVideoModal()">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Video</span>
            </div>
        </nav>

        <main class="main-view">
            <!-- Header -->
            <header class="header">
                <div class="brand">TermOS <span>Light</span></div>
                <div class="status-badge">
                    <span style="width:8px; height:8px; background:var(--accent-blue); border-radius:50%;"></span>
                    <span>ONLINE</span>
                </div>
            </header>

            <!-- Chat Area -->
            <div class="content-area" id="content-area" aria-live="polite">
                <div class="msg-row">
                    <div class="msg-bubble system">
                        System Initialized. <br>
                        Try: <br>
                        - <b>/ai hello</b><br>
                        - <b>/video dQw4w9WgXcQ</b><br>
                        - <b>/clear</b>
                    </div>
                </div>
            </div>

            <!-- Input Dock -->
            <div class="input-dock">
                <input type="text" id="main-input" class="game-input" placeholder="Type a message..." autocomplete="off">
                <button onclick="App.submit()" style="background:var(--accent-blue); color:white; padding:0 24px; border:none; border-radius:12px; font-weight:600; cursor:pointer;">
                    SEND
                </button>
            </div>
        </main>
    </div>

    <!-- MOBILE NAV -->
    <div class="mobile-dock">
        <div class="nav-item active" onclick="App.setMode('chat')">
            <div class="nav-icon">💬</div>
            <span>Chat</span>
        </div>
        <div class="nav-item" onclick="App.openVideoModal()">
            <div class="nav-icon">▶️</div>
            <span>Video</span>
        </div>
    </div>

<script>
/* --- CONSTANTS --- */
const Config = {
    broker: "broker.emqx.io", port: 8084, topic: "termos/light/v1"
};

/* --- STATE --- */
const State = {
    user: "User_" + Math.floor(Math.random() * 10000),
    mqttClient: null
};

/* --- APP LOGIC --- */
const App = {
    init() {
        this.drawGrid();
        window.addEventListener('resize', () => this.drawGrid());
        
        // Input Listeners
        const input = document.getElementById('main-input');
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') this.submit();
        });

        this.initNetwork();
    },

    drawGrid() {
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        const resize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            draw();
        };
        window.addEventListener('resize', resize);
        resize();

        const draw = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#e5e7eb';
            ctx.lineWidth = 1;
            const step = 40;

            for (let x = 0; x <= canvas.width; x += step) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += step) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        };
        draw();
    },

    // --- NETWORK / MQTT ---
    initNetwork() {
        if (typeof Paho === 'undefined') return;
        
        const clientId = "TermOS_Light_" + State.user;
        const client = new Paho.Client(Config.broker, Config.port, clientId);

        client.onConnectionLost = () => { console.log("MQTT Lost"); };
        client.onMessageArrived = (message) => {
            try {
                const data = JSON.parse(message.payloadString);
                // Don't echo my own messages
                if (data.sender !== State.user && data.type === 'chat') {
                    this.addLog(data.text, 'other', data.sender);
                }
            } catch(e) { console.error(e); }
        };

        client.connect({
            useSSL: true, timeout: 10, keepAliveInterval: 30,
            onSuccess: () => {
                console.log("MQTT Connected");
                client.subscribe(Config.topic);
            },
            onFailure: () => { console.log("MQTT Failed"); }
        });

        State.mqttClient = client;
    },

    // --- CHAT LOGIC ---
    addLog(msg, type = 'user', senderName = 'Me') {
        const container = document.getElementById('content-area');
        
        if (type === 'system') {
            const row = document.createElement('div');
            row.className = 'msg-row';
            const div = document.createElement('div');
            div.className = 'msg-bubble system';
            div.innerHTML = msg; // Allow bold/html for system messages
            row.appendChild(div);
            container.appendChild(row);
        } else {
            const row = document.createElement('div');
            row.className = `msg-row ${type}`;
            
            const initial = senderName === 'Me' ? 'Me' : senderName.substring(0, 2).toUpperCase();
            const avatarColor = type === 'user' ? 'bg-blue-500 text-white' : 'bg-white text-gray-600 border';
            
            const avatarHtml = `<div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold ${avatarColor}" style="flex-shrink:0;">${initial}</div>`;
            const nameHtml = `<span class="sender-name">${senderName}</span>`;
            const bubbleHtml = `<div class="msg-bubble ${type}">${msg}</div>`;
            
            if (type === 'user') {
                row.innerHTML = `${avatarHtml}<div>${nameHtml}${bubbleHtml}</div>`;
            } else {
                row.innerHTML = `${avatarHtml}<div>${nameHtml}${bubbleHtml}</div>`;
            }
            container.appendChild(row);
        }

        // Auto-scroll to bottom
        container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
    },

    submit() {
        const input = document.getElementById('main-input');
        const txt = input.value.trim();
        if (!txt) return;

        // Display User Message
        this.addLog(txt, 'user');
        input.value = '';
        input.focus(); // Keep focus for UX

        // Process Commands
        if (txt.startsWith('/ai ')) {
            Brain.query(txt.substring(4));
        } else if (txt.startsWith('/clear')) {
            this.clearChat();
        } else if (txt.startsWith('/video ')) {
            const parts = txt.split(' ');
            if(parts.length > 1) this.loadVideo(parts[1]);
            else this.openVideoModal();
        } else {
            this.broadcast(txt);
        }
    },

    broadcast(text) {
        if (State.mqttClient && State.mqttClient.isConnected()) {
            const msg = new Paho.Message(JSON.stringify({
                sender: State.user,
                text: text,
                type: 'chat'
            }));
            msg.destinationName = Config.topic;
            State.mqttClient.send(msg);
        } else {
            this.addLog("System Offline: Message not sent", "system");
        }
    },

    clearChat() {
        const container = document.getElementById('content-area');
        container.innerHTML = '';
        this.addLog("History Cleared", "system");
    },

    setMode(mode) {
        document.querySelectorAll('.nav-item, .menu-item').forEach(el => el.classList.remove('active'));
        if(mode === 'chat') {
            document.querySelector('.sidebar .menu-item').classList.add('active');
            document.querySelector('.mobile-dock .nav-item').classList.add('active');
        }
    },

    // --- VIDEO FUNCTIONS ---
    openVideoModal() {
        document.getElementById('video-overlay').classList.add('active');
        document.getElementById('video-input').focus();
    },
    closeVideo() {
        document.getElementById('video-overlay').classList.remove('active');
        const iframe = document.getElementById('yt-player');
        iframe.src = iframe.src; // Stop video playback
    },
    loadVideo(id) {
        const input = document.getElementById('video-input');
        if(!id && input) id = input.value.trim();
        
        if(!id) return;

        // Extract ID if full URL provided
        const ytIdMatch = id.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
        if (ytIdMatch) id = ytIdMatch[1];

        const iframe = document.getElementById('yt-player');
        iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
        
        document.getElementById('video-overlay').classList.add('active');
    }
};

/* --- BRAIN (Simulated AI) --- */
const Brain = {
    query(prompt) {
        App.addLog(`Processing: "${prompt}"...`, "system");
        
        // Simulate Network Delay
        setTimeout(() => {
            let response = "";
            const p = prompt.toLowerCase();

            if (p.includes('hello')) response = "Hello! TermOS Light is ready.";
            else if (p.includes('time')) response = `Current Time: ${new Date().toLocaleTimeString()}`;
            else if (p.includes('status')) response = "System Status: Optimal. Network Connected.";
            else response = `I received your request regarding "${prompt}". I am a simulated core.`;

            App.addLog(response, 'other', 'AI Core');
        }, 1000);
    }
};

window.onload = App.init;
</script>
</body>
</html>
