<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TermOS: Total Build</title>
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com"></script>
    <style>
        :root { 
            --glass-bg: rgba(15, 15, 25, 0.7); 
            --accent: #d8b4fe; 
            --neon: #67e8f9; 
        }
        body { background: #020205; color: #e4e4e7; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        /* WATERCOLOR ENGINE CANVAS */
        #painted-canvas { 
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: linear-gradient(45deg, #0f172a, #1e1b4b);
        }

        .glass-panel { 
            background: var(--glass-bg); 
            backdrop-filter: blur(30px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .font-header { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 2px; }
        
        /* SCANNER ANIMATION */
        @keyframes scanline { 0% { top: -10%; } 100% { top: 110%; } }
        .scanner-bar { 
            position: absolute; width: 100%; height: 2px; 
            background: linear-gradient(90deg, transparent, var(--neon), transparent);
            animation: scanline 4s linear infinite; opacity: 0.3;
        }

        .file-item { border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.3s; }
        .file-item:hover { background: rgba(103, 232, 249, 0.1); padding-left: 12px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col relative text-sm">

    <div id="painted-canvas"></div>
    <div class="scanner-bar"></div>

    <main class="relative z-10 h-full flex flex-col p-6 gap-6">
        
        <!-- SYSTEM HEADER -->
        <header class="flex justify-between items-center">
            <div class="glass-panel px-6 py-3 flex items-center gap-4">
                <div class="w-3 h-3 bg-cyan-400 rounded-full animate-pulse"></div>
                <h1 class="font-header text-lg text-cyan-100">TermOS Core</h1>
            </div>
            <div id="mqtt-status" class="text-[10px] font-mono text-purple-400 opacity-50">MQTT: DISCONNECTED</div>
        </header>

        <div class="flex-1 grid grid-cols-12 gap-6 overflow-hidden">
            
            <!-- LEFT: ROOT FILE EXPLORER (Auto-rebuilds here) -->
            <aside class="col-span-3 glass-panel flex flex-col rounded-3xl overflow-hidden">
                <div class="p-4 bg-white/5 font-header text-[10px] border-b border-white/10">Project_Root</div>
                <div class="flex-1 overflow-y-auto p-2" id="explorer">
                    <!-- REBUILD_START -->
                    <div class="file-item p-3 text-cyan-300">index.html</div>
                    <div class="file-item p-3 opacity-50 text-xs">rebuild.js</div>
                    <!-- REBUILD_END -->
                </div>
            </aside>

            <!-- CENTER: COPILOT CODE ENGINE -->
            <section class="col-span-9 glass-panel rounded-3xl flex flex-col overflow-hidden relative">
                <textarea id="editor" class="flex-1 bg-transparent p-10 outline-none text-purple-100 font-mono text-base leading-relaxed resize-none" 
                          placeholder="Initialize Copilot scripting..."></textarea>
                
                <div class="p-4 bg-black/20 border-t border-white/5 flex justify-between items-center">
                    <div class="flex gap-4">
                        <span class="text-[10px] text-cyan-500">LN 1, COL 1</span>
                        <span class="text-[10px] text-purple-400">AUTOBUILD: ON</span>
                    </div>
                    <button onclick="saveCode()" class="text-[10px] font-header bg-cyan-500/20 border border-cyan-500/50 px-4 py-1 rounded hover:bg-cyan-500 hover:text-black transition">Push Build</button>
                </div>
            </section>
        </div>
    </main>

    <script>
        // 1. MQTT Connection Logic
        const client = new Paho.MQTT.Client("broker.hivemq.com", Number(8000), "termos_user_" + Math.random());
        client.onConnectionLost = (res) => { document.getElementById('mqtt-status').innerText = "MQTT: LOST"; };
        client.connect({onSuccess: () => { document.getElementById('mqtt-status').innerText = "MQTT: CONNECTED"; }});

        // 2. Watercolor Visual Engine (Dynamic Canvas)
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        document.getElementById('painted-canvas').appendChild(canvas);
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function paintEffect() {
            ctx.fillStyle = 'rgba(2, 2, 5, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // Add custom watercolor brush logic here
            requestAnimationFrame(paintEffect);
        }
        paintEffect();

        // 3. Copilot Functionality
        function saveCode() {
            const code = document.getElementById('editor').value;
            console.log("Pushing build to root...", code);
            alert("Copilot Push: Rebuild triggered in GitHub Actions.");
        }
    </script>
</body>
</html>
