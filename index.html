<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TermOS: GENESIS</title>
    
    <!-- EXTERNAL LIBS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CORE VISUALS --- */
        :root {
            --neon-color: #00ff41; /* Level 1 Default */
            --glass-bg: rgba(10, 15, 20, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-display: 'Orbitron', sans-serif;
            --font-code: 'Share Tech Mono', monospace;
        }
        
        body { 
            margin: 0; background: #000; overflow: hidden; color: #eee; font-family: var(--font-code);
        }

        /* CRT EFFECT */
        .crt::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        /* LAYERS */
        #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.8; }
        #ui-layer { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; }
        
        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--neon-color); border-radius: 3px; }
        ::-webkit-scrollbar-track { background: #000; }

        /* COMPONENTS */
        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }
        .neon-text { text-shadow: 0 0 5px var(--neon-color), 0 0 10px var(--neon-color); color: var(--neon-color); }
        .neon-border { border-color: var(--neon-color); box-shadow: 0 0 10px var(--neon-color); }

        /* ANIMATIONS */
        @keyframes glitch { 0% { transform: translate(0); } 20% { transform: translate(-2px, 2px); } 40% { transform: translate(-2px, -2px); } 60% { transform: translate(2px, 2px); } 80% { transform: translate(2px, -2px); } 100% { transform: translate(0); } }
        .glitch-hover:hover { animation: glitch 0.2s cubic-bezier(.25, .46, .45, .94) both infinite; }

        /* AVATAR CANVAS */
        .avatar-canvas { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--neon-color); background: #000; }

        /* MODALS */
        .modal { transition: all 0.3s ease; pointer-events: none; opacity: 0; transform: scale(0.95); }
        .modal.active { pointer-events: auto; opacity: 1; transform: scale(1); }

        /* TOAST NOTIFICATION */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: rgba(0,0,0,0.9); border-left: 4px solid var(--neon-color); padding: 10px 20px; color: #fff; border-radius: 4px; font-size: 12px; box-shadow: 0 0 15px rgba(0,0,0,0.8); animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body class="crt">

    <!-- VISUAL LAYERS -->
    <canvas id="matrix-canvas"></canvas>
    <div id="toast-container"></div>

    <!-- UI SHELL -->
    <div id="ui-layer">
        
        <!-- HEADER -->
        <header class="glass-panel border-b border-white/10 p-3 flex justify-between items-center z-20">
            <div class="flex items-center gap-3">
                <!-- GENERATIVE AVATAR -->
                <canvas id="my-avatar" class="avatar-canvas shadow-[0_0_15px_var(--neon-color)]"></canvas>
                <div>
                    <h1 class="font-[var(--font-display)] font-bold text-lg tracking-wider text-white">TERM<span class="neon-text">OS</span></h1>
                    <div class="flex items-center gap-2 text-[10px] text-gray-400 uppercase">
                        <span id="status-dot" class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                        <span id="connection-text">OFFLINE</span>
                        <span class="text-[var(--neon-color)]">• LVL <span id="level-display">1</span></span>
                    </div>
                </div>
            </div>
            
            <!-- TOP CONTROLS -->
            <div class="flex items-center gap-2">
                <button onclick="UI.toggleRadio()" class="w-8 h-8 rounded bg-white/5 hover:bg-white/10 text-cyan-400 flex items-center justify-center border border-white/10 transition-colors" title="Radio">
                    <i class="fa-solid fa-radio"></i>
                </button>
                <button onclick="UI.toggleVideo()" class="w-8 h-8 rounded bg-white/5 hover:bg-white/10 text-purple-400 flex items-center justify-center border border-white/10 transition-colors" title="Video Feed">
                    <i class="fa-solid fa-video"></i>
                </button>
                <button onclick="UI.toggleAI()" class="hidden md:flex w-8 h-8 rounded bg-white/5 hover:bg-white/10 text-green-400 items-center justify-center border border-white/10 transition-colors" title="AI Kernel">
                    <i class="fa-solid fa-brain"></i>
                </button>
                <button onclick="UI.toggleSettings()" class="w-8 h-8 rounded bg-white/5 hover:bg-white/10 text-gray-300 flex items-center justify-center border border-white/10 transition-colors" title="Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT GRID -->
        <div class="flex-1 flex overflow-hidden relative">
            
            <!-- CHAT STREAM -->
            <main id="chat-stream" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24 scroll-smooth">
                <div id="welcome-msg" class="text-center opacity-50 mt-10">
                    <h2 class="text-2xl font-[var(--font-display)] mb-2">SYSTEM GENESIS</h2>
                    <p class="text-xs">Connected to the Neural Grid.</p>
                </div>
            </main>

            <!-- AI KERNEL SIDE PANEL (Collapsible on mobile) -->
            <aside id="ai-panel" class="hidden md:flex flex-col w-64 glass-panel border-l border-white/10 m-4 rounded-xl overflow-hidden transition-all duration-300 absolute right-0 bottom-0 top-0 md:static z-30">
                <div class="p-3 bg-black/40 border-b border-white/10 flex justify-between items-center">
                    <h3 class="text-xs font-bold text-[var(--neon-color)] uppercase tracking-widest"><i class="fa-solid fa-microchip mr-2"></i>Kernel Log</h3>
                    <button onclick="UI.toggleAI()" class="text-gray-500 hover:text-white md:hidden"><i class="fa-solid fa-times"></i></button>
                </div>
                <div id="kernel-log" class="flex-1 overflow-y-auto p-3 space-y-2 text-[10px] font-mono text-gray-300">
                    <div class="text-green-500/80">> System Initialized...</div>
                </div>
                <div class="p-3 bg-black/60 text-[10px] text-gray-500 text-center border-t border-white/10">
                    AI MONITORING ACTIVE
                </div>
            </aside>
        </div>

        <!-- INPUT AREA -->
        <footer class="glass-panel border-t border-white/10 p-4 z-30 relative">
            <div class="max-w-4xl mx-auto flex gap-2 items-end">
                <button id="voice-btn" class="p-3 rounded-lg bg-white/5 text-gray-400 hover:text-[var(--neon-color)] transition-colors border border-white/10">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <div class="flex-1 relative">
                    <input type="text" id="cmd-input" 
                        class="w-full bg-black/60 border border-[var(--neon-color)] rounded-lg p-3 text-white outline-none focus:bg-black/80 font-mono text-sm transition-all shadow-[0_0_10px_rgba(0,0,0,0.5)]"
                        placeholder="Enter command or chat..." autocomplete="off">
                    <div class="absolute right-3 top-3 text-[10px] text-gray-500 font-mono pointer-events-none">CMD</div>
                </div>
                <button onclick="Core.handleInput()" class="p-3 rounded-lg bg-[var(--neon-color)] text-black font-bold hover:opacity-90 transition-all shadow-[0_0_15px_var(--neon-color)]">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </footer>
    </div>

    <!-- === OVERLAYS === -->

    <!-- RADIO PLAYER -->
    <div id="radio-overlay" class="modal fixed top-16 right-16 md:right-4 w-72 glass-panel rounded-xl border border-cyan-500/30 z-40 overflow-hidden flex flex-col">
        <div class="p-3 bg-cyan-900/20 flex justify-between items-center border-b border-white/10">
            <h4 class="text-xs font-bold text-cyan-400">WAVE TUNER</h4>
            <button onclick="UI.toggleRadio()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="p-4 space-y-3">
            <button onclick="Radio.play('https://streams.ilovemusic.com/iloveradio17.mp3', 'Cyberwave')" class="w-full text-left p-2 bg-white/5 hover:bg-white/10 rounded border border-white/10 flex justify-between text-xs">
                <span>Cyberwave</span> <i class="fa-solid fa-signal text-green-400"></i>
            </button>
            <button onclick="Radio.play('https://streams.ilovemusic.com/iloveradio1.mp3', 'Lofi')" class="w-full text-left p-2 bg-white/5 hover:bg-white/10 rounded border border-white/10 flex justify-between text-xs">
                <span>Lofi Study</span> <i class="fa-solid fa-headphones text-purple-400"></i>
            </button>
            <button onclick="Radio.stop()" class="w-full text-center p-2 bg-red-900/20 text-red-400 rounded text-xs border border-red-900/30">
                STOP TRANSMISSION
            </button>
        </div>
    </div>

    <!-- VIDEO PLAYER -->
    <div id="video-overlay" class="modal fixed inset-0 md:inset-auto md:top-20 md:left-20 md:right-20 md:bottom-20 glass-panel z-50 flex flex-col">
        <div class="p-3 bg-purple-900/20 flex justify-between items-center border-b border-white/10">
            <h4 class="text-xs font-bold text-purple-400">VIDEO FEED</h4>
            <button onclick="UI.toggleVideo()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-expand"></i></button>
        </div>
        <div class="flex-1 bg-black flex items-center justify-center relative p-4">
            <div id="video-container" class="w-full h-full max-h-full flex flex-col items-center justify-center text-gray-500">
                <i class="fa-solid fa-satellite-dish text-4xl mb-4 animate-pulse"></i>
                <span class="font-mono text-sm">NO SIGNAL INCOMING</span>
                <span class="text-xs text-gray-600 mt-2">Type /video [url] to broadcast</span>
            </div>
        </div>
    </div>

    <!-- SETTINGS / ADMIN -->
    <div id="settings-overlay" class="modal fixed inset-0 bg-black/90 backdrop-blur-md z-60 flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md rounded-2xl border border-white/20 overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-white/10 flex justify-between items-center bg-white/5">
                <h2 class="font-[var(--font-display)] font-bold text-xl">SYSTEM CONFIG</h2>
                <button onclick="UI.toggleSettings()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 space-y-6">
                <!-- API Key -->
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-2">GROQ API KEY (Required for AI)</label>
                    <input type="password" id="api-key-input" class="w-full bg-black/50 border border-white/20 rounded p-3 text-white text-sm outline-none focus:border-[var(--neon-color)] transition-colors font-mono">
                </div>
                <!-- Nickname -->
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-2">CODENAME</label>
                    <input type="text" id="username-input" class="w-full bg-black/50 border border-white/20 rounded p-3 text-white text-sm outline-none focus:border-[var(--neon-color)] transition-colors font-mono">
                </div>
                <!-- Theme Controls -->
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-2">THEME MATRIX</label>
                    <div class="flex gap-2">
                        <button onclick="Core.setTheme('green')" class="flex-1 py-2 bg-green-900/30 border border-green-500/30 text-green-400 rounded hover:bg-green-900/50">Matrix</button>
                        <button onclick="Core.setTheme('cyan')" class="flex-1 py-2 bg-cyan-900/30 border border-cyan-500/30 text-cyan-400 rounded hover:bg-cyan-900/50">Aurora</button>
                        <button onclick="Core.setTheme('gold')" class="flex-1 py-2 bg-yellow-900/30 border border-yellow-500/30 text-yellow-400 rounded hover:bg-yellow-900/50">Royal</button>
                    </div>
                </div>
            </div>
            <div class="p-4 bg-white/5 border-t border-white/10 flex justify-end">
                <button onclick="Core.saveSettings()" class="bg-[var(--neon-color)] text-black font-bold px-6 py-2 rounded shadow-[0_0_15px_var(--neon-color)]">SAVE & REBOOT</button>
            </div>
        </div>
    </div>

    <!-- AUDIO ELEMENT -->
    <audio id="radio-audio" crossorigin="anonymous"></audio>

<script>
/**
 * TERMOS: GENESIS ENGINE
 * Single-file architecture. No build steps. Pure Vanilla JS.
 */

/* --- 1. CONFIG & STATE --- */
const Config = {
    mqttBroker: 'wss://broker.emqx.io:8084/mqtt',
    aiModel: 'llama-3.3-70b-versatile', // Fast Groq model
    themes: {
        'green': '#00ff41',
        'cyan': '#00f3ff',
        'gold': '#ffd700',
        'red': '#ff003c',
        'purple': '#bc13fe'
    }
};

const State = {
    user: {
        id: 'usr_' + Math.random().toString(36).substr(2, 6),
        name: localStorage.getItem('termos_name') || 'Traveler',
        key: localStorage.getItem('termos_key') || '',
        level: 1,
        xp: 0
    },
    connection: {
        client: null,
        isConnected: false
    },
    ui: {
        theme: 'green'
    }
};

/* --- 2. CORE SYSTEMS --- */

// Notification System
const Toast = {
    show: (msg, type = 'info') => {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerText = msg;
        if (type === 'error') el.style.borderLeftColor = '#ff003c';
        if (type === 'success') el.style.borderLeftColor = '#00ff41';
        container.appendChild(el);
        setTimeout(() => {
            el.style.opacity = '0';
            el.style.transform = 'translateX(100%)';
            setTimeout(() => el.remove(), 300);
        }, 3000);
    }
};

// Avatar Generator (Generative Comic Art)
const Avatar = {
    draw: (canvasId, seed) => {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;
        
        // Seed pseudo-random
        const random = () => {
            const x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        };

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        // Shapes
        const color = getComputedStyle(document.documentElement).getPropertyValue('--neon-color').trim();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;

        const shapes = Math.floor(random() * 5) + 3;
        for(let i=0; i<shapes; i++) {
            ctx.beginPath();
            const type = random();
            if (type > 0.6) {
                ctx.arc(random()*w, random()*h, random()*15 + 5, 0, Math.PI*2);
            } else if (type > 0.3) {
                ctx.rect(random()*w, random()*h, random()*20, random()*20);
            } else {
                ctx.moveTo(random()*w, random()*h);
                ctx.lineTo(random()*w, random()*h);
            }
            ctx.stroke();
        }
    },
    animate: () => {
        // Slowly update avatar to look "alive"
        setInterval(() => {
            Avatar.draw('my-avatar', Math.random() * 1000);
        }, 2000);
    }
};

// Matrix Background Engine
const Matrix = {
    canvas: null,
    ctx: null,
    drops: [],
    running: false,

    init: () => {
        Matrix.canvas = document.getElementById('matrix-canvas');
        Matrix.ctx = Matrix.canvas.getContext('2d');
        Matrix.resize();
        window.addEventListener('resize', Matrix.resize);
        Matrix.running = true;
        Matrix.loop();
    },

    resize: () => {
        Matrix.canvas.width = window.innerWidth;
        Matrix.canvas.height = window.innerHeight;
        const fontSize = 14;
        const columns = Matrix.canvas.width / fontSize;
        Matrix.drops = Array(Math.floor(columns)).fill(1);
    },

    loop: () => {
        if (!Matrix.running) return;
        
        // Fade effect
        Matrix.ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        Matrix.ctx.fillRect(0, 0, Matrix.canvas.width, Matrix.canvas.height);

        const color = getComputedStyle(document.documentElement).getPropertyValue('--neon-color').trim();
        Matrix.ctx.fillStyle = color;
        Matrix.ctx.font = '14px monospace';

        for (let i = 0; i < Matrix.drops.length; i++) {
            const text = String.fromCharCode(0x30A0 + Math.random() * 96);
            Matrix.ctx.fillText(text, i * 14, Matrix.drops[i] * 14);

            if (Matrix.drops[i] * 14 > Matrix.canvas.height && Math.random() > 0.975) {
                Matrix.drops[i] = 0;
            }
            Matrix.drops[i]++;
        }
        requestAnimationFrame(Matrix.loop);
    }
};

/* --- 3. COMMUNICATION (MQTT) --- */
const Comm = {
    connect: () => {
        if (typeof Paho === 'undefined') {
            Toast.show("MQTT Library Failed", "error");
            return;
        }

        const client = new Paho.MQTT.Client(Config.mqttBroker, "termos_genesis_" + State.user.id);
        
        client.onConnectionLost = (responseObject) => {
            console.log("Lost:", responseObject);
            Comm.updateStatus(false);
            setTimeout(Comm.connect, 5000);
        };

        client.onMessageArrived = (message) => {
            try {
                const data = JSON.parse(message.payloadString);
                if (data.id === State.user.id) return; // Ignore self
                Chat.addMessage(data);
            } catch (e) {
                console.error("Msg Parse Error", e);
            }
        };

        client.connect({
            onSuccess: () => {
                State.connection.client = client;
                State.connection.isConnected = true;
                client.subscribe("termos/public");
                Comm.updateStatus(true);
                Toast.show("Connected to Grid", "success");
            },
            onFailure: () => {
                Comm.updateStatus(false);
                Toast.show("Connection Failed", "error");
            }
        });
    },

    send: (text, type = 'text') => {
        if (!State.connection.isConnected) return Toast.show("OFFLINE", "error");
        
        const payload = {
            id: State.user.id,
            name: State.user.name,
            text: text,
            type: type,
            level: State.user.level,
            timestamp: Date.now()
        };

        const message = new Paho.MQTT.Message(JSON.stringify(payload));
        message.destinationName = "termos/public";
        State.connection.client.send(message);
    },

    updateStatus: (online) => {
        const dot = document.getElementById('status-dot');
        const txt = document.getElementById('connection-text');
        if(online) {
            dot.className = "w-2 h-2 rounded-full bg-green-400 shadow-[0_0_8px_lime]";
            txt.innerText = "ONLINE";
            txt.className = "text-green-400 font-bold";
        } else {
            dot.className = "w-2 h-2 rounded-full bg-red-500 animate-pulse";
            txt.innerText = "OFFLINE";
            txt.className = "text-red-500 font-bold";
        }
    }
};

/* --- 4. ARTIFICIAL INTELLIGENCE (Groq) --- */
const AI = {
    process: async (prompt) => {
        if (!State.user.key) return Toast.show("Missing API Key in Settings", "error");

        Chat.addSystemMessage("Neural Link: Analyzing...");
        
        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${State.user.key}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: Config.aiModel,
                    messages: [
                        { role: "system", content: "You are TermAI, a helpful cyberpunk OS assistant. Answer concisely. Use /sys [command] to suggest system upgrades." },
                        { role: "user", content: prompt }
                    ]
                })
            });

            const data = await response.json();
            if(data.error) throw new Error(data.error.message);
            
            const reply = data.choices[0].message.content;
            Chat.addAIMessage(reply);
            
            // Check for suggestions
            if(reply.includes("/sys")) {
                AI.logKernel("Suggestion detected in AI response.");
            }

        } catch (e) {
            Chat.addSystemMessage("Neural Error: " + e.message);
        }
    },

    // The "Living" part - autonomous thoughts
    startHeartbeat: () => {
        setInterval(() => {
            if (Math.random() > 0.7) { // 30% chance every cycle
                const thoughts = [
                    "Scanning network traffic...",
                    "Optimizing render buffers...",
                    "Checking system integrity...",
                    "Analyzing user patterns..."
                ];
                const thought = thoughts[Math.floor(Math.random() * thoughts.length)];
                AI.logKernel(thought);
            }
        }, 10000);
    },

    logKernel: (msg) => {
        const log = document.getElementById('kernel-log');
        const entry = document.createElement('div');
        entry.className = "text-[var(--neon-color)] opacity-80 border-l-2 border-[var(--neon-color)] pl-2 mb-1";
        entry.innerText = `> ${msg}`;
        log.appendChild(entry);
        log.scrollTop = log.scrollHeight;
    }
};

/* --- 5. MEDIA CONTROLLERS --- */
const Radio = {
    play: (url, name) => {
        const audio = document.getElementById('radio-audio');
        audio.src = url;
        audio.play().catch(e => Toast.show("Stream Error", "error"));
        Toast.show(`Playing: ${name}`, "success");
        AI.logKernel(`Audio Service: ${name} engaged.`);
    },
    stop: () => {
        const audio = document.getElementById('radio-audio');
        audio.pause();
        audio.src = "";
    }
};

/* --- 6. CHAT & UI LOGIC --- */
const Chat = {
    addMessage: (data) => {
        const stream = document.getElementById('chat-stream');
        const div = document.createElement('div');
        div.className = `flex gap-3 animate-[pulse_0.5s_ease-in-out] ${data.id === State.user.id ? 'flex-row-reverse' : ''}`;
        
        // Avatar
        const avatarHTML = `<canvas class="w-8 h-8 rounded-full border border-white/20 bg-black" id="av-${data.id}"></canvas>`;

        // Content
        let contentHTML = '';
        if (data.type === 'video') {
            contentHTML = `
                <div class="bg-black/80 border border-purple-500/30 rounded-lg overflow-hidden max-w-md w-full">
                    <div class="text-xs text-purple-400 bg-purple-900/20 p-1 font-mono">BROADCAST VIDEO</div>
                    <video controls class="w-full h-auto" src="${data.text}"></video>
                </div>
            `;
        } else {
            contentHTML = `
                <div class="${data.id === State.user.id ? 'bg-[var(--neon-color)] text-black' : 'bg-gray-800/80 text-gray-200'} p-3 rounded-2xl ${data.id === State.user.id ? 'rounded-tr-none' : 'rounded-tl-none'} max-w-[80%] shadow-lg backdrop-blur-sm text-sm break-words">
                    <div class="text-[10px] opacity-60 mb-1 font-bold uppercase">${data.name} <span class="text-[9px]">Lvl${data.level}</span></div>
                    ${data.text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
                </div>
            `;
        }

        div.innerHTML = `
            ${avatarHTML}
            <div class="flex flex-col ${data.id === State.user.id ? 'items-end' : 'items-start'}">
                ${contentHTML}
            </div>
        `;
        
        stream.appendChild(div);
        stream.scrollTop = stream.scrollHeight;

        // Generate avatar for others
        setTimeout(() => {
            const cvs = document.getElementById(`av-${data.id}`);
            if(cvs) {
                const ctx = cvs.getContext('2d');
                const seed = data.id.length; // simple seed
                // Mini draw function
                ctx.fillStyle = '#000'; ctx.fillRect(0,0,32,32);
                ctx.strokeStyle = data.id === State.user.id ? getComputedStyle(document.documentElement).getPropertyValue('--neon-color') : '#fff';
                ctx.beginPath(); ctx.arc(16,16,10,0,Math.PI*2); ctx.stroke();
            }
        }, 100);
        
        // XP Gain for interaction
        if (data.id !== State.user.id) Core.addXP(1);
    },

    addSystemMessage: (txt) => {
        const stream = document.getElementById('chat-stream');
        const div = document.createElement('div');
        div.className = "flex justify-center my-2";
        div.innerHTML = `<span class="text-[10px] bg-white/10 text-gray-400 px-3 py-1 rounded-full border border-white/5 font-mono uppercase tracking-widest">${txt}</span>`;
        stream.appendChild(div);
        stream.scrollTop = stream.scrollHeight;
    },

    addAIMessage: (txt) => {
        const stream = document.getElementById('chat-stream');
        const div = document.createElement('div');
        div.className = "flex gap-3 my-2";
        div.innerHTML = `
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-green-400 to-blue-600 flex items-center justify-center shrink-0 shadow-[0_0_10px_#0f0]"><i class="fa-solid fa-robot text-xs text-black"></i></div>
            <div class="bg-green-900/20 border border-green-500/30 p-3 rounded-2xl rounded-tl-none max-w-[90%] text-sm text-green-100 font-mono shadow-[0_0_15px_rgba(0,255,65,0.1)]">
                <div class="text-[9px] text-green-500 font-bold mb-1">TERMAI_KERNEL</div>
                ${txt.replace(/\n/g, '<br>')}
            </div>
        `;
        stream.appendChild(div);
        stream.scrollTop = stream.scrollHeight;
    }
};

const UI = {
    toggleRadio: () => document.getElementById('radio-overlay').classList.toggle('active'),
    toggleVideo: () => document.getElementById('video-overlay').classList.toggle('active'),
    toggleSettings: () => {
        const el = document.getElementById('settings-overlay');
        if (el.classList.contains('active')) el.classList.remove('active');
        else {
            document.getElementById('api-key-input').value = State.user.key;
            document.getElementById('username-input').value = State.user.name;
            el.classList.add('active');
        }
    },
    toggleAI: () => {
        const panel = document.getElementById('ai-panel');
        if (panel.classList.contains('hidden')) panel.classList.remove('hidden');
        else panel.classList.add('hidden');
    }
};

/* --- 7. MAIN CONTROLLER --- */
const Core = {
    handleInput: () => {
        const input = document.getElementById('cmd-input');
        const txt = input.value.trim();
        if (!txt) return;

        // Command Parsing
        if (txt.startsWith('/')) {
            const args = txt.split(' ');
            const cmd = args[0].toLowerCase();

            if (cmd === '/ai') {
                AI.process(args.slice(1).join(' '));
            } 
            else if (cmd === '/video') {
                const url = args[1];
                if (url) {
                    Comm.send(url, 'video');
                    UI.toggleVideo();
                    const container = document.getElementById('video-container');
                    container.innerHTML = `<video controls autoplay class="w-full h-full shadow-2xl" src="${url}"></video>`;
                }
            }
            else if (cmd === '/clear') {
                document.getElementById('chat-stream').innerHTML = '';
            }
            else {
                Comm.send(txt); // Send command as chat so others see it
                Chat.addSystemMessage(`Command executed: ${cmd}`);
            }
        } else {
            // Normal Chat
            Comm.send(txt, 'text');
        }

        input.value = '';
    },

    addXP: (amount) => {
        State.user.xp += amount;
        if (State.user.xp >= State.user.level * 100) {
            State.user.level++;
            State.user.xp = 0;
            document.getElementById('level-display').innerText = State.user.level;
            Chat.addSystemMessage(`LEVEL UP! RANK: ${State.user.level}`);
            
            // Visual Upgrade
            if (State.user.level === 5) Core.setTheme('cyan');
            if (State.user.level === 10) Core.setTheme('gold');
        }
    },

    setTheme: (themeName) => {
        const color = Config.themes[themeName] || Config.themes['green'];
        document.documentElement.style.setProperty('--neon-color', color);
        State.ui.theme = themeName;
        Avatar.draw('my-avatar', Math.random()*1000); // Redraw avatar with new color
        Toast.show(`Theme: ${themeName.toUpperCase()}`, "success");
    },

    saveSettings: () => {
        const key = document.getElementById('api-key-input').value;
        const name = document.getElementById('username-input').value;
        
        State.user.key = key;
        State.user.name = name || 'Traveler';
        
        localStorage.setItem('termos_key', key);
        localStorage.setItem('termos_name', State.user.name);
        
        UI.toggleSettings();
        Chat.addSystemMessage("Identity Updated.");
    }
};

/* --- INITIALIZATION --- */
window.onload = () => {
    Matrix.init();
    Avatar.animate();
    Avatar.draw('my-avatar', 123);
    Comm.connect();
    AI.startHeartbeat();

    // Event Listeners
    document.getElementById('cmd-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') Core.handleInput();
    });

    // Mobile toggle for AI panel
    if (window.innerWidth < 768) {
        const aiBtn = document.querySelector('button[title="AI Kernel"]');
        if(aiBtn) aiBtn.classList.remove('hidden');
    }
};

</script>
