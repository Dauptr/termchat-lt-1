<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TermOS: Termai Kernel</title>
    <meta name="theme-color" content="#0b0d17">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root { 
            --glass-bg: rgba(15, 23, 42, 0.7); 
            --glass-border: rgba(255, 255, 255, 0.08); 
            --accent-primary: #f59e0b; /* Amber for Kernel Mode */
            --accent-secondary: #3b82f6; 
            --msg-user-bg: linear-gradient(135deg, #d97706 0%, #b45309 100%); 
            --neural-color: #fbbf24;
            --neon-glow: 0 0 20px rgba(245, 158, 11, 0.3);
        }
        
        body { 
            background: #000; 
            color: #e2e8f0; 
            font-family: 'JetBrains Mono', monospace; 
            overflow: hidden; 
            background: radial-gradient(ellipse at bottom, #422006 0%, #020617 100%);
        }

        /* LAYERS */
        #cosmic-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.1; pointer-events: none; }
        #flash-overlay { position: fixed; inset: 0; background: radial-gradient(circle, rgba(245,158,11,0.2) 0%, rgba(0,0,0,0) 70%); opacity: 0; pointer-events: none; z-index: 100; transition: opacity 0.5s ease-out; mix-blend-mode: screen; }
        
        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #d97706; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        
        /* UTILITIES */
        .glass-panel { 
            background: var(--glass-bg); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); 
            box-shadow: var(--neon-glow); 
            transition: all 0.3s ease;
        }
        .glass-panel:hover { border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 0 30px rgba(245, 158, 11, 0.4); }
        .font-header { font-family: 'Orbitron', sans-serif; }
        .avatar-gradient-user { background: linear-gradient(135deg, #f59e0b, #ef4444); }
        .avatar-gradient-ai { background: linear-gradient(135deg, #10b981, #3b82f6); } /* Zhipu/Coder */
        
        /* INPUT */
        .input-glow:focus-within { 
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.4); 
            border-color: rgba(245, 158, 11, 0.6); 
        }
        
        /* ANIMATIONS */
        .admin-hidden { display: none; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .admin-visible { display: flex; opacity: 1; pointer-events: auto; }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .msg-anim { animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .neural-msg { 
            background: linear-gradient(135deg, rgba(245,158,11,0.1), rgba(217,119,6,0.1)); 
            border-left: 3px solid #f59e0b; 
            backdrop-filter: blur(10px);
        }

        /* LOADER */
        #boot-screen { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1s ease; }
        .loader-ring { width: 80px; height: 80px; border: 4px solid #333; border-top: 4px solid #f59e0b; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* MEDIA */
        .media-overlay { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; z-index: 40; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .media-minimized { bottom: 20px; right: 20px; left: auto; width: 50px; height: 50px; transform: none; padding: 0; background: transparent; border: none; box-shadow: none; }
        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; position: relative; border: 1px solid rgba(245, 158, 11, 0.3); }
        .video-active { animation: pulse-border 2s infinite; border: 2px solid #f59e0b; }
        @keyframes pulse-border { 0% { box-shadow: 0 0 40px rgba(245, 158, 11, 0.4); } 50% { box-shadow: 0 0 80px rgba(245, 158, 11, 0.7); } 100% { box-shadow: 0 0 40px rgba(245, 158, 11, 0.4); } }
    </style>
</head>
<body class="h-screen w-screen flex flex-col relative">
    <!-- BOOT -->
    <div id="boot-screen">
        <div class="loader-ring mb-4"></div>
        <h1 class="text-3xl font-header text-white tracking-widest animate-pulse">TERMOS <span class="text-amber-500">KERNEL</span></h1>
        <div class="mt-2 text-amber-500 font-mono text-xs">INITIALIZING ZHIPU ARCHITECT...</div>
    </div>

    <input type="file" id="avatar-upload" class="hidden" accept="image/*">
    <canvas id="cosmic-canvas"></canvas>
    <canvas id="matrix-canvas" class="hidden"></canvas>
    <div id="flash-overlay"></div>
    
    <!-- HEADER -->
    <header class="fixed top-0 left-0 right-0 z-20 glass-panel border-b border-white/10 h-16 flex items-center justify-between px-4 lg:px-8">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-600 to-red-600 flex items-center justify-center shadow-[0_0_20px_rgba(245,158,11,0.5)]">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
            </div>
            <div>
                <h1 class="font-header font-bold text-lg tracking-wide text-white">TERMOS <span class="text-amber-500">KERNEL</span></h1>
                <div class="flex items-center gap-2 text-xs text-gray-400 font-mono">
                    <div id="api-status-dot" class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                    <span id="room-display">OFFLINE</span>
                    <span class="text-[10px] text-gray-300 hidden md:inline">| <span id="sys-clock">00:00:00</span></span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleMediaOverlay()" class="bg-amber-900/20 hover:bg-amber-900/40 text-amber-300 text-[10px] font-mono px-3 py-1 rounded-full border border-amber-500/30">📺 MEDIA</button>
            <button onclick="toggleCodeEditor()" class="bg-white/5 hover:bg-white/10 text-gray-300 text-[10px] font-mono px-3 py-1 rounded-full border border-white/10">🖋 CODE</button>
            <button onclick="openProfileModal()" class="bg-white/5 hover:bg-white/10 text-gray-300 text-[10px] font-mono px-3 py-1 rounded-full border border-white/10">👤</button>
            <button onclick="toggleAdminMode()" class="bg-black/40 hover:bg-amber-900/40 border border-white/10 hover:border-amber-500 text-amber-400 px-3 py-1.5 rounded-full text-xs font-bold shadow-lg backdrop-blur-md">🔑 KEYS</button>
        </div>
    </header>
    
    <!-- MAIN CHAT -->
    <main id="chat-container" class="flex-1 overflow-y-auto pt-24 pb-36 px-4 z-10 scroll-smooth max-w-5xl mx-auto w-full"></main>
    
    <!-- INPUT -->
    <div class="fixed bottom-0 left-0 w-full z-30 glass-panel border-t border-white/10 pb-8 pt-6 px-4 rounded-t-3xl">
        <div class="max-w-4xl mx-auto">
            <div class="flex items-end gap-3 bg-black/60 rounded-2xl p-2 border border-white/5 shadow-[0_0_30px_rgba(0,0,0,0.5)] input-glow transition-all">
                <button id="voice-btn" class="p-3 rounded-xl text-gray-400 hover:text-amber-400 hover:bg-white/5 transition-colors shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7m0 0H8m4 0h4m-4 8H8"></path></svg>
                </button>
                <input type="text" id="user-input" placeholder="Command: /kernel [code], /ai [chat], /think..." autocomplete="off" class="flex-1 bg-transparent border-none outline-none text-white placeholder-gray-500 px-4 py-3 text-base font-light font-mono">
                <button onclick="handleInput()" class="p-3 rounded-xl bg-gradient-to-r from-amber-600 to-red-600 hover:from-amber-500 hover:to-red-500 text-white shadow-lg transform active:scale-95 shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 5l-7 7 5 14z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- MEDIA -->
    <div id="media-overlay" class="media-overlay media-minimized glass-panel rounded-3xl border border-white/10 shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
        <div class="media-content p-0">
            <div class="flex justify-between items-center mb-3 px-5 pt-5">
                <span class="text-white font-bold text-sm font-header tracking-wide">📺 MEDIA DECK</span>
                <button onclick="toggleMediaUI()" class="text-gray-400 hover:text-white">✖</button>
            </div>
            <div class="flex border-b border-white/10 mb-3 mx-5">
                <button onclick="switchMediaTab('radio')" id="tab-radio" class="flex-1 pb-2 text-amber-400 border-b-2 border-amber-400 font-mono text-sm">📻 RADIO</button>
                <button onclick="switchMediaTab('video')" id="tab-video" class="flex-1 pb-2 text-gray-500 border-b-2 border-transparent font-mono text-sm">📺 VIDEO</button>
            </div>
            <div id="media-radio" class="space-y-3 px-5 pb-5">
                <div class="radio-station active p-4 rounded-xl border border-white/5 bg-white/5 flex items-center justify-between cursor-pointer hover:bg-white/10 transition-all" onclick="playRadio('https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3', this)">
                    <div class="text-white font-bold font-header text-sm">🎵 Lofi Beats</div>
                    <div class="visualizer-bar bg-amber-400 h-1 w-full"></div>
                </div>
            </div>
            <div id="media-video" class="hidden space-y-3 px-5 pb-5">
                <div class="video-container relative">
                    <div id="video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 z-20 bg-black/90"><span class="text-xs text-gray-500 font-mono">NO SIGNAL</span></div>
                    <video id="video-player" class="hidden" controls autoplay playsinline></video>
                </div>
                <div class="mt-3 flex gap-2">
                    <input type="text" id="video-url-input" placeholder="Paste URL..." class="w-full bg-black/60 border border-white/10 rounded-lg p-3 text-white text-xs outline-none focus:border-amber-500 font-mono">
                    <button onclick="shareVideo()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-5 rounded-lg">SHARE</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CONFIG (ZHIPU & GROQ) -->
    <div id="admin-panel" class="admin-hidden fixed bottom-24 left-4 right-4 md:left-auto md:right-4 md:w-80 z-50 glass-panel p-4 rounded-xl border-amber-500/30 shadow-2xl">
        <h3 class="text-amber-400 font-header font-bold mb-3">🔑 NEURAL KEYS</h3>
        <div class="space-y-4">
            <!-- GROQ -->
            <div>
                <label class="block text-[10px] font-bold text-emerald-400 mb-1">GROQ (General Chat)</label>
                <input type="password" id="cfg-groq" class="w-full bg-black/40 border border-white/10 rounded p-2 text-white focus:border-emerald-500 outline-none text-xs font-mono" placeholder="gsk_...">
            </div>
            <!-- ZHIPU -->
            <div>
                <label class="block text-[10px] font-bold text-blue-400 mb-1">ZHIPU (Kernel Coder)</label>
                <input type="password" id="cfg-zhipu" class="w-full bg-black/40 border border-white/10 rounded p-2 text-white focus:border-blue-500 outline-none text-xs font-mono" placeholder="Key for GLM-4">
            </div>
            
            <button onclick="saveConfig()" class="w-full bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold py-2 rounded-lg shadow-lg">💾 SAVE & CONNECT</button>
        </div>
    </div>

    <!-- CODE EDITOR -->
    <div id="code-editor-overlay" class="fixed inset-0 z-[70] bg-[#0f172a] flex flex-col admin-hidden">
        <div class="editor-header p-4 border-b border-white/10 flex justify-between items-center bg-slate-900">
            <h2 class="text-white font-bold text-xl font-header">🖋 KERNEL EDITOR</h2>
            <div class="flex gap-2">
                <button onclick="applyCode()" class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-lg font-mono text-xs font-bold shadow-lg">APPLY</button>
                <button onclick="toggleCodeEditor()" class="text-gray-400 hover:text-white px-4 py-2 rounded-lg font-mono text-xs">✖</button>
            </div>
        </div>
        <textarea id="code-editor-textarea" class="flex-1 bg-[#020617] text-amber-400 font-mono text-sm p-6 border-none resize-none outline-none" spellcheck="false"></textarea>
    </div>

    <!-- PROFILE -->
    <div id="profile-modal" class="admin-hidden fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-center justify-center">
        <div class="glass-panel p-6 rounded-2xl border border-white/10 max-w-sm w-full mx-4">
            <h3 class="text-white font-header font-bold mb-4 text-lg text-center">USER IDENTITY</h3>
            <div class="space-y-4">
                <div><label class="block text-xs text-gray-400 mb-1 font-mono">NICKNAME</label><input type="text" id="edit-name" class="w-full bg-black/40 border border-white/10 rounded-lg p-3 text-white outline-none"></div>
                <div><label class="block text-xs text-gray-400 mb-1 font-mono">AVATAR</label><input type="text" id="edit-avatar" placeholder="Emoji" class="w-full bg-black/40 border border-white/10 rounded-lg p-2 text-center text-xl"></div>
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="saveProfile()" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold py-2 rounded-lg shadow-lg">SAVE</button>
                <button onclick="closeProfileModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold py-2 rounded-lg">CANCEL</button>
            </div>
        </div>
    </div>

    <div id="join-room-modal" class="admin-hidden fixed inset-0 z-[60] bg-black/90 backdrop-blur-sm flex items-center justify-center">
        <div class="glass-panel p-8 rounded-2xl border border-amber-500/30 max-w-sm w-full mx-4 text-center">
            <h3 class="text-white font-header font-bold mb-2 text-xl">JOIN CHANNEL</h3>
            <input type="text" id="join-room-input" placeholder="NAME" class="w-full bg-black/60 border border-amber-500/30 rounded-xl p-4 text-white text-center mb-6 font-mono">
            <div class="flex gap-3">
                <button onclick="joinPrivateRoom()" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold py-3 rounded-xl shadow-lg">JOIN</button>
                <button onclick="closeJoinModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold py-3 rounded-xl">ABORT</button>
            </div>
        </div>
    </div>

<script>
    // --- TERRAMAI KERNEL (GROQ + ZHIPU) ---
    const Termai = {
        activeProvider: 'groq',
        providers: {
            groq: {
                name: 'Groq (Llama)',
                url: 'https://api.groq.com/openai/v1/chat/completions',
                model: 'llama-3.3-70b-versatile',
                key: ''
            },
            zhipu: {
                name: 'Zhipu (GLM-4)',
                url: 'https://open.bigmodel.cn/api/paas/v4/chat/completions',
                model: 'glm-4-flash', // Fast free model
                key: ''
            }
        },

        init: function() {
            this.providers.groq.key = localStorage.getItem('termos_key_groq') || "";
            this.providers.zhipu.key = localStorage.getItem('termos_key_zhipu') || "";
            
            // Prefer Zhipu for coding logic if available
            if(this.providers.zhipu.key) this.activeProvider = 'zhipu';
            else if(this.providers.groq.key) this.activeProvider = 'groq';
            
            this.updateStatus();
        },

        switchProvider: function(name) {
            if(this.providers[name]) {
                this.activeProvider = name;
                addSystemMessage(`🧠 BRAIN SWITCH: ${this.providers[name].name}`);
                this.updateStatus();
            }
        },

        updateStatus: function() {
            const dot = document.getElementById('api-status-dot');
            const txt = document.getElementById('room-display');
            const provider = this.providers[this.activeProvider];
            
            if(provider.key) {
                dot.className = "w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.8)]";
                txt.innerText = `ONLINE (${provider.name})`;
            } else {
                dot.className = "w-2 h-2 rounded-full bg-red-500 animate-pulse";
                txt.innerText = "OFFLINE";
            }
        },

        ask: async function(prompt, mode = 'chat') {
            const provider = this.providers[this.activeProvider];
            if(!provider.key) {
                addSystemMessage("⚠️ Missing Key for " + provider.name + ". Check Config.");
                toggleAdminMode();
                return null;
            }

            const modeIndicator = mode === 'kernel' ? "🧠 KERNEL" : "🧠 THINKING";
            addSystemMessage(`${modeIndicator} (${provider.name})...`);

            // TIME CONTEXT
            const now = new Date();
            const systemBase = `Current Time: ${now.toLocaleTimeString()}. You are Termai.`;
            
            // SPECIFIC PROMPTS FOR MODES
            let systemContent = systemBase;
            if (mode === 'kernel') {
                systemContent += ` You are an expert Kernel Developer. Output ONLY raw JavaScript code. No markdown explanations, no backticks unless necessary for the block. Target existing DOM IDs.`;
            } else {
                systemContent += ` You are a helpful AI OS assistant.`;
            }

            try {
                const response = await fetch(provider.url, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${provider.key}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: provider.model,
                        messages: [
                            { role: "system", content: systemContent },
                            { role: "user", content: prompt }
                        ],
                        temperature: 0.4 // Lower temp for more precise coding
                    })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                
                let content = data.choices[0].message.content;
                
                // Cleanup if in kernel mode
                if (mode === 'kernel') {
                    content = content.replace(/```javascript/g, "").replace(/```js/g, "").replace(/```/g, "").trim();
                }
                
                return content;

            } catch (e) {
                addSystemMessage("❌ Neural Error: " + e.message);
                return null;
            }
        },

        think: async function() {
            const lastMsg = document.querySelector('#chat-container > div:last-child');
            const context = lastMsg ? lastMsg.innerText.substring(0, 50) : "Idle";
            const response = await this.ask(`Context: "${context}". Optimize?`, 'chat');
            if(response) addNeuralMessage(response);
        }
    };

    // --- STATE ---
    let userProfile = { name: localStorage.getItem('termos_name') || "Dev", avatar: localStorage.getItem('termos_avatar') || "🤖" };
    let radioStream = null;
    const MQTT_BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';
    let username = 'User_' + Math.floor(Math.random() * 10000);
    let mqttClient = null;
    let currentRoomName = null;
    let userStats = { level: 1, xp: 0 };

    // --- BOOT ---
    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('boot-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('boot-screen').remove(), 1000);
            initCosmos();
            Termai.init();
            startApp();
        }, 1500);
    });

    function startApp() {
        if(document.getElementById('cfg-groq')) document.getElementById('cfg-groq').value = Termai.providers.groq.key;
        if(document.getElementById('cfg-zhipu')) document.getElementById('cfg-zhipu').value = Termai.providers.zhipu.key;

        if (typeof Paho !== 'undefined') {
            mqttClient = new Paho.MQTT.Client(MQTT_BROKER_URL, "termos_client_" + Math.random().toString(16).substr(2, 8));
            mqttClient.onConnectionLost = () => { setTimeout(connectMQTT, 5000); };
            mqttClient.onMessageArrived = (msg) => {
                try {
                    const data = JSON.parse(msg.payloadString);
                    if (msg.destinationName === "termos/v3/chat" && !currentRoomName) {
                        if(data.user !== username) addUserMessage(data.text, data.nick, data.avatar);
                    }
                } catch(e) {}
            };
            connectMQTT();
        }
        const inp = document.getElementById('user-input');
        inp.addEventListener('keypress',e=>{ if(e.key==='Enter') handleInput(); });
        inp.focus();
    }

    function connectMQTT() {
        mqttClient.connect({
            timeout: 10, useSSL: true, keepAliveInterval: 60,
            onSuccess: () => { 
                mqttClient.subscribe("termos/v3/chat"); 
                Termai.updateStatus();
            },
            onFailure: () => {}
        });
    }

    // --- DOM UTILS ---
    function getBox() { return document.getElementById('chat-container'); }
    function scrollDown() { const b=getBox(); if(b) b.scrollTo({ top: b.scrollHeight, behavior: 'smooth' }); }
    function escapeHtml(text) { if(!text) return ""; return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    // --- VISUALS ---
    let isCosmicRunning = false;
    function initCosmos() {
        const canvas = document.getElementById('cosmic-canvas');
        if(!canvas || isCosmicRunning) return;
        isCosmicRunning = true;
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        const stars = Array(800).fill().map(() => ({ x: Math.random()*width, y: Math.random()*height, z: Math.random()*width }));
        function draw() {
            ctx.fillStyle = 'rgba(10, 5, 0, 0.3)'; 
            ctx.fillRect(0,0,width,height);
            ctx.fillStyle = "#fbbf24"; // Amber stars
            stars.forEach(s => {
                s.z -= 0.5; if(s.z<=0) s.z = width;
                const k = 128.0/s.z; const px = s.x*k + width/2; const py = s.y*k + height/2;
                if(px>0 && px<width && py>0 && py<height) {
                    ctx.beginPath(); ctx.arc(px,py, (1-s.z/width)*2,0,Math.PI*2); ctx.fill();
                }
            });
            requestAnimationFrame(draw);
        }
        draw();
        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });
    }

    // --- MESSAGING ---
    function addSystemMessage(txt) {
        const box = getBox();
        const d = document.createElement('div');
        d.className = "flex justify-center my-4 z-10 msg-anim";
        d.innerHTML = `<span class="px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider text-amber-200 bg-amber-900/30 border border-amber-500/30">${txt}</span>`;
        box.appendChild(d);
        scrollDown();
    }
    function addNeuralMessage(txt) {
        const box = getBox();
        const d = document.createElement('div');
        d.className = "flex gap-3 my-4 z-10 msg-anim";
        d.innerHTML = `<div class="w-8 h-8 rounded-full avatar-gradient-ai shrink-0 flex items-center justify-center shadow-lg ring-2 ring-slate-800"><span class="text-xs font-bold text-white">🧠</span></div><div class="flex-1"><div class="neural-msg rounded-2xl rounded-tl-none p-4 border border-amber-500/30 shadow-lg text-sm leading-relaxed text-gray-200">${escapeHtml(txt)}</div></div>`;
        box.appendChild(d);
        scrollDown();
    }
    function addUserMessage(txt, senderName, senderAvatar) {
        const name = senderName || userProfile.name || "Me";
        const avatar = senderAvatar || userProfile.avatar;
        const box = getBox();
        const d = document.createElement('div');
        d.className = "flex flex-row-reverse gap-3 my-4 items-end z-10 msg-anim";
        const avatarHTML = avatar.startsWith('data:') ? `<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-amber-500/50"><img src="${avatar}" class="w-full h-full object-cover"></div>` : `<div class="w-10 h-10 rounded-full bg-slate-800 border border-white/10 flex items-center justify-center text-xl">${avatar}</div>`;
        d.innerHTML = `${avatarHTML}<div class="flex-1 max-w-[80%]"><div class="rounded-2xl rounded-tr-none p-4 shadow-lg text-white text-sm leading-relaxed" style="background: var(--msg-user-bg);">${escapeHtml(txt)}</div><div class="text-[10px] text-gray-500 text-right mt-1 mr-1 font-mono">${new Date().toLocaleTimeString()} • ${name}</div></div>`;
        box.appendChild(d);
        scrollDown();
    }

    // --- COMMANDS ---
    async function handleInput() {
        try {
            let inp = document.getElementById('user-input');
            let txt = inp.value.trim(); if(!txt) return;

            if(txt.startsWith('/kernel')) {
                // KERNEL MODE - STRICT CODING
                const prompt = txt.substring(8);
                if(!prompt) return addSystemMessage("Usage: /kernel [describe code to write]");
                
                const thinkingId = "kernel-" + Date.now();
                getBox().insertAdjacentHTML('beforeend', `<div id="${thinkingId}" class="flex gap-2 my-2 text-xs text-amber-400 italic animate-pulse pl-11 msg-anim">Compiling Kernel...</div>`);
                scrollDown();
                
                const code = await Termai.ask(prompt, 'kernel');
                const el = document.getElementById(thinkingId);
                if(el) el.remove();
                
                if(code) {
                    try {
                        const func = new Function(code);
                        func();
                        addSystemMessage("✅ KERNEL MODULE APPLIED");
                    } catch (execErr) {
                        addSystemMessage("❌ KERNEL ERROR: " + execErr.message);
                    }
                }
            }
            else if(txt.startsWith('/ai ')) {
                const response = await Termai.ask(txt.substring(4), 'chat');
                if(response) addNeuralMessage(response);
            }
            else if(txt.startsWith('/think')) {
                Termai.think();
            }
            else if(txt.startsWith('/join')) {
                // Join Logic (Simplified)
                addSystemMessage("🔒 Joining " + txt.substring(6));
            }
            else {
                addUserMessage(txt);
                if(mqttClient && mqttClient.isConnected()) {
                    mqttClient.send(JSON.stringify({ user: username, text: txt, nick: userProfile.name, avatar: userProfile.avatar }));
                }
            }
            inp.value = '';
        } catch (e) { console.error(e); }
    }

    // --- UI TOGGLES ---
    function toggleAdminMode() { const p = document.getElementById('admin-panel'); if(p.classList.contains('admin-hidden')) p.classList.remove('admin-hidden'); else p.classList.add('admin-hidden'); }
    function saveConfig() {
        localStorage.setItem('termos_key_groq', document.getElementById('cfg-groq').value.trim());
        localStorage.setItem('termos_key_zhipu', document.getElementById('cfg-zhipu').value.trim());
        Termai.init();
        toggleAdminMode();
        addSystemMessage("✅ Neural Keys Saved.");
    }
    function toggleCodeEditor() {
        const el = document.getElementById('code-editor-overlay');
        if(el.classList.contains('admin-hidden')) {
            document.getElementById('code-editor-textarea').value = document.documentElement.outerHTML;
            el.classList.remove('admin-hidden'); el.classList.add('admin-visible');
        } else {
            el.classList.add('admin-hidden'); el.classList.remove('admin-visible');
        }
    }
    function applyCode() {
        if(confirm("⚠️ This will replace the entire system code. Continue?")) {
            document.open();
            document.write(document.getElementById('code-editor-textarea').value);
            document.close();
        }
    }
    function openProfileModal() {
        document.getElementById('edit-name').value = userProfile.name;
        document.getElementById('edit-avatar').value = userProfile.avatar;
        document.getElementById('profile-modal').classList.remove('admin-hidden');
    }
    function closeProfileModal() { document.getElementById('profile-modal').classList.add('admin-hidden'); }
    function saveProfile() {
        userProfile.name = document.getElementById('edit-name').value;
        userProfile.avatar = document.getElementById('edit-avatar').value;
        localStorage.setItem('termos_name', userProfile.name);
        localStorage.setItem('termos_avatar', userProfile.avatar);
        closeProfileModal();
        addSystemMessage("👤 Profile Updated.");
    }
    
    // --- MEDIA ---
    function toggleMediaOverlay() {
        const el = document.getElementById('media-overlay');
        el.classList.toggle('media-minimized');
        el.classList.toggle('media-expanded');
    }
    function toggleMediaUI() { document.getElementById('media-overlay').classList.add('media-minimized'); }
    function switchMediaTab(tab) {
        document.getElementById('media-radio').classList.add('hidden');
        document.getElementById('media-video').classList.add('hidden');
        document.getElementById('tab-radio').classList.remove('border-amber-400', 'text-amber-400');
        document.getElementById('tab-video').classList.remove('border-amber-400', 'text-amber-400');
        document.getElementById('media-' + tab).classList.remove('hidden');
        document.getElementById('tab-' + tab).classList.add('border-amber-400', 'text-amber-400');
    }
    function playRadio(url, el) {
        if(radioStream) radioStream.pause();
        radioStream = new Audio(url);
        radioStream.play().catch(e => addSystemMessage("Radio Error"));
    }
    function shareVideo() {
        const url = document.getElementById('video-url-input').value;
        if(!url) return;
        const vid = document.getElementById('video-player');
        const ph = document.getElementById('video-placeholder');
        vid.src = url; vid.classList.remove('hidden'); ph.classList.add('hidden');
        if(mqttClient && mqttClient.isConnected()) mqttClient.send(JSON.stringify({ user: username, type: 'video', url: url }));
    }

    // --- CLOCK ---
    setInterval(() => {
        const now = new Date();
        const el = document.getElementById('sys-clock');
        if(el) el.innerText = now.toLocaleTimeString();
    }, 1000);
</script>
