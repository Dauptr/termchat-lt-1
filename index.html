<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TermOS: Unified</title>
    <meta name="theme-color" content="#0f172a">
    
    <!-- LIBRARIES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <!-- FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@500;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #050b14;
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --accent-red: #ef4444;
            --neon-glow: 0 0 15px rgba(6, 182, 212, 0.3);
        }

        body {
            background-color: var(--bg-deep);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* --- BACKGROUND CANVAS --- */
        #visual-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* --- LAYOUT --- */
        .app-shell {
            display: grid;
            grid-template-columns: 80px 1fr;
            height: 100%;
            z-index: 10;
            position: relative;
        }

        @media (max-width: 768px) {
            .app-shell {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 70px;
            }
        }

        /* --- SIDEBAR / DOCK --- */
        .sidebar {
            background: rgba(2, 6, 23, 0.9);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            z-index: 20;
            backdrop-filter: blur(10px);
        }

        @media (max-width: 768px) {
            .sidebar {
                flex-direction: row;
                border-right: none;
                border-top: 1px solid var(--glass-border);
                justify-content: space-around;
                padding: 0;
            }
        }

        .nav-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
        }

        .nav-btn:hover, .nav-btn.active {
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent-cyan);
            box-shadow: var(--neon-glow);
        }

        .nav-btn.active::after {
            content: '';
            position: absolute;
            right: -15px; /* Desktop Indicator */
            height: 20px;
            width: 3px;
            background: var(--accent-cyan);
            border-radius: 2px;
        }

        @media (max-width: 768px) {
            .nav-btn.active::after {
                right: auto;
                bottom: -20px; /* Mobile Indicator */
                width: 20px;
                height: 3px;
            }
        }

        /* --- MAIN CONTENT AREA --- */
        .main-view {
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header-bar {
            height: 60px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(5px);
        }

        /* --- SCROLLABLE CHAT / LOGS --- */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 100px; /* Space for input */
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* --- INPUT AREA --- */
        .input-dock {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(5,11,20,0.95), rgba(5,11,20,0.7));
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
            outline: none;
            transition: all 0.2s;
            max-width: 800px;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }

        .glass-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.15);
        }

        /* --- MESSAGES & TERMINAL --- */
        .msg-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            animation: slideUp 0.3s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
        }

        .bubble.system {
            align-self: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            font-size: 0.8rem;
            color: #94a3b8;
            margin: 10px auto;
            display: block;
            width: fit-content;
        }

        .bubble.user {
            background: linear-gradient(135deg, var(--accent-purple), #6366f1);
            color: white;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.2);
        }

        .bubble.ai {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 2px;
            color: #e2e8f0;
        }
        
        .bubble.terminal {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            background: #0f172a;
            border-left: 2px solid var(--accent-cyan);
            color: #22d3ee;
            padding: 10px;
            white-space: pre-wrap;
        }

        /* --- MODALS & TOASTS --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: #1e293b;
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.3s;
        }
        .modal-overlay.open .modal-card { transform: scale(1); }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 110;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: rgba(15, 23, 42, 0.95);
            border-left: 4px solid var(--accent-cyan);
            color: white;
            padding: 12px 20px;
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideInRight 0.3s ease-out;
            max-width: 300px;
            font-size: 0.9rem;
        }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; }}

        /* --- CAMERA OVERLAY --- */
        .camera-overlay {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 200px;
            height: 150px;
            background: #000;
            border: 1px solid var(--accent-cyan);
            border-radius: 12px;
            z-index: 50;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            overflow: hidden;
            display: none; /* Toggled via JS */
        }
        .camera-overlay.active { display: block; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; }}
        
        video { width: 100%; height: 100%; object-fit: cover; }

        /* --- UTILITY CLASSES --- */
        .font-header { font-family: 'Orbitron', sans-serif; }
        .font-mono { font-family: 'Fira Code', monospace; }
        .text-glow { text-shadow: 0 0 10px rgba(6, 182, 212, 0.5); }
    </style>
</head>
<body>

    <!-- VISUALS -->
    <canvas id="visual-canvas"></canvas>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-container" class="toast-container"></div>

    <!-- MODAL CONTAINER -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-card">
            <h3 id="modal-title" class="text-white font-header text-lg mb-4">Settings</h3>
            <div id="modal-content" class="mb-6 text-sm text-gray-300"></div>
            <div class="flex justify-end gap-2">
                <button id="modal-cancel" class="px-4 py-2 rounded-lg border border-gray-600 hover:bg-gray-700 text-gray-300 transition">Cancel</button>
                <button id="modal-confirm" class="px-4 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-bold transition">Confirm</button>
            </div>
        </div>
    </div>

    <!-- CAMERA PREVIEW -->
    <div id="camera-overlay" class="camera-overlay">
        <video id="local-video" autoplay muted playsinline></video>
        <div class="absolute top-2 right-2 w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
        <div class="absolute bottom-2 left-2 text-[10px] font-mono text-cyan-400 bg-black/50 px-1 rounded">LIVE FEED</div>
    </div>

    <div class="app-shell">
        <!-- SIDEBAR -->
        <nav class="sidebar">
            <div class="mb-auto md:mb-0">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg mb-4 md:mb-8">
                    <span class="font-header text-white font-bold text-lg">T</span>
                </div>
            </div>

            <!-- Nav Buttons -->
            <button class="nav-btn active" onclick="App.switchTab('chat')" title="Comms">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </button>
            <button class="nav-btn" onclick="App.switchTab('terminal')" title="Terminal">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </button>
            <button class="nav-btn" onclick="Media.toggleCamera()" title="Video Uplink">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            </button>
            <button class="nav-btn" onclick="App.openSettings()" title="System Config">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </nav>

        <!-- MAIN CONTENT -->
        <main class="main-view">
            <!-- Header -->
            <header class="header-bar">
                <div class="flex items-center gap-3">
                    <h1 class="font-header text-xl tracking-wider text-white">TERMOS <span class="text-cyan-400 text-glow">UNIFIED</span></h1>
                </div>
                <div class="flex items-center gap-2">
                    <span id="connection-dot" class="w-2 h-2 rounded-full bg-red-500"></span>
                    <span id="connection-text" class="text-xs font-mono text-gray-400">OFFLINE</span>
                </div>
            </header>

            <!-- Views Container -->
            <div id="views-container" class="relative flex-1 overflow-hidden">
                
                <!-- Chat View -->
                <div id="view-chat" class="absolute inset-0 flex flex-col transition-transform duration-300">
                    <div id="chat-scroll" class="content-scroll">
                        <div class="bubble system">Welcome to TermOS Unified.</div>
                        <div class="bubble system">Connect using Settings to enable Neural Net.</div>
                    </div>
                </div>

                <!-- Terminal View -->
                <div id="view-terminal" class="absolute inset-0 flex flex-col translate-x-full transition-transform duration-300 bg-black/80">
                    <div id="terminal-scroll" class="content-scroll font-mono text-sm">
                        <div class="text-green-500 mb-2">TermOS Kernel v2.4.0 initialized...</div>
                        <div class="text-gray-500 mb-2">Type commands in the input bar. Try /help</div>
                    </div>
                </div>

            </div>

            <!-- Input Dock -->
            <div class="input-dock">
                <button onclick="App.handleVoice()" class="p-3 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7m0 0H8m4 0h4m-4 8H8"></path></svg>
                </button>
                <input type="text" id="main-input" class="glass-input" placeholder="Enter command or message..." autocomplete="off">
                <button onclick="App.submitInput()" class="p-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white shadow-lg transition transform active:scale-95">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
        </main>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        /**
         * TermOS Unified Logic
         * Namespaced for clarity: App, UI, MQTT, Media, AI, VFX
         */

        // --- CONFIG & STATE ---
        const Config = {
            broker: "broker.emqx.io",
            port: 8084,
            topicBase: "termos/unified/v1",
            aiModel: "llama-3.3-70b-versatile" // Default for Groq
        };

        const State = {
            user: "User_" + Math.floor(Math.random() * 9000 + 1000),
            apiKey: localStorage.getItem('termos_key') || "",
            currentTab: 'chat',
            isMqttConnected: false,
            cameraActive: false
        };

        // --- VISUAL EFFECTS ---
        const VFX = {
            canvas: document.getElementById('visual-canvas'),
            ctx: null,
            width: 0,
            height: 0,
            stars: [],
            mode: 'stars', // 'stars' or 'matrix'

            init() {
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.initStars();
                this.animate();
            },

            resize() {
                this.width = this.canvas.width = window.innerWidth;
                this.height = this.canvas.height = window.innerHeight;
            },

            initStars() {
                this.stars = Array(400).fill().map(() => ({
                    x: Math.random() * this.width,
                    y: Math.random() * this.height,
                    z: Math.random() * 2, // Depth
                    size: Math.random() * 1.5
                }));
            },

            animate() {
                // Fade out effect
                this.ctx.fillStyle = this.mode === 'matrix' ? 'rgba(0, 0, 0, 0.1)' : 'rgba(5, 11, 20, 0.3)';
                this.ctx.fillRect(0, 0, this.width, this.height);

                if (this.mode === 'stars') {
                    this.drawStars();
                } else {
                    this.drawMatrix();
                }

                requestAnimationFrame(() => this.animate());
            },

            drawStars() {
                this.ctx.fillStyle = '#FFF';
                this.stars.forEach(star => {
                    // Move star
                    star.y -= star.z * 0.5;
                    if(star.y < 0) {
                        star.y = this.height;
                        star.x = Math.random() * this.width;
                    }

                    const alpha = (star.z / 2) * 0.8 + 0.2;
                    this.ctx.globalAlpha = alpha;
                    this.ctx.beginPath();
                    this.ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    this.ctx.fill();
                });
                this.ctx.globalAlpha = 1.0;
            },

            drawMatrix() {
                // Simplified matrix fallback for visual variety
                this.ctx.fillStyle = '#0f0';
                this.ctx.font = '14px monospace';
                if(!this.matrixCols) this.matrixCols = Math.floor(this.width / 14);
                if(!this.matrixDrops) this.matrixDrops = Array(this.matrixCols).fill(1);
                
                for(let i=0; i<this.matrixDrops.length; i++) {
                    const text = String.fromCharCode(0x30A0 + Math.random() * 96);
                    this.ctx.fillText(text, i*14, this.matrixDrops[i]*14);
                    if(this.matrixDrops[i]*14 > this.height && Math.random() > 0.975) this.matrixDrops[i] = 0;
                    this.matrixDrops[i]++;
                }
            },

            toggleMode() {
                this.mode = this.mode === 'stars' ? 'matrix' : 'stars';
                if(this.mode === 'stars') {
                    this.ctx.fillStyle = '#050b14';
                    this.ctx.fillRect(0,0,this.width, this.height);
                    this.initStars();
                }
            }
        };

        // --- UI MANAGER ---
        const UI = {
            toastContainer: document.getElementById('toast-container'),
            modal: {
                el: document.getElementById('modal-overlay'),
                title: document.getElementById('modal-title'),
                content: document.getElementById('modal-content'),
                confirmBtn: document.getElementById('modal-confirm'),
                cancelBtn: document.getElementById('modal-cancel')
            },
            currentAction: null,

            toast(msg, type = 'info') {
                const div = document.createElement('div');
                div.className = 'toast';
                const colors = type === 'error' ? 'border-red-500' : 'border-cyan-500';
                div.style.borderLeftColor = type === 'error' ? 'var(--accent-red)' : 'var(--accent-cyan)';
                
                div.innerHTML = `
                    <span>${type === 'error' ? '⚠️' : 'ℹ️'}</span>
                    <span>${msg}</span>
                `;
                this.toastContainer.appendChild(div);
                setTimeout(() => div.remove(), 3000);
            },

            showModal(title, htmlContent, onConfirm) {
                this.modal.title.innerText = title;
                this.modal.content.innerHTML = htmlContent;
                this.currentAction = onConfirm;
                this.modal.el.classList.add('open');
            },

            closeModal() {
                this.modal.el.classList.remove('open');
                this.currentAction = null;
            },

            confirmModal() {
                if (this.currentAction) this.currentAction();
                this.closeModal();
            },

            addChatMessage(text, type = 'user') {
                const container = document.getElementById('chat-scroll');
                const row = document.createElement('div');
                
                if (type === 'system') {
                    row.innerHTML = `<div class="bubble system">${text}</div>`;
                    row.className = "flex justify-center";
                } else {
                    const isUser = type === 'user';
                    const align = isUser ? 'flex-row-reverse' : 'flex-row';
                    const bubbleClass = isUser ? 'user' : 'ai';
                    const label = isUser ? 'YOU' : 'AI KERNEL';
                    
                    row.className = `msg-row ${align}`;
                    row.innerHTML = `
                        <div class="bubble ${bubbleClass}">${text}</div>
                    `;
                }
                
                container.appendChild(row);
                container.scrollTop = container.scrollHeight;
            },

            addTerminalLog(text) {
                const container = document.getElementById('terminal-scroll');
                const div = document.createElement('div');
                div.className = "bubble terminal";
                div.innerText = `> ${text}`;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            },

            updateStatus(online) {
                const dot = document.getElementById('connection-dot');
                const txt = document.getElementById('connection-text');
                if(online) {
                    dot.className = "w-2 h-2 rounded-full bg-green-400 shadow-[0_0_8px_#4ade80]";
                    txt.innerText = "NET: CONNECTED";
                    txt.classList.add("text-green-400");
                    txt.classList.remove("text-gray-400");
                } else {
                    dot.className = "w-2 h-2 rounded-full bg-red-500 animate-pulse";
                    txt.innerText = "NET: OFFLINE";
                    txt.classList.remove("text-green-400");
                    txt.classList.add("text-gray-400");
                }
            }
        };

        // --- MQTT MODULE ---
        const MQTT = {
            client: null,

            connect() {
                if (typeof Paho === 'undefined') return UI.toast("MQTT Library missing", 'error');
                
                UI.toast("Handshaking with satellite...");
                const clientId = "termos_" + State.user;
                
                this.client = new Paho.Client(Config.broker, Config.port, clientId);

                this.client.onConnectionLost = (resp) => {
                    UI.updateStatus(false);
                    UI.addTerminalLog(`Connection Lost: ${resp.errorMessage}`);
                };

                this.client.onMessageArrived = (msg) => {
                    try {
                        const data = JSON.parse(msg.payloadString);
                        if (data.sender !== State.user) {
                            UI.addChatMessage(data.text, 'ai'); // Treat incoming as 'other'
                        }
                    } catch (e) { console.error(e); }
                };

                this.client.connect({
                    useSSL: true,
                    timeout: 3,
                    onSuccess: () => {
                        this.client.subscribe(Config.topicBase);
                        UI.updateStatus(true);
                        UI.toast("Link Established");
                        UI.addChatMessage("Connected to Global Frequency.", 'system');
                    },
                    onFailure: () => {
                        UI.updateStatus(false);
                        UI.toast("Signal Failed", 'error');
                    }
                });
            },

            send(text) {
                if (!this.client || !this.client.isConnected()) {
                    UI.toast("Signal Lost. Cannot send.", 'error');
                    return;
                }
                const msg = new Paho.Message(JSON.stringify({ sender: State.user, text: text }));
                msg.destinationName = Config.topicBase;
                this.client.send(msg);
            }
        };

        // --- AI MODULE ---
        const AI = {
            async query(prompt) {
                if (!State.apiKey) {
                    UI.openSettings(); // Force settings open
                    return;
                }

                UI.addChatMessage("Processing query...", 'system');
                UI.addTerminalLog(`Sending to Groq: ${prompt}`);

                try {
                    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${State.apiKey}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: Config.aiModel,
                            messages: [
                                { role: "system", content: "You are TermOS AI. Respond concisely, with a cyberpunk/futuristic tone." },
                                { role: "user", content: prompt }
                            ]
                        })
                    });

                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);
                    
                    const reply = data.choices[0].message.content;
                    UI.addChatMessage(reply, 'ai');
                    UI.addTerminalLog("Groq response received.");
                } catch (e) {
                    UI.addChatMessage(`Error: ${e.message}`, 'system');
                    UI.toast("AI Query Failed", 'error');
                }
            }
        };

        // --- MEDIA MODULE ---
        const Media = {
            async toggleCamera() {
                const videoEl = document.getElementById('local-video');
                const overlay = document.getElementById('camera-overlay');
                
                if (!State.cameraActive) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                        videoEl.srcObject = stream;
                        overlay.classList.add('active');
                        State.cameraActive = true;
                        UI.toast("Video Uplink Active");
                        
                        // Notify others
                        if(MQTT.client && MQTT.client.isConnected()) {
                            MQTT.send("[VIDEO TRANSMISSION STARTED]");
                        }
                    } catch (err) {
                        UI.toast("Camera Access Denied", 'error');
                        UI.addTerminalLog("Camera Error: " + err.message);
                    }
                } else {
                    const tracks = videoEl.srcObject.getTracks();
                    tracks.forEach(t => t.stop());
                    videoEl.srcObject = null;
                    overlay.classList.remove('active');
                    State.cameraActive = false;
                    UI.toast("Video Uplink Terminated");
                }
            }
        };

        // --- CORE APP CONTROLLER ---
        const App = {
            init() {
                VFX.init();
                
                // Event Listeners
                document.getElementById('modal-cancel').onclick = () => UI.closeModal();
                document.getElementById('modal-confirm').onclick = () => UI.confirmModal();
                
                document.getElementById('main-input').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.submitInput();
                });

                // Auto connect MQTT
                MQTT.connect();
            },

            switchTab(tabName) {
                State.currentTab = tabName;
                
                // Toggle Buttons
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                // Note: In a real app we'd map buttons to tabs better, here assuming order or simple logic
                
                // Toggle Views
                const chatView = document.getElementById('view-chat');
                const termView = document.getElementById('view-terminal');

                if (tabName === 'chat') {
                    chatView.style.transform = 'translateX(0)';
                    termView.style.transform = 'translateX(100%)';
                } else {
                    chatView.style.transform = 'translateX(-100%)';
                    termView.style.transform = 'translateX(0)';
                }
            },

            submitInput() {
                const input = document.getElementById('main-input');
                const val = input.value.trim();
                if (!val) return;

                if (State.currentTab === 'chat') {
                    // Check for AI command
                    if (val.startsWith('/ai ')) {
                        UI.addChatMessage(val, 'user');
                        AI.query(val.substring(4));
                    } else if (val.startsWith('/effect ')) {
                        const cmd = val.split(' ')[1];
                        if(cmd === 'matrix') VFX.mode = 'matrix';
                        if(cmd === 'stars') VFX.mode = 'stars';
                        UI.addChatMessage(`Visual effect set to ${cmd}`, 'system');
                    } else {
                        // Normal Chat
                        UI.addChatMessage(val, 'user');
                        MQTT.send(val);
                    }
                } else if (State.currentTab === 'terminal') {
                    UI.addTerminalLog(val);
                    this.executeCommand(val);
                }

                input.value = '';
            },

            executeCommand(cmd) {
                const parts = cmd.split(' ');
                const base = parts[0].toLowerCase();

                switch(base) {
                    case '/clear':
                        document.getElementById('terminal-scroll').innerHTML = '';
                        break;
                    case '/connect':
                        MQTT.connect();
                        break;
                    case '/effect':
                        VFX.toggleMode();
                        break;
                    case '/help':
                        UI.addTerminalLog("Commands: /clear, /connect, /effect, /help");
                        break;
                    default:
                        UI.addTerminalLog(`Unknown command: ${base}`);
                }
            },

            openSettings() {
                UI.showModal(
                    "System Configuration",
                    `
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-cyan-400 mb-1">GROQ API KEY (Neural Net)</label>
                            <input type="password" id="set-key" class="w-full bg-black/50 border border-gray-600 rounded p-2 text-white focus:border-cyan-500 outline-none" value="${State.apiKey}">
                        </div>
                        <div class="text-xs text-gray-500">Leave empty to disable AI features.</div>
                    </div>
                    `,
                    () => {
                        const newKey = document.getElementById('set-key').value.trim();
                        State.apiKey = newKey;
                        localStorage.setItem('termos_key', newKey);
                        UI.toast("System Configuration Saved");
                    }
                );
            },
            
            handleVoice() {
                UI.toast("Voice module initializing...", 'info');
                // Placeholder for Web Speech API
                if ('webkitSpeechRecognition' in window) {
                    const recognition = new webkitSpeechRecognition();
                    recognition.lang = 'en-US';
                    recognition.onresult = (event) => {
                        const text = event.results[0][0].transcript;
                        document.getElementById('main-input').value = text;
                        UI.toast("Voice captured");
                    };
                    recognition.start();
                } else {
                    UI.toast("Voice module not supported in this browser.", 'error');
                }
            }
        };

        // Boot
        window.onload = () => App.init();

    </script>
</body>
</html>
