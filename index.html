<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMOS: HORIZON</title>
    
    <!-- LIBRARIES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <!-- FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                    colors: {
                        horizon: {
                            bg: '#0f172a',
                            card: 'rgba(30, 41, 59, 0.7)',
                            primary: '#6366f1', // Indigo
                            accent: '#8b5cf6', // Violet
                            success: '#10b981',
                            danger: '#ef4444',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #000;
            color: #e2e8f0;
            overflow: hidden;
        }

        /* --- BACKGROUND ANIMATION (Smoother) --- */
        canvas {
            position: fixed; inset: 0; z-index: -1;
        }

        /* --- SOFT SCROLLBAR --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.5); }

        /* --- FRIENDLY UI COMPONENTS --- */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .input-capsule {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .input-capsule:focus {
            background: rgba(0, 0, 0, 0.5);
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* --- MESSAGES --- */
        .msg-bubble {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            transition: transform 0.2s;
        }
        .msg-bubble:hover { transform: translateY(-1px); }
        
        .msg-self {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border-bottom-right-radius: 4px;
            align-self: flex-end;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        
        .msg-other {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
        }

        .msg-system {
            align-self: center;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            color: #94a3b8;
            font-size: 0.75rem;
            padding: 6px 16px;
            border-radius: 99px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 10px 0;
        }

        /* --- SIDEBAR DRAWER --- */
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 320px;
            height: 100%;
            background: #0f172a;
            z-index: 50;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border-left: 1px solid rgba(255,255,255,0.1);
            box-shadow: -10px 0 40px rgba(0,0,0,0.5);
        }
        .sidebar.open { transform: translateX(0); }
        
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); 
            z-index: 40; opacity: 0; pointer-events: none;
            transition: opacity 0.3s;
            backdrop-filter: blur(2px);
        }
        .overlay.open { opacity: 1; pointer-events: auto; }

        /* --- VIDEO PLAYER --- */
        .video-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="font-sans antialiased h-screen flex flex-col">

    <!-- BACKGROUND -->
    <canvas id="bg-canvas"></canvas>

    <!-- OVERLAY FOR SIDEBAR -->
    <div id="sidebar-overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR DRAWER (Settings) -->
    <div id="sidebar" class="sidebar flex flex-col p-6">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-bold text-white tracking-wide">Settings</h2>
            <button onclick="toggleSidebar()" class="p-2 hover:bg-white/10 rounded-full transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div class="space-y-6 flex-1">
            <!-- Profile -->
            <div class="glass-panel p-4 rounded-xl flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold text-xl">
                    U
                </div>
                <div>
                    <div class="text-sm text-gray-400 uppercase tracking-wider">Operator</div>
                    <input type="text" id="settings-nick" class="bg-transparent text-white font-bold text-lg focus:outline-none border-b border-transparent focus:border-indigo-500 w-full" placeholder="Enter Name">
                </div>
            </div>

            <!-- API Key -->
            <div>
                <label class="text-xs text-indigo-400 font-bold uppercase tracking-wider mb-2 block">Groq AI Key</label>
                <input type="password" id="settings-api" class="input-capsule w-full p-3 rounded-lg text-sm text-white" placeholder="gsk_...">
                <p class="text-[10px] text-gray-500 mt-2">Required for AI intelligence. Empty = Simulation Mode.</p>
            </div>

            <!-- Connection Status -->
            <div>
                <label class="text-xs text-indigo-400 font-bold uppercase tracking-wider mb-2 block">Network Status</label>
                <div class="flex items-center gap-3 p-3 bg-black/30 rounded-lg border border-white/5">
                    <div id="status-dot-lg" class="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_red]"></div>
                    <div>
                        <div id="status-text-lg" class="text-sm font-bold text-white">OFFLINE</div>
                        <div id="broker-text" class="text-[10px] text-gray-500">Scanning networks...</div>
                    </div>
                </div>
            </div>
        </div>

        <button onclick="applySettings()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/30 transition-all">
            Apply Changes
        </button>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div class="flex-1 flex flex-col relative z-10 max-w-7xl mx-auto w-full h-full p-4 md:p-6">
        
        <!-- HEADER -->
        <header class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-tight">TermOS <span class="text-indigo-400">Horizon</span></h1>
                    <div class="text-xs text-gray-400 flex items-center gap-2">
                        <span id="mini-status" class="w-1.5 h-1.5 rounded-full bg-red-500"></span>
                        <span id="current-room-display">Lobby</span>
                    </div>
                </div>
            </div>

            <button onclick="openRoomModal()" class="glass-panel px-4 py-2 rounded-lg text-sm text-indigo-300 font-medium hover:bg-white/10 transition-all flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Switch Room
            </button>

            <button onclick="toggleSidebar()" class="p-2 glass-panel rounded-full hover:bg-white/10 transition-colors">
                <svg class="w-6 h-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </header>

        <!-- CONTENT GRID -->
        <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 min-h-0">
            
            <!-- LEFT: CHAT -->
            <div class="lg:col-span-8 flex flex-col glass-panel rounded-2xl overflow-hidden">
                <div id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-4">
                    <div class="text-center text-xs text-gray-600 font-mono">Welcome to Horizon. Type /help for commands.</div>
                </div>

                <div class="p-4 bg-black/20 backdrop-blur-md border-t border-white/5">
                    <div class="flex items-center gap-3">
                        <input type="text" id="chat-input" placeholder="Type a message or /ai prompt..." class="input-capsule flex-1 px-5 py-3 rounded-full text-white placeholder-gray-500 focus:outline-none">
                        <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-full shadow-lg shadow-indigo-600/30 transition-transform active:scale-95">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- RIGHT: MEDIA -->
            <div class="lg:col-span-4 flex flex-col gap-4">
                <div class="glass-panel p-4 rounded-2xl h-full flex flex-col">
                    <h3 class="text-sm font-bold text-gray-300 mb-4 uppercase tracking-wider flex justify-between items-center">
                        Media Sync
                        <span id="sync-badge" class="text-[10px] px-2 py-0.5 bg-gray-700 text-gray-300 rounded-full">OFF</span>
                    </h3>

                    <div class="video-container aspect-video bg-black relative mb-4">
                        <video id="main-video" class="w-full h-full object-cover" controls playsinline></video>
                        <div id="video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 text-sm">
                            <svg class="w-10 h-10 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            No Stream
                        </div>
                    </div>

                    <div class="space-y-2">
                        <input type="text" id="video-url" placeholder="Paste video URL..." class="input-capsule w-full p-2 text-xs rounded-lg">
                        <button onclick="shareVideo()" class="w-full py-2 bg-violet-600 hover:bg-violet-500 text-white text-sm font-bold rounded-lg transition-colors">
                            Broadcast to Room
                        </button>
                    </div>

                    <div class="mt-auto pt-4 border-t border-white/5 grid grid-cols-2 gap-2">
                        <button onclick="playAudio('https://streams.ilovemusic.com/iloveradio17.mp3')" class="p-2 bg-white/5 hover:bg-white/10 rounded text-xs text-gray-300 transition-colors">🎵 Cyber</button>
                        <button onclick="playAudio('https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3')" class="p-2 bg-white/5 hover:bg-white/10 rounded text-xs text-gray-300 transition-colors">☕ Chill</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ROOM MODAL -->
    <div id="room-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center">
        <div class="glass-panel p-6 rounded-2xl w-full max-w-sm text-center shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-2">Join Sector</h3>
            <p class="text-sm text-gray-400 mb-4">Enter secure frequency name.</p>
            <input type="text" id="new-room" class="input-capsule w-full p-3 rounded-xl text-center text-lg mb-4 bg-black/50 border-indigo-500/30">
            <div class="flex gap-2">
                <button onclick="joinRoom()" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl">Connect</button>
                <button onclick="document.getElementById('room-modal').classList.add('hidden')" class="flex-1 py-3 bg-gray-700 text-white font-bold rounded-xl hover:bg-gray-600">Cancel</button>
            </div>
        </div>
    </div>

    <!-- LOGIC ENGINE -->
    <script>
        // --- 1. SOFT VISUALS ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let w, h, particles = [];

        function initVisuals() {
            resize();
            window.addEventListener('resize', resize);
            for(let i=0; i<150; i++) {
                particles.push({
                    x: Math.random() * w, y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    s: Math.random() * 2 + 1,
                    a: Math.random() * 0.5 + 0.1
                });
            }
            loop();
        }

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function loop() {
            ctx.fillStyle = '#0f172a'; // Horizon Dark Blue
            ctx.fillRect(0,0,w,h);
            
            ctx.fillStyle = '#6366f1'; // Indigo Particles
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if(p.x < 0) p.x = w; if(p.x > w) p.x = 0;
                if(p.y < 0) p.y = h; if(p.y > h) p.y = 0;
                
                ctx.globalAlpha = p.a;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(loop);
        }
        initVisuals();

        // --- 2. ROBUST CONNECTION MANAGER ---
        const BROKERS = [
            { url: "broker.hivemq.com", port: 8000, ssl: false },
            { url: "broker.emqx.io", port: 8084, ssl: true },
            { url: "test.mosquitto.org", port: 8080, ssl: false }
        ];

        let currentBrokerIndex = 0;
        let mqttClient;
        let isConnected = false;
        let myId = "user_" + Math.floor(Math.random()*9999);
        let currentTopic = "termos/horizon/lobby";
        let myNick = "Traveler";
        let groqKey = "";

        function connectMQTT() {
            if(mqttClient && mqttClient.isConnected()) {
                mqttClient.disconnect();
            }

            const broker = BROKERS[currentBrokerIndex];
            updateStatusUI(false, "Connecting to " + broker.url + "...");

            mqttClient = new Paho.Client(broker.url, broker.port, myId);

            mqttClient.onConnectionLost = (resp) => {
                isConnected = false;
                updateStatusUI(false, "Connection Lost. Rotating...");
                // Try next broker in 3 seconds
                setTimeout(() => {
                    currentBrokerIndex = (currentBrokerIndex + 1) % BROKERS.length;
                    connectMQTT();
                }, 3000);
            };

            mqttClient.onMessageArrived = (msg) => handleMsg(msg);

            mqttClient.connect({
                useSSL: broker.ssl,
                timeout: 10,
                onSuccess: () => {
                    isConnected = true;
                    updateStatusUI(true, "Online (" + broker.url + ")");
                    mqttClient.subscribe(currentTopic);
                    // Announce
                    mqttClient.send(new Paho.Message(JSON.stringify({type:'join', nick: myNick}), currentTopic));
                },
                onFailure: (err) => {
                    // Failure triggers onConnectionLost essentially, so we just let it rotate
                    // but we add a specific UI note
                    updateStatusUI(false, "Failed to reach " + broker.url);
                }
            });
        }

        function updateStatusUI(online, text) {
            const dot = document.getElementById('status-dot-lg');
            const txt = document.getElementById('status-text-lg');
            const mini = document.getElementById('mini-status');
            const brokerTxt = document.getElementById('broker-text');

            if(online) {
                dot.className = "w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_8px_#10b981]";
                txt.innerText = "CONNECTED";
                txt.className = "text-sm font-bold text-emerald-400";
                mini.className = "w-1.5 h-1.5 rounded-full bg-emerald-400";
            } else {
                dot.className = "w-3 h-3 rounded-full bg-red-500 animate-pulse";
                txt.innerText = "OFFLINE";
                txt.className = "text-sm font-bold text-red-500";
                mini.className = "w-1.5 h-1.5 rounded-full bg-red-500";
            }
            brokerTxt.innerText = text;
        }

        // --- 3. MESSAGING LOGIC ---

        function handleMsg(msg) {
            try {
                const data = JSON.parse(msg.payloadString);
                if(data.id === myId) return;

                if(data.type === 'chat') {
                    addMsg(data.nick, data.text, 'other');
                } else if(data.type === 'join') {
                    addSystemMsg(data.nick + " joined.");
                } else if(data.type === 'video') {
                    addSystemMsg(data.nick + " is streaming video.");
                    playVideo(data.url);
                }
            } catch(e) {}
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if(!txt) return;

            if(txt.startsWith('/ai ')) {
                handleAI(txt.substring(4));
            } else {
                addMsg("You", txt, 'self');
                mqttClient.send(new Paho.Message(JSON.stringify({type:'chat', nick: myNick, text: txt, id:myId}), currentTopic));
            }
            input.value = '';
        }

        // --- 4. UI HELPERS ---

        function addMsg(sender, text, type) {
            const c = document.getElementById('chat-container');
            const d = document.createElement('div');
            
            if(type === 'system') {
                d.className = 'msg-system';
                d.innerText = text;
            } else {
                d.className = 'msg-bubble ' + (type === 'self' ? 'msg-self' : 'msg-other');
                d.innerHTML = `<div class="text-[10px] font-bold mb-1 opacity-70">${sender}</div>${text}`;
            }
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }

        function addSystemMsg(text) {
            const c = document.getElementById('chat-container');
            const d = document.createElement('div');
            d.className = 'msg-system';
            d.innerText = text;
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('sidebar-overlay');
            sb.classList.toggle('open');
            ov.classList.toggle('open');
        }

        function openRoomModal() {
            document.getElementById('room-modal').classList.remove('hidden');
            document.getElementById('new-room').focus();
        }

        function joinRoom() {
            const room = document.getElementById('new-room').value.trim();
            if(!room) return;

            if(isConnected) {
                mqttClient.unsubscribe(currentTopic);
                // Announce leave? Optional.
            }

            currentTopic = "termos/horizon/" + room;
            document.getElementById('current-room-display').innerText = room.toUpperCase();
            
            if(isConnected) {
                mqttClient.subscribe(currentTopic);
                mqttClient.send(new Paho.Message(JSON.stringify({type:'join', nick: myNick}), currentTopic));
                addSystemMsg("Joined sector: " + room);
            }

            document.getElementById('room-modal').classList.add('hidden');
        }

        function applySettings() {
            myNick = document.getElementById('settings-nick').value || "Traveler";
            groqKey = document.getElementById('settings-api').value;
            localStorage.setItem('termos_nick', myNick);
            localStorage.setItem('termos_groq', groqKey);
            toggleSidebar();
            
            // Force reconnect with new ID if we want, but usually not necessary
            addSystemMsg("Settings Saved.");
        }

        // --- 5. MEDIA SYNC ---
        
        function shareVideo() {
            const url = document.getElementById('video-url').value;
            if(!url) return;
            playVideo(url);
            mqttClient.send(new Paho.Message(JSON.stringify({type:'video', url:url, nick:myNick}), currentTopic));
            addSystemMsg("Broadcasting video...");
        }

        function playVideo(url) {
            const v = document.getElementById('main-video');
            const p = document.getElementById('video-placeholder');
            v.src = url;
            v.play();
            p.style.display = 'none';
            document.getElementById('sync-badge').className = "text-[10px] px-2 py-0.5 bg-emerald-500 text-white rounded-full animate-pulse";
            document.getElementById('sync-badge').innerText = "LIVE";
        }

        function playAudio(url) {
            new Audio(url).play();
            addSystemMsg("Playing Radio...");
        }

        // --- 6. AI ---
        
        async function handleAI(prompt) {
            addSystemMsg("Thinking...");
            if(!groqKey) {
                setTimeout(() => addMsg("AI", "I'm running in simulation mode because no API key was provided. Please check settings.", 'other'), 1000);
                return;
            }
            try {
                const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method:"POST",
                    headers:{"Authorization":"Bearer "+groqKey,"Content-Type":"application/json"},
                    body:JSON.stringify({
                        model:"llama-3.3-70b-versatile",
                        messages:[{role:"system",content:"You are a helpful AI."},{role:"user",content:prompt}]
                    })
                });
                const d = await r.json();
                addMsg("AI", d.choices[0].message.content, 'other');
            } catch(e) {
                addSystemMsg("AI Error: " + e.message);
            }
        }

        // --- INIT ---
        window.onload = () => {
            myNick = localStorage.getItem('termos_nick') || "Traveler";
            groqKey = localStorage.getItem('termos_groq') || "";
            
            document.getElementById('settings-nick').value = myNick;
            document.getElementById('settings-api').value = groqKey;
            
            connectMQTT();
        };

        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') sendMessage();
        });

    </script>
</body>
</html>
