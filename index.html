<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMOS: NEXUS CORE</title>
    
    <!-- LIBRARIES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CONFIG & CUSTOM STYLES -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#050508',
                            dark: '#0a0a12',
                            primary: '#00f2ff', /* Cyan */
                            secondary: '#7000ff', /* Purple */
                            accent: '#ff0055', /* Pink */
                        }
                    },
                    fontFamily: {
                        sans: ['Rajdhani', 'sans-serif'],
                        mono: ['Orbitron', 'monospace'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: 1, boxShadow: '0 0 20px #00f2ff' },
                            '50%': { opacity: .7, boxShadow: '0 0 5px #00f2ff' },
                        },
                        slideUp: {
                            '0%': { opacity: 0, transform: 'translateY(20px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        /* --- CUSTOM SCROLLBAR --- */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 242, 255, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 242, 255, 0.6); }

        /* --- GLASSMORPHISM --- */
        .glass-panel {
            background: rgba(10, 10, 18, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* --- NEON GLOW TEXT --- */
        .text-glow {
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.7), 0 0 20px rgba(0, 242, 255, 0.5);
        }
        .text-glow-purple {
            text-shadow: 0 0 10px rgba(112, 0, 255, 0.7);
        }

        /* --- INPUTS --- */
        .cyber-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 242, 255, 0.3);
            color: #fff;
            transition: all 0.3s ease;
        }
        .cyber-input:focus {
            outline: none;
            border-color: #00f2ff;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        /* --- BUTTONS --- */
        .cyber-btn {
            background: linear-gradient(135deg, rgba(0,242,255,0.1), rgba(112,0,255,0.1));
            border: 1px solid rgba(0, 242, 255, 0.4);
            color: #00f2ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .cyber-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .cyber-btn:hover::before { left: 100%; }
        .cyber-btn:hover {
            background: linear-gradient(135deg, rgba(0,242,255,0.3), rgba(112,0,255,0.3));
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
            text-shadow: 0 0 8px #fff;
        }

        /* --- VIDEO PLAYER --- */
        .video-frame {
            border: 1px solid rgba(112, 0, 255, 0.3);
            box-shadow: 0 0 15px rgba(112, 0, 255, 0.1);
            position: relative;
        }
        .video-frame::after {
            content: 'LIVE SIGNAL';
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(255, 0, 85, 0.8);
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 2px;
            font-weight: bold;
            animation: pulseGlow 1.5s infinite;
            display: none;
        }
        .video-frame.active::after { display: block; }

        /* --- MESSAGES --- */
        .msg-bubble {
            animation: slideUp 0.3s ease-out forwards;
            position: relative;
        }
        .msg-bubble::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
    </style>
</head>

    <!-- Join Room -->

                <svg class="w-8 h-8 text-cyber-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>

    <!-- LOGIC ENGINE -->
    <script>
        // --- 1. VISUAL ENGINE (NEW AGE) ---
        const canvas = document.getElementById('universe');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];
        let nebulaClouds = [];

        function initVisuals() {
            resize();
            window.addEventListener('resize', resize);
            
            // Stars
            for(let i=0; i<600; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 2, // Depth
                    size: Math.random() * 2
                });
            }
            
            // Nebula (Soft Gradient Clouds)
            for(let i=0; i<5; i++) {
                nebulaClouds.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.2,
                    vy: (Math.random() - 0.5) * 0.2,
                    r: Math.random() * 400 + 200,
                    color: Math.random() > 0.5 ? 'rgba(112,0,255,0.05)' : 'rgba(0,242,255,0.05)'
                });
            }
            animate();
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function animate() {
            ctx.fillStyle = '#020205'; // Very dark bg
            ctx.fillRect(0, 0, width, height);

            // Draw Nebulae
            nebulaClouds.forEach(cloud => {
                cloud.x += cloud.vx;
                cloud.y += cloud.vy;
                
                if(cloud.x < -cloud.r) cloud.x = width + cloud.r;
                if(cloud.x > width + cloud.r) cloud.x = -cloud.r;
                if(cloud.y < -cloud.r) cloud.y = height + cloud.r;
                if(cloud.y > height + cloud.r) cloud.y = -cloud.r;

                const g = ctx.createRadialGradient(cloud.x, cloud.y, 0, cloud.x, cloud.y, cloud.r);
                g.addColorStop(0, cloud.color);
                g.addColorStop(1, 'transparent');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.r, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Stars (Parallax)
            ctx.fillStyle = '#FFF';
            stars.forEach(star => {
                star.x -= star.z * 0.2; // Move left based on depth
                if(star.x < 0) star.x = width;
                
                const alpha = Math.random() * 0.5 + 0.3;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            requestAnimationFrame(animate);
        }
        
        initVisuals();

        // --- 2. AUDIO ENGINE (Web Audio API - No external files) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let currentAudio = null;

        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if(type === 'hover') {
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.02, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if(type === 'click') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if(type === 'message') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // --- 3. LOGIC CORE (MQTT + AI) ---
        const MQTT_HOST = "broker.emqx.io";
        const MQTT_PORT = 8084; // WSS
        const BASE_TOPIC = "termos/nexus/";
        
        let mqttClient;
        let myId = "user_" + Math.floor(Math.random() * 10000);
        let currentTopic = BASE_TOPIC + "lobby";
        let myNick = "Guest";
        let groqKey = "";
        let isConnected = false;

        function initMQTT() {
            mqttClient = new Paho.Client(MQTT_HOST, MQTT_PORT, myId);

            mqttClient.onConnectionLost = (responseObject) => {
                updateStatus(false);
                if (responseObject.errorCode !== 0) {
                    addSystemMessage("⚠️ CONNECTION LOST. RETRYING...");
                    setTimeout(initMQTT, 5000);
                }
            };

            mqttClient.onMessageArrived = (msg) => handlePayload(msg);

            mqttClient.connect({
                onSuccess: () => {
                    isConnected = true;
                    updateStatus(true);
                    mqttClient.subscribe(currentTopic);
                    publish({ type: 'join' });
                    addSystemMessage("🔌 UPLINK ESTABLISHED. WELCOME TO NEXUS.");
                },
                onFailure: () => {
                    updateStatus(false);
                    setTimeout(initMQTT, 5000);
                },
                useSSL: true
            });
        }

        function updateStatus(online) {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            if(online) {
                dot.className = "w-2 h-2 rounded-full bg-cyber-primary shadow-[0_0_10px_#00f2ff]";
                txt.innerText = "ONLINE";
                txt.className = "text-cyber-primary font-bold";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-red-500 animate-pulse";
                txt.innerText = "OFFLINE";
                txt.className = "text-red-500 font-bold";
            }
        }

        function publish(data) {
            if(!isConnected) return;
            const payload = JSON.stringify({ ...data, nick: myNick, id: myId });
            mqttClient.send(new Paho.Message(payload, currentTopic));
        }

        function handlePayload(msg) {
            try {
                const data = JSON.parse(msg.payloadString);
                if(data.id === myId) return; // Ignore self

                if(data.type === 'chat') {
                    addChatMessage(data.nick, data.text, 'other');
                    playSound('message');
                } else if(data.type === 'join') {
                    addSystemMessage(`👤 ${data.nick} ENTERED SECTOR`);
                } else if(data.type === 'video') {
                    addSystemMessage(`📺 ${data.nick} STARTED STREAM`);
                    loadVideo(data.url);
                }
            } catch(e) {}
        }

        // --- 4. USER INTERACTION ---

        function handleSend() {
            const input = document.getElementById('user-input');
            const txt = input.value.trim();
            if(!txt) return;

            playSound('click');

            if(txt.startsWith('/ai ')) {
                handleAI(txt.substring(4));
            } else {
                addChatMessage(myNick, txt, 'self');
                publish({ type: 'chat', text: txt });
            }
            input.value = '';
        }

        async function handleAI(prompt) {
            addSystemMessage("🧠 PROCESSING NEURAL QUERY...");
            
            if(!groqKey) {
                // Simulation Mode
                setTimeout(() => {
                    addChatMessage("AI", "Neural Link Disconnected. Please configure API Key in System Config for advanced processing. Currently running in simulation mode.", "ai");
                }, 1000);
                return;
            }

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${groqKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: "You are a futuristic AI assistant for the TermOS Nexus. Be concise and cool." },
                            { role: "user", content: prompt }
                        ]
                    })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                addChatMessage("AI", reply, "ai");
            } catch(e) {
                addChatMessage("SYSTEM", "AI ERROR: " + e.message, "system");
            }
        }

        // --- 5. UI HELPERS ---

        function addChatMessage(sender, text, type) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = "msg-bubble max-w-[85%] " + (type === 'self' ? 'ml-auto' : 'mr-auto');
            
            let style = "bg-white/10 text-white border-white/10 rounded-2xl rounded-tr-sm";
            let header = `<div class="text-[10px] text-gray-400 font-mono mb-1">${sender}</div>`;

            if(type === 'self') {
                style = "bg-gradient-to-r from-cyber-primary/20 to-cyber-secondary/20 text-white border border-cyber-primary/30 rounded-2xl rounded-tr-sm";
                header = `<div class="text-[10px] text-cyber-primary font-mono mb-1">YOU</div>`;
            } else if (type === 'ai') {
                style = "bg-cyber-primary/10 text-cyan-100 border border-cyber-primary/30 rounded-2xl rounded-tl-sm shadow-[0_0_15px_rgba(0,242,255,0.1)]";
                header = `<div class="text-[10px] text-cyber-primary font-bold font-mono mb-1">AI KERNEL</div>`;
            } else if (type === 'other') {
                style = "bg-white/5 text-gray-200 border border-white/5 rounded-2xl rounded-tl-sm";
                header = `<div class="text-[10px] text-cyber-secondary font-mono mb-1">${sender}</div>`;
            }

            div.innerHTML = `
                <div class="p-3 border backdrop-blur-sm ${style}">
                    ${header}
                    <div class="text-sm leading-relaxed break-words">${escapeHtml(text)}</div>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addSystemMessage(text) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = "flex justify-center my-2 animate-slide-up";
            div.innerHTML = `<span class="text-[10px] uppercase tracking-widest text-gray-500 bg-black/50 px-3 py-1 rounded-full border border-white/5">${text}</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // --- 6. MEDIA SYNC ---
        
        function broadcastVideo() {
            const url = document.getElementById('video-url').value;
            if(!url) return;
            loadVideo(url);
            publish({ type: 'video', url: url });
        }

        function loadVideo(url) {
            const vid = document.getElementById('main-video');
            const overlay = document.getElementById('video-overlay');
            const frame = document.querySelector('.video-frame');
            
            vid.src = url;
            vid.play().catch(e => console.log("Auto-play prevented"));
            overlay.style.display = 'none';
            frame.classList.add('active');
            
            document.getElementById('sync-indicator').className = "text-[10px] bg-cyber-primary/20 text-cyber-primary px-2 py-0.5 rounded border border-cyber-primary/30 animate-pulse";
            document.getElementById('sync-indicator').innerText = "LIVE RX";
        }

        function playAudio(url) {
            if(currentAudio) currentAudio.pause();
            currentAudio = new Audio(url);
            currentAudio.play();
            addSystemMessage("🎵 TUNED FREQUENCY");
        }
        
        function stopAudio() {
            if(currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
        }

        // --- 7. MODALS & INIT ---

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('hidden');
            if(!modal.classList.contains('hidden')) {
                document.getElementById('api-key').value = groqKey;
                document.getElementById('user-nick').value = myNick;
            }
        }

        function saveSettings() {
            groqKey = document.getElementById('api-key').value.trim();
            myNick = document.getElementById('user-nick').value.trim() || "Guest";
            localStorage.setItem('termos_groq', groqKey);
            localStorage.setItem('termos_nick', myNick);
            toggleSettings();
            
            if(isConnected) {
                mqttClient.disconnect();
                initMQTT(); // Reconnect with new identity if needed (logic simplified)
            } else {
                initMQTT();
            }
        }

        function openRoomModal() { document.getElementById('room-modal').classList.remove('hidden'); }
        function closeRoomModal() { document.getElementById('room-modal').classList.add('hidden'); }

        function joinRoom() {
            const name = document.getElementById('new-room-name').value.trim();
            if(!name) return;
            
            if(isConnected && mqttClient.isConnected()) {
                mqttClient.unsubscribe(currentTopic);
            }
            
            currentTopic = BASE_TOPIC + name;
            document.getElementById('room-display').innerText = name.toUpperCase();
            
            if(isConnected && mqttClient.isConnected()) {
                mqttClient.subscribe(currentTopic);
                publish({ type: 'join' });
                addSystemMessage(`🚀 DOCKED AT SECTOR: ${name.toUpperCase()}`);
            } else {
                // Init will subscribe to new topic
                initMQTT();
            }
            closeRoomModal();
        }

        function toggleMedia() {
            const deck = document.getElementById('media-deck');
            deck.classList.toggle('hidden');
            deck.classList.toggle('flex');
        }

        // Start
        window.onload = () => {
            groqKey = localStorage.getItem('termos_groq') || "";
            myNick = localStorage.getItem('termos_nick') || "Traveler_" + Math.floor(Math.random()*100);
            initMQTT();
        };
        
        document.getElementById('user-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleSend(); });

    </script>
</body>
</html>
